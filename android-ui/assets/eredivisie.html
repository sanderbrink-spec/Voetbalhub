<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://media.api-sports.io https://eredivisie.b-cdn.net https://raw.githubusercontent.com data:; style-src 'unsafe-inline'; script-src 'self' file: 'unsafe-inline';"><title>Eredivisie</title><style>
:root{color-scheme:dark;--bg:#070d0b;--panel:#111e18;--muted:#a4b5aa;--green:#25f06b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#f3f7f3;font:15px/1.55 system-ui,sans-serif}button,select,input{font:inherit;color:inherit;background:#14241c;border:1px solid #304537;border-radius:20px;padding:10px 14px}button{cursor:pointer}button.active{background:var(--green);color:#081200;border-color:var(--green)}nav{display:flex;gap:8px;overflow:auto;padding:8px 14px 14px;position:sticky;top:0;background:var(--bg);z-index:2}nav button{white-space:nowrap}main{padding:0 14px 30px}h1{font-size:28px;margin:12px 0 4px;line-height:1.2}h2{font-size:20px;margin:20px 0 12px}p{margin:10px 0}.eyebrow{font-size:11px;font-weight:750;letter-spacing:1.7px;color:var(--green)}.muted,small{color:var(--muted)}.meta{padding:0 14px 10px;font-size:12px;display:flex;gap:8px;justify-content:space-between;align-items:center}.meta button{font-size:12px;padding:6px 12px}.notice{padding:12px;background:#282719;border-radius:12px;color:#eee7b3}.panel{padding:16px;background:var(--panel);border-radius:16px;margin:12px 0}.scroll{overflow:auto}table{border-collapse:collapse;width:100%;font-size:13px;font-variant-numeric:tabular-nums}td,th{text-align:right;padding:12px 7px;border-bottom:1px solid #233228;white-space:nowrap}td.club,th.club{text-align:left;min-width:135px}th{font-size:11px;color:var(--muted)}td.club img{width:22px;height:22px;object-fit:contain;vertical-align:middle;margin-right:6px}tbody tr.team{cursor:pointer}tbody tr.team:hover{background:#193023}.rank{border-left:3px solid transparent}.rank.top{border-color:var(--green)}.rank.bottom{border-color:#eb866c}.points{font-weight:800;color:var(--green)}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:16px 0;border-bottom:1px solid #263a2c;font-size:14px}.match .away{text-align:right}.score{font-size:17px;font-weight:800;white-space:nowrap}.kick{font-size:12px;color:var(--muted);text-align:center}.day{font-weight:700;color:var(--green);margin-top:24px;font-size:13px}.form{display:inline-flex;gap:3px}.form i{font-size:10px;font-style:normal;border-radius:4px;padding:2px 4px;background:#26362b}.form i.W{background:#29573a}.form i.V{background:#65392f}.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}.metric{font-size:26px;font-weight:800}.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.toolbar input{width:100%;border-radius:12px}.hero{width:100%;border-radius:16px;margin:12px 0;display:block}.preview p{color:#d1dcd3;line-height:1.8}.feature-title{font-size:32px;line-height:1.15;letter-spacing:-.7px;margin:14px 0 10px}.feature-meta{font-size:13px;color:var(--muted)}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:10px}.comparison .panel{margin:0}.comparison strong{display:block;font-size:30px;color:var(--green)}.pill{display:inline-block;padding:3px 8px;border-radius:6px;background:#203625;color:var(--green);font-size:11px}a{color:var(--green)}.error{padding:24px 14px}.empty{padding:20px 0;color:var(--muted)}.team-name{font-weight:700}button.back{padding:6px 12px}footer{padding-top:20px;font-size:11px;color:var(--muted)}
</style></head><body><div class="meta"><span id="updated">Statistieken worden geladen…</span><button onclick="location.href='app://retry'">Vernieuwen</button></div><nav id="tabs"></nav><main id="content"><div class="panel"><span class="eyebrow">EREDIVISIE</span><h1>Alles in cijfers.</h1><p class="muted">Stand, programma, uitslagen en spelersstatistieken binnen VoetbalHub.</p></div></main><script src="page-history.js"></script><script>
let data=null,tab='stand',round='',playerMetric='goals',clubId=null,search='',openFeatured=false;
const $=id=>document.getElementById(id),esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const val=x=>Number.isFinite(x)?x:'–';const done=f=>['FT','AET','PEN'].includes(f.status);
const date=(s,opts)=>new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',...opts}).format(new Date(s));
const form=s=>'<span class="form">'+String(s||'').replace(/D/g,'G').replace(/L/g,'V').split('').map(x=>'<i class="'+esc(x)+'">'+esc(x)+'</i>').join('')+'</span>';
const logo=u=>/^https:\/\/(?:media\.api-sports\.io|eredivisie\.b-cdn\.net)\//.test(u||'')?'<img alt="" src="'+esc(u)+'" onerror="this.style.display=\'none\'">':'';
window.showFeatured=function(){tab='uitgelicht';openFeatured=false;render();};
function setData(raw){try{const x=JSON.parse(raw);if(x.schemaVersion!==1||x.league.id!==88)throw Error();data=x;render();}catch(e){loadFailed();}}
function loadFailed(){if(data){$('updated').textContent='Offline · laatst opgeslagen cijfers';return;} $('content').innerHTML='<div class="error"><h2>Statistieken nog niet beschikbaar</h2><p>Er worden geen voorbeeldstanden of verzonnen cijfers getoond.</p><button onclick="location.href=\'app://retry\'">Opnieuw proberen</button></div>';}
const trail=new PageTrail();let restoreScroll=null;
function uiState(){return {tab,round,playerMetric,clubId,search,scrollY:window.scrollY};}
function applyUi(s){tab=['stand','uitslagen','programma','spelers','clubs','uitgelicht'].includes(s.tab)?s.tab:'stand';round=String(s.round||'');playerMetric=['goals','assists','yellow','red','shots','shotsOnTarget','chances','saves','passes','passAccuracy','topSpeed'].includes(s.playerMetric)?s.playerMetric:'goals';clubId=s.clubId??null;search=String(s.search||'');restoreScroll=Number(s.scrollY)||0;render();}
function pageBack(){const s=trail.pop();if(s)applyUi(s);}
function restorePageState(raw){try{const s=trail.restore(raw);if(s)applyUi(s);}catch{}}
function selectTab(x){if(tab!==x||clubId)trail.push(uiState());tab=x;clubId=null;round='';search='';openFeatured=false;render();window.scrollTo(0,0);}
function render(){if(!data)return; if(openFeatured){tab='uitgelicht';openFeatured=false;}
 $('tabs').innerHTML=[['stand','Stand'],['uitslagen','Uitslagen'],['programma','Programma'],['spelers','Spelers'],['clubs','Clubs'],['uitgelicht','Uitgelicht']].map(([id,name])=>'<button class="'+(tab===id?'active':'')+'" onclick="selectTab(\''+id+'\')">'+name+'</button>').join('');
 const age=Date.now()-Date.parse(data.updatedAt);$('updated').textContent=(age>12*3600000?'Oudere gegevens · ':'Bijgewerkt ')+date(data.updatedAt,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});
 let h='<span class="eyebrow">EREDIVISIE '+data.league.season+'/'+String(data.league.season+1).slice(-2)+'</span>';
 if(age>12*3600000)h+='<p class="notice">De gegevens zijn ouder dan 12 uur. Gebruik Vernieuwen om de laatste beschikbare update op te halen.</p>';
 if(clubId)h+=clubPage();else if(tab==='stand')h+=standings();else if(tab==='uitslagen'||tab==='programma')h+=fixturesPage();else if(tab==='spelers')h+=playersPage();else if(tab==='clubs')h+=clubs();else h+=featured();
 $('content').innerHTML=h+'<footer>Gegevens: '+esc(data.source)+'. Periodieke update, geen seconde-tot-seconde livefeed. Ontbrekende cijfers worden weergegeven als –.</footer>';trail.capture(uiState());if(restoreScroll!==null){const y=restoreScroll;restoreScroll=null;requestAnimationFrame(()=>window.scrollTo(0,y));}}
function standings(){return '<h1>De stand</h1><p class="muted">Tik op een club voor alle teamcijfers.</p><div class="scroll"><table><thead><tr><th>#</th><th class="club">Club</th><th>PT</th><th>G</th><th>DS</th><th>DV–DT</th><th>W</th><th>GL</th><th>V</th><th>Vorm</th></tr></thead><tbody>'+data.standings.map(t=>'<tr class="team" onclick="openClub(&quot;'+esc(t.team.id)+'&quot;)"><td class="rank '+(t.rank<=3?'top':t.rank>=16?'bottom':'')+'">'+t.rank+'</td><td class="club">'+logo(t.team.logo)+esc(t.team.name)+'</td>'+'<td class="points">'+t.points+'</td>'+[t.all.played,t.goalsDiff,(val(t.all.goals.for)+'–'+val(t.all.goals.against)),t.all.win,t.all.draw,t.all.lose].map(n=>'<td>'+esc(n??'–')+'</td>').join('')+'<td>'+form(t.form)+'</td></tr>').join('')+'</tbody></table></div><p class="muted"><small>G: gespeeld · GL: gelijk · DV/DT: doelpunten voor/tegen · DS: doelsaldo · PT: punten.</small></p>';}
function match(f){return '<div class="match"><div>'+esc(f.home.name)+'</div><div><div class="score">'+(done(f)?val(f.goals.home)+' – '+val(f.goals.away):['PST','CANC','ABD','SUSP'].includes(f.status)?({PST:'Uitgesteld',CANC:'Afgelast',ABD:'Gestaakt',SUSP:'Onderbroken'}[f.status]):f.status==='NS'?date(f.date,{hour:'2-digit',minute:'2-digit'}):val(f.goals.home)+' – '+val(f.goals.away))+'</div><div class="kick">'+(done(f)?'Afgelopen':!['NS','TBD','PST','CANC','ABD','SUSP'].includes(f.status)?'Bezig · '+val(f.minute)+' min':'')+'</div></div><div class="away">'+esc(f.away.name)+'</div></div>';}
function fixturesPage(){const result=tab==='uitslagen',rows=data.fixtures.filter(f=>result?done(f):!done(f));const rounds=[...new Set(rows.sort((a,b)=>Date.parse(a.date)-Date.parse(b.date)).map(f=>f.round))];if(!round||!rounds.includes(round))round=result?rounds.at(-1):rounds[0];let h='<h1>'+(result?'Uitslagen':'Het programma')+'</h1><div class="toolbar"><select aria-label="Speelronde" onchange="round=this.value;render()">'+rounds.map(r=>'<option '+(r===round?'selected':'')+'>'+esc(r)+'</option>').join('')+'</select></div>';let last='';for(const f of rows.filter(f=>f.round===round)){const day=date(f.date,{weekday:'long',day:'numeric',month:'long'});if(day!==last){h+='<div class="day">'+day+'</div>';last=day;}h+=match(f);}return h+(rows.length?'':'<p class="empty">Nog geen wedstrijden beschikbaar.</p>');}
function playersPage(){const groups={goals:['scorers','Topscorers'],assists:['assists','Assists'],yellow:['yellow','Gele kaarten'],red:['red','Rode kaarten'],shots:['shots','Schoten'],shotsOnTarget:['shotsOnTarget','Op doel'],chances:['chances','Kansen gecreëerd'],saves:['saves','Reddingen'],passes:['passes','Geslaagde passes'],passAccuracy:['passAccuracy','Passnauwkeurigheid %'],topSpeed:['topSpeed','Topsnelheid km/u']};const [key,label]=groups[playerMetric];const rows=data.players[key]||[];return '<h1>Spelers</h1><div class="toolbar">'+Object.keys(groups).map(k=>'<button class="'+(playerMetric===k?'active':'')+'" onclick="playerMetric=\''+k+'\';render()">'+groups[k][1]+'</button>').join('')+'</div><div class="scroll"><table><thead><tr><th>#</th><th class="club">'+label+'</th><th>Totaal</th><th>Duels</th><th>Minuten</th></tr></thead><tbody>'+rows.map((p,i)=>'<tr><td>'+(i+1)+'</td><td class="club"><strong>'+esc(p.name)+'</strong><br><small>'+esc(p.team)+'</small></td><td class="points">'+val(p[playerMetric])+'</td><td>'+val(p.appearances)+'</td><td>'+val(p.minutes)+'</td></tr>').join('')+'</tbody></table></div>'+(rows.length?'':'<p class="empty">Deze statistiek is nog niet beschikbaar voor dit seizoen.</p>');}
function openClub(id){if(clubId!==id)trail.push(uiState());clubId=id;render();window.scrollTo(0,0);}
function clubs(){return '<h1>Clubstatistieken</h1><p class="muted">Seizoenstotalen en thuis- en uitbalans per club.</p>'+data.standings.map(t=>'<button style="display:block;width:100%;text-align:left;margin:10px 0" onclick="openClub(&quot;'+esc(t.team.id)+'&quot;)">'+t.rank+'. '+esc(t.team.name)+' <span style="float:right">'+t.points+' pt ›</span></button>').join('');}
function clubPage(){const t=data.standings.find(t=>t.team.id===clubId);if(!t)return '';let h='<button class="back" onclick="pageBack()">‹ Terug</button><h1>'+esc(t.team.name)+'</h1><p>'+form(t.form)+'</p><div class="two"><div class="panel"><div class="metric">'+t.rank+'</div><small>Positie</small></div><div class="panel"><div class="metric">'+t.points+'</div><small>Punten</small></div></div><div class="scroll"><table><thead><tr><th class="club">Balans</th><th>G</th><th>W</th><th>GL</th><th>V</th><th>Voor</th><th>Tegen</th></tr></thead><tbody>';for(const [key,name]of [['all','Totaal'],['home','Thuis'],['away','Uit']]){const r=t[key]||{};h+='<tr><td class="club">'+name+'</td>'+[r.played,r.win,r.draw,r.lose,r.goals?.for,r.goals?.against].map(x=>'<td>'+val(x)+'</td>').join('')+'</tr>';}h+='</tbody></table></div><h2>Recente uitslagen</h2>';h+=data.fixtures.filter(f=>done(f)&&[f.home.id,f.away.id].includes(clubId)).sort((a,b)=>Date.parse(b.date)-Date.parse(a.date)).slice(0,5).map(match).join('')||'<p class="empty">Geen afgeronde wedstrijden.</p>';h+='<h2>Komende duels</h2>';h+=data.fixtures.filter(f=>!done(f)&&[f.home.id,f.away.id].includes(clubId)).sort((a,b)=>Date.parse(a.date)-Date.parse(b.date)).slice(0,5).map(match).join('')||'<p class="empty">Geen programma beschikbaar.</p>';return h;}
function featured(){const f=data.featured,p=f?.preview;if(!p||Date.parse(p.fixture.date)<=Date.now())return '<h1>Wedstrijd van de speelronde</h1><p class="empty">Twee dagen vóór de eerste aftrap van een speelronde verschijnt hier één uitgebreide vooruitblik.</p>';let h='<span class="pill">WEDSTRIJD VAN DE WEEK</span><h1 class="feature-title">'+esc(p.fixture.home.name)+' – '+esc(p.fixture.away.name)+'</h1><p class="feature-meta">'+esc(date(p.fixture.date,{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+' · '+esc(f.round)+'</p>';if(/^https:\/\/raw\.githubusercontent\.com\/sanderbrink-spec\/Voetbalhub\//.test(f.imageUrl||''))h+='<img class="hero" alt="Aankondiging van de wedstrijd in het bijbehorende stadion" src="'+esc(f.imageUrl)+'">';h+='<p class="muted">'+esc(p.standfirst)+'</p><div class="comparison">'+[p.fixture.home,p.fixture.away].map(team=>{const t=data.standings.find(t=>t.team.id===team.id);return t?'<div class="panel"><small>'+esc(team.name)+'</small><strong>'+t.points+' <span style="font-size:12px">PT</span></strong><small>Plaats '+t.rank+' · '+t.all.played+' duels</small></div>':'';}).join('')+'</div><article class="preview">'+p.body.map(x=>'<p>'+esc(x)+'</p>').join('')+'</article><h2>Laatste vijf competitieduels</h2>';for(const [name,rows]of [[p.fixture.home.name,p.homeForm],[p.fixture.away.name,p.awayForm]])h+='<h3>'+esc(name)+'</h3>'+((rows||[]).map(match).join('')||'<p class="empty">Nog geen recente duels.</p>');h+='<h2>Onderlinge ontmoetingen</h2>'+((p.headToHead||[]).map(match).join('')||'<p class="empty">Geen onderlinge cijfers beschikbaar.</p>');h+='<h2>Beschikbare topscorers</h2>'+((p.scorers||[]).map(x=>'<div class="match"><div>'+esc(x.name)+'</div><strong>'+val(x.goals)+'</strong><small>'+esc(x.team)+'</small></div>').join('')||'<p class="empty">Geen spelers in de beschikbare topscorerslijst.</p>');return h;}
</script></body></html>
