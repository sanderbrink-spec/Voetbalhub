<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mijn Veldio</title><style>
:root{color-scheme:dark;font-family:Arial,sans-serif;background:#050b08;color:#f2f6f3;--green:#b7ff39;--muted:#a9bdb0}*{box-sizing:border-box}body{margin:0}main{padding:14px 12px 26px;max-width:720px;margin:auto}button,input,select{font:inherit}button{cursor:pointer;color:inherit}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}h1{font-size:25px;margin:4px 0 10px}h2{font-size:18px;margin:0 0 9px}p{font-size:13px;line-height:1.55;color:var(--muted);margin:8px 0}.hero{border-radius:18px;padding:18px;margin-bottom:14px;background:linear-gradient(90deg,#031209f2,#03120955),url('veldio-arena.webp') center 45%/cover;border:1px solid #32523a;min-height:112px}.eyebrow{font-size:10px;font-weight:800;color:var(--green);letter-spacing:2px}.hero p{max-width:240px;color:#d8e7da}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.tile{position:relative;min-height:107px;border:1px solid #3b573b;border-radius:15px;background:radial-gradient(ellipse at 50% 0,#3b65352b,transparent 75%),linear-gradient(145deg,#122318,#060d09);padding:12px 5px 10px;box-shadow:inset 0 1px #c8ff4920,0 5px 13px #0005;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:9px;transition:transform .13s,border-color .13s}.tile:after{content:'';height:2px;width:34%;position:absolute;bottom:0;left:33%;background:#a3ed3544;border-radius:3px}.tile:active{transform:scale(.96);border-color:var(--green)}.tile img{width:34px;height:34px}.tile span{font-size:12px;line-height:1.25;font-weight:700;text-align:center;min-height:30px;display:flex;align-items:center}.panel{background:linear-gradient(140deg,#14291d,#09120d);padding:18px;border:1px solid #2d4434;border-radius:16px;margin:14px 0}.quiet{font-size:11px;color:#9bab9f}.primary,.secondary{border:0;border-radius:12px;padding:13px 15px;min-height:46px;font-weight:700}.primary{background:var(--green);color:#102004}.secondary{background:#18291f;color:#d7eadc;border:1px solid #3c5846}.bar{display:flex;gap:8px;margin:10px 0}.bar button{flex:1}label{display:block;margin:12px 0 6px;font-size:13px}input,select{width:100%;border:1px solid #58705c;border-radius:10px;background:#08130c;color:#fff;padding:12px}input[type=checkbox]{width:22px;height:22px;accent-color:var(--green)}.toggle{display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:52px}.scores{display:grid;grid-template-columns:1fr 1fr;gap:12px}.club-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.club{border:1px solid #385342;background:#0d1d13;border-radius:14px;padding:15px 8px;display:flex;gap:10px;align-items:center;text-align:left;min-height:79px}.emblem{border:1px solid #c9dfca;border-radius:9px;background:var(--club-color,#236640);color:white;padding:10px 5px;min-width:42px;text-align:center;font-size:12px;font-weight:800}.club strong{font-size:12px}.tag{color:var(--green);font-size:11px}.note{color:#e4d39b}#status{font-size:12px;min-height:18px;color:#c9ddcc}a{color:var(--green)}@media(min-width:500px){.tile{min-height:123px}.tile span{font-size:14px}}@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><main id="app"></main><script src="club-directory.js"></script><script>
'use strict';const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const destinations=[['news','Nieuws'],['fixtures','Wedstrijden'],['competitions','Competities'],['predictions','Voorspellen'],['quiz','Club Quiz'],['stadium','Stadion van de Week'],['column','De Derde Helft'],['videos',"Video's"],['standings','Standen'],['clubs','Clubs'],['favorites','Favorieten'],['notifications','Meldingen']];
let state={mode:'home',stats:{},predictions:[],notifications:{},loading:false},club='';const bridge=(method,data='')=>window.VeldioDestinations?.[method]?.(typeof data==='string'?data:JSON.stringify(data));
function score(f){return f.goals||f.score;}
function fixtures(){return(state.stats?.fixtures||[]).filter(f=>f.id&&f.home?.name&&f.away?.name&&Number.isFinite(Date.parse(f.date)));}
function date(v){try{return new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(v));}catch{return '';}}
function setData(raw){state=JSON.parse(raw);render();}function result(ok,message){const s=document.querySelector('#status');if(s)s.textContent=message|| (ok?'Opgeslagen op dit apparaat.':'Opslaan mislukt.');}
function render(){document.body.dataset.section=state.mode;let h='';if(state.mode==='home'){h='<div class="hero"><span class="eyebrow">MIJN VELDIO</span><h1>Alles voetbal.<br>Eén plek.</h1><p>Kies jouw onderdeel.</p></div><nav class="grid" aria-label="Veldio startmenu">'+destinations.map(([id,label])=>'<button class="tile" data-route="'+id+'"><img src="icons/'+id+'.svg" alt=""><span>'+esc(label)+'</span></button>').join('')+'</nav>';}
else if(state.mode==='myclub'){const names=state.clubs||[];h='<div class="hero"><span class="eyebrow">MIJN CLUB</span><h1>Jouw club centraal.</h1><p>Nieuws en clubkeuzes op één plek.</p></div>';h+=names.length?names.map(name=>'<section class="panel"><span class="tag">GEVOLGD</span><h2>'+esc(name)+'</h2><button class="primary" data-club-news="'+esc(name)+'">Clubnieuws</button></section>').join(''):unavailable('Kies eerst je club','Voeg je club toe bij Favorieten. Je keuze wordt op dit apparaat opgeslagen.');h+='<button class="secondary" data-route="favorites">Clubs beheren</button>';}
else if(state.mode==='clubs'){h='<h1>Clubs</h1><p>De Nederlandse clubgids. De eigen emblemen zijn geen officiële clublogo’s.</p><div class="bar"><button class="secondary" data-route="favorites">Mijn favorieten</button></div>';
const teams=window.VELDIO_CLUB_DIRECTORY||[];if(club){const t=teams.find(t=>t.name===club);h+='<section class="panel"><span class="tag">CLUBGIDS</span><h2>'+esc(club)+'</h2><p>Volg deze club bij Favorieten en lees de beschikbare eigen artikelen.</p><button class="primary" data-club-news="'+esc(club)+'">Clubnieuws</button><p class="quiet">Wedstrijdcijfers verschijnen zodra een toegestane gegevensbron beschikbaar is.</p></section>';}
h+='<div class="club-list">'+teams.map(t=>'<button class="club" data-club="'+esc(t.name)+'"><span class="emblem" style="--club-color:'+(/^#[0-9a-f]{6}$/i.test(t.color)?t.color:'#236640')+'">'+esc(t.code)+'</span><strong>'+esc(t.name)+'</strong></button>').join('')+'</div>';}
else if(state.mode==='fixtures'){h='<h1>Wedstrijden</h1><p>Programma en uitslagen uit goedgekeurde wedstrijdgegevens.</p>';const rows=fixtures();h+=rows.length?rows.map(f=>'<section class="panel"><span class="tag">'+esc(date(f.date))+'</span><h2>'+esc(f.home.name)+' – '+esc(f.away.name)+'</h2><p>'+esc(['FT','AET','PEN'].includes(f.status)&&score(f)?score(f).home+' – '+score(f).away:f.status==='NS'?'Gepland':f.status)+'</p></section>').join(''):unavailable('Nog geen wedstrijdgegevens','De wedstrijdbron is momenteel niet beschikbaar of niet voor publicatie vrijgegeven. Er worden geen voorbeeldwedstrijden getoond.');h+='<button class="secondary" id="refresh">Opnieuw laden</button>';}
else if(state.mode==='predictions'){h='<h1>Voorspellen</h1><p>Bewaar je voorspelling vóór de aftrap op dit apparaat.</p>';const upcoming=fixtures().filter(f=>['NS','TBD'].includes(f.status)&&Date.parse(f.date)>Date.now());if(upcoming.length)h+='<form id="prediction"><label for="fixture">Wedstrijd</label><select id="fixture">'+upcoming.map(f=>'<option value="'+esc(f.id)+'">'+esc(f.home.name+' – '+f.away.name)+'</option>').join('')+'</select><div class="scores"><label>Thuis<input id="homeGoals" inputmode="numeric" type="number" min="0" max="30" required></label><label>Uit<input id="awayGoals" inputmode="numeric" type="number" min="0" max="30" required></label></div><button class="primary" type="submit">Voorspelling opslaan</button></form>';else h+=unavailable('Geen wedstrijden om te voorspellen','Zodra gecontroleerde toekomstige wedstrijden beschikbaar zijn, kun je hier een uitslag invoeren.');
h+='<div id="status" role="status"></div><h2>Mijn voorspellingen</h2>'+(state.predictions?.length?state.predictions.map(p=>{const f=fixtures().find(f=>String(f.id)===String(p.fixtureId));const final=f&&['FT','AET','PEN'].includes(f.status)&&Number.isInteger(score(f)?.home)&&Number.isInteger(score(f)?.away);const points=final?(p.home===score(f).home&&p.away===score(f).away?3:Math.sign(p.home-p.away)===Math.sign(score(f).home-score(f).away)?1:0):null;return '<section class="panel"><h2>'+esc(p.label)+'</h2><p>Jouw voorspelling: '+esc(p.home)+' – '+esc(p.away)+'</p><span class="tag">'+(points===null?'Wacht op gecontroleerde eindstand':points+' punten · eindstand '+esc(score(f).home)+' – '+esc(score(f).away))+'</span></section>';}).join(''):'<p>Nog geen opgeslagen voorspellingen.</p>')+'<p class="quiet">3 punten voor de exacte uitslag, 1 voor de juiste winnaar of een gelijkspel. Alleen een gecontroleerde eindstand telt. Geen online ranglijst voor voorspellen.</p>';}
else if(state.mode==='notifications'){const n=state.notifications||{};h='<h1>Meldingen</h1><p>Kies welke nieuwe berichten je wilt volgen.</p><section class="panel"><label class="toggle">Nieuw clubnieuws<input type="checkbox" id="clubNews" '+(n.clubNews?'checked':'')+'></label><label class="toggle">Nieuwe column<input type="checkbox" id="columns" '+(n.columns?'checked':'')+'></label><button class="primary" id="saveNotifications">Voorkeuren opslaan</button><div id="status" role="status"></div></section><p class="quiet">Nieuws- en columnmeldingen worden gecontroleerd zolang de app geopend is. De gekozen favoriete clubs bepalen het clubnieuws.</p><section class="panel"><h2>Android-toestemming</h2><p>'+ (n.permission?'Meldingen zijn toegestaan.':'Android-meldingen zijn nog niet toegestaan.')+'</p><button class="secondary" id="permission">Toestemming instellen</button></section><p class="note">Achtergrondpush en wedstrijdherinneringen zijn nog niet beschikbaar.</p>';}
document.querySelector('#app').innerHTML=h;document.querySelectorAll('[data-route]').forEach(b=>b.onclick=()=>bridge('open',b.dataset.route));document.querySelectorAll('[data-club]').forEach(b=>b.onclick=()=>{club=b.dataset.club;render();window.scrollTo(0,0);});document.querySelectorAll('[data-club-news]').forEach(b=>b.onclick=()=>bridge('clubNews',b.dataset.clubNews));document.querySelector('#refresh')?.addEventListener('click',()=>bridge('refresh'));document.querySelector('#permission')?.addEventListener('click',()=>bridge('permission'));document.querySelector('#saveNotifications')?.addEventListener('click',()=>bridge('notifications',{clubNews:document.querySelector('#clubNews').checked,columns:document.querySelector('#columns').checked}));document.querySelector('#prediction')?.addEventListener('submit',e=>{e.preventDefault();bridge('predict',{fixtureId:document.querySelector('#fixture').value,home:Number(document.querySelector('#homeGoals').value),away:Number(document.querySelector('#awayGoals').value)});});}
function unavailable(title,message){return '<section class="panel"><span class="tag">'+(state.loading?'BEZIG MET LADEN':'MOMENTEEL NIET BESCHIKBAAR')+'</span><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p></section>';}render();
</script></html>
