<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' file:; script-src 'self' file:; style-src 'unsafe-inline'"><title>Veldio Clubquiz</title><style>
:root{color-scheme:dark;--green:#b6ff32}*{box-sizing:border-box}body{margin:0;background:#050907;color:#f4f8f5;font:16px/1.5 system-ui}main{max-width:720px;margin:auto;padding:0 18px 32px}header{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid #243329;gap:12px}header strong{letter-spacing:2px;color:var(--green);font-size:13px}button,select{font:inherit;color:inherit;background:#142019;border:1px solid #344a3c;border-radius:10px;min-height:48px;padding:12px;cursor:pointer}button:focus-visible,select:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:3px}h1{font-size:clamp(32px,8vw,52px);letter-spacing:-1.5px;line-height:1.08;margin:30px 0 18px}h1 span{color:var(--green)}h2{font-size:clamp(23px,6vw,32px);line-height:1.25;margin:14px 0 22px;overflow-wrap:anywhere}.muted,figcaption{color:#a9b7ae;font-size:12px}label{display:block;margin:18px 0 7px}select{width:100%}.primary{background:var(--green);color:#0a160b;border:0;font-weight:800;width:100%;margin-top:22px}figure{margin:20px 0}figure img{width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border-radius:14px}figcaption{padding-top:8px;overflow-wrap:anywhere}a{color:#b6ff92}#answers{display:grid;gap:10px}#answers button{text-align:left;display:flex;align-items:center;gap:14px}#answers button span{border:1px solid #4a5b50;border-radius:6px;padding:3px 9px;color:var(--green)}#answers button:disabled{opacity:1;cursor:default}#answers button.correct{border-color:var(--green);background:#24391c}#answers button.wrong{border-color:#ff9c9c;background:#3e2020}.meta{display:flex;justify-content:space-between;gap:8px;color:var(--green);font-size:13px;margin-top:24px}progress{width:100%;height:6px;accent-color:var(--green)}#feedback{min-height:30px;margin:18px 0;font-size:14px}#score{font-size:64px;color:var(--green);font-weight:900}.note{padding:14px;background:#111e16;border-radius:10px}button[hidden],section[hidden]{display:none}#error{color:#ffb2b2} .eyebrow{letter-spacing:2px;font-size:12px;color:var(--green);margin-top:24px}
</style></head><body><header><button id="back">← Terug</button><strong>VELDIO · CLUBQUIZ</strong></header><main>
<section id="setup"><div class="eyebrow">CLUBS · STADIONS · HISTORIE</div><h1>Hoe goed ken<br>jij het <span>voetbal?</span></h1><p>Tien vragen. Vier keuzes. Eén eindscore.</p><p class="muted" id="bankSize"></p><label for="level">Moeilijkheid</label><select id="level"><option value="easy">Basis · Competities</option><option value="normal">Gevorderd · Stadions</option><option value="hard">Expert · De Kuip</option></select><button id="start" class="primary">Start de quiz →</button><p id="error" role="status"></p><p class="muted note">De quiz werkt offline. Recente vragen worden op dit apparaat onthouden. Competitievragen gelden voor seizoen 2026/27.</p></section>
<section id="play" hidden><div class="meta"><span id="position"></span><span id="points"></span></div><progress id="progress" max="10" value="0" aria-label="Beantwoorde vragen"></progress><figure><img id="photo" alt=""><figcaption id="credit"></figcaption></figure><h2 id="question" tabindex="-1"></h2><div id="answers"></div><div id="feedback" role="status" aria-live="polite"></div><button id="next" class="primary" hidden>Volgende vraag →</button></section>
<section id="result" hidden><div class="eyebrow">EINDRESULTAAT</div><h1>De balans<br>na <span>tien vragen.</span></h1><div id="score"></div><p id="verdict"></p><button id="again" class="primary">Nieuwe ronde →</button></section>
</main><script src="clubquiz-engine.js"></script><script src="clubquiz-bank.js"></script><script src="clubquiz-ui.js"></script></body></html>
