<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https: data:; style-src 'unsafe-inline'; script-src 'self' file: 'unsafe-inline';"><title>Mijn VoetbalHub</title><style>
:root{color-scheme:dark;--green:#25f06b;--muted:#a0afa6;--border:#23372b}*{box-sizing:border-box}[hidden]{display:none!important}body{margin:0;background:#050807;color:#f3f7f4;font:15px/1.5 system-ui,sans-serif}main{max-width:760px;margin:auto;padding:18px 14px 32px}button,input{font:inherit}button{color:inherit;cursor:pointer}button:focus-visible,input:focus-visible{outline:2px solid var(--green);outline-offset:3px}button{border:0;background:none}header{display:flex;align-items:center;gap:12px;margin-bottom:18px}header>div{flex:1;min-width:0}header h1{font-size:26px;letter-spacing:-.6px;margin:0}header p{font-size:12px;color:var(--muted);margin:2px 0 0}.back{flex:0 0 42px;font-size:26px;min-width:42px;min-height:44px;border:1px solid var(--border);border-radius:50%}.status{color:var(--muted);font-size:11px;margin:8px 0 14px}.tabs{display:flex;gap:8px;margin-bottom:20px}.tabs button,.pill{border:1px solid var(--border);border-radius:24px;padding:9px 16px;min-height:44px}.tabs button[aria-selected=true],.primary{color:#041309;background:var(--green);border-color:var(--green);font-weight:750}.section-head{display:flex;justify-content:space-between;gap:12px;align-items:center;margin:20px 0 12px}h2{font-size:19px;letter-spacing:-.3px;margin:0}.text-button{color:var(--green);font-weight:650;padding:8px 0;min-height:44px;font-size:12px}.panel{border:1px solid var(--border);background:#0c1711;border-radius:16px;padding:16px}.empty p{color:var(--muted);font-size:13px;margin:8px 0 15px}.empty h2{font-size:18px}.clubs{display:grid;gap:10px}.club{display:flex;gap:13px;align-items:center;text-align:left;width:100%;padding:15px;border:1px solid #2e4838;border-radius:14px;background:linear-gradient(110deg,#173a27,#0b1811)}.crest{width:46px;height:46px;object-fit:contain;flex-shrink:0}.club strong{display:block;font-size:17px}.club small{display:block;color:var(--muted);font-size:11px;margin-top:3px}.club .star{margin-left:auto;color:var(--green);font-size:21px}.club-picker{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin:12px 0}.club-choice{display:flex;align-items:center;gap:9px;text-align:left;border:1px solid var(--border);background:#0d1812;border-radius:12px;padding:10px;min-height:64px;font-size:12px}.club-choice img{width:30px;height:30px;object-fit:contain}.club-choice[aria-pressed=true]{border-color:var(--green);background:#123622}.club-choice span{overflow-wrap:anywhere}.check{color:var(--green);margin-left:auto}.fixture{padding:13px 0;border-bottom:1px solid var(--border)}.fixture:last-child{border:0;padding-bottom:0}.fixture .date{font-size:11px;color:var(--muted);margin-bottom:7px}.fixture .teams{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;font-size:13px}.fixture .away{text-align:right}.fixture .score{color:var(--green);font-weight:750;white-space:nowrap}.news{display:grid;gap:9px}.row{display:flex;gap:12px;align-items:center;text-align:left;width:100%;padding:10px;border-radius:13px;background:#0d1611;border:1px solid var(--border)}.row .thumb{width:35%;max-width:148px;min-height:92px;height:auto;align-self:stretch;object-fit:cover;border-radius:7px;background:#071009;flex-shrink:0}.row-copy{min-width:0;flex:1}.category{font-size:9px;color:var(--green);font-weight:750;text-transform:uppercase}.row h3{font-size:17px;line-height:1.35;margin:6px 0;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.row time{font-size:10px;color:var(--muted)}.saved-row .remove{width:100%;text-align:right;color:var(--muted);font-size:11px;min-height:44px;padding:8px}.search-wrap{position:relative}.search-wrap input{display:block;width:100%;background:#0d1812;border:1px solid #365440;border-radius:13px;color:#f3f7f4;padding:14px 42px 14px 14px;min-height:50px}.search-wrap input::-webkit-search-cancel-button{display:none}.search-wrap input::placeholder{color:#8c9e92}.clear{position:absolute;right:5px;top:3px;min-width:42px;min-height:44px;font-size:23px;color:var(--muted)}.hint{color:var(--muted);font-size:12px;margin:12px 0}.suggestions{display:flex;flex-wrap:wrap;gap:8px;margin:16px 0}.suggestions button{font-size:12px;padding:8px 13px;border-radius:20px;border:1px solid var(--border);min-height:44px}.count{color:var(--muted);font-size:12px;margin:20px 0 12px}.more{width:100%;margin-top:16px}.note{font-size:11px;color:var(--muted);margin-top:12px}.hidden{display:none!important}
</style></head><body><main><header><button class="back" aria-label="Terug naar vorig scherm" onclick="bridge('back')">‹</button><div><h1 id="heading">Mijn VoetbalHub</h1><p id="subtitle">Jouw clubs. Jouw leeslijst.</p></div></header><nav class="tabs" aria-label="Favorieten"><button id="clubsTab" role="tab" aria-selected="true" onclick="setTab('clubs')">Mijn clubs</button><button id="savedTab" role="tab" aria-selected="false" onclick="setTab('saved')">Bewaard</button></nav><div id="status" class="status" role="status">Gegevens laden…</div><section id="search" hidden><label for="query" class="hidden">Zoek in eigen artikelen</label><div class="search-wrap"><input id="query" type="search" maxlength="160" placeholder="Club, speler of onderwerp" autocomplete="off" aria-label="Zoek in eigen artikelen"><button class="clear" aria-label="Zoekterm wissen" onclick="searchFor('')">×</button></div><div id="suggestions" class="suggestions"></div></section><section id="content"></section></main><script src="page-history.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const normalize=s=>String(s??'').normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/[^a-z0-9]+/g,' ').trim();
const bridge=(method,value)=>{if(window.PersonalHub&&typeof window.PersonalHub[method]==='function')window.PersonalHub[method](value??'');};
const validImage=url=>/^https:\/\//i.test(url||'')?esc(url):'';
let state={articles:[],saved:[],stats:{},clubs:[],loading:true},initialized=false,selected=new Set(),tab='clubs',editing=false,limit=30,query='';
const trail=new PageTrail();let uiRestored=false,restoreScroll=null;
function uiState(){return {mode:state.mode,tab,editing,limit,query,scrollY:window.scrollY};}
function applyUi(s){uiRestored=true;state.mode=s.mode==='search'?'search':'favorites';tab=s.tab==='saved'?'saved':'clubs';editing=!!s.editing;limit=Math.max(30,Math.min(300,Number(s.limit)||30));query=String(s.query||'').slice(0,160);document.getElementById('query').value=query;restoreScroll=Number(s.scrollY)||0;if(initialized)render();}
function pageBack(){const previous=trail.pop();if(previous)applyUi(previous);else bridge('back');}
function restorePageState(raw){try{const s=trail.restore(raw);if(s)applyUi(s);}catch{}}
function startSearch(value){trail.push(uiState());state.mode='search';searchFor(value);}
function unique(rows){const ids=new Set();return(rows||[]).filter(a=>a&&a.id&&a.status==='published'&&a.headline&&!ids.has(a.id)&&ids.add(a.id)).sort((a,b)=>String(b.publishedAt||'').localeCompare(String(a.publishedAt||'')));}
function allArticles(){return unique([...(state.articles||[]),...(state.saved||[])]);}
function aliases(name){const n=normalize(name);const map={'psv':['psv','psv eindhoven'],'psv eindhoven':['psv','psv eindhoven'],'nec':['nec','n e c'],'n e c':['nec','n e c'],'sc heerenveen':['sc heerenveen','heerenveen'],'fc groningen':['fc groningen','groningen'],'az':['az','az alkmaar'],'az alkmaar':['az','az alkmaar'],'fc twente':['fc twente','twente'],'fc utrecht':['fc utrecht','utrecht']};return map[n]||[n];}
function mentions(article,club){const hay=' '+normalize([article.headline,article.standfirst,(article.tags||[]).join?.(' ')||''].join(' '))+' ';return aliases(club).some(a=>hay.includes(' '+a+' '));}
function sameClub(a,b){return aliases(a).some(x=>aliases(b).includes(x));}
function clubRows(){return state.stats.clubOptions||(state.stats.standings||[]).map(x=>x.team).filter(Boolean);}
function isSelected(name){return[...selected].some(x=>sameClub(x,name));}
function date(value,options){try{return new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',...options}).format(new Date(value));}catch{return '';}}
function stamp(a){return date(a.publishedAt,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function news(rows,empty){if(!rows.length)return '<div class="panel empty"><h2>'+esc(empty)+'</h2><p>'+(state.loading?'De artikelen worden bijgewerkt.':'Nieuwe artikelen verschijnen hier zodra de redactie ze publiceert.')+'</p></div>';return '<div class="news">'+rows.slice(0,limit).map(a=>'<button class="row" data-article="'+esc(a.id)+'">'+(/^https:\/\//.test(a.imageUrl||'')&&['cleared','licensed'].includes(a.imageRights)?'<img class="thumb" alt="" loading="lazy" src="'+validImage(a.imageUrl)+'">':'')+'<div class="row-copy"><div class="category">'+esc(a.category||'VoetbalHub')+'</div><h3>'+esc(a.headline)+'</h3><time>'+esc(stamp(a))+'</time></div></button>').join('')+'</div>'+(rows.length>limit?'<button class="pill more" id="more">Meer berichten ('+(rows.length-limit)+')</button>':'');}
function setTab(value){if(tab!==value)trail.push(uiState());tab=value;editing=false;limit=30;render();}
function searchFor(value){query=value;document.getElementById('query').value=value;limit=30;render();}
document.getElementById('query').addEventListener('input',event=>{query=event.target.value;limit=30;render();});
function toggleClub(name){if(isSelected(name)){for(const item of [...selected])if(sameClub(item,name))selected.delete(item);}else selected.add(name);bridge('saveClubs',JSON.stringify([...selected]));render();}
function nextFixture(team){return(state.stats.fixtures||[]).filter(f=>['NS','TBD'].includes(f.status)&&new Date(f.date)>new Date()&&(String(f.home.id)===String(team.id)||String(f.away.id)===String(team.id))).sort((a,b)=>new Date(a.date)-new Date(b.date))[0];}
function clubsContent(){let h='<div class="section-head"><h2>Mijn favoriete clubs</h2><button class="text-button" id="edit">'+(editing?'Gereed':'Bewerken')+'</button></div>';
 const teams=clubRows();for(const name of selected)if(!teams.some(t=>sameClub(t.name,name)))teams.push({name});
 if(editing){h+='<p class="hint">Tik op een club om deze te volgen. Je keuze wordt direct bewaard.</p><div class="club-picker">'+teams.map(t=>'<button class="club-choice" data-club="'+esc(t.name)+'" aria-pressed="'+isSelected(t.name)+'">'+(t.logo?'<img alt="" src="'+validImage(t.logo)+'">':'')+'<span>'+esc(t.name)+'</span><span class="check">'+(isSelected(t.name)?'✓':'+')+'</span></button>').join('')+'</div>';if(!teams.length)h+='<p class="hint">De actuele Eredivisieclubs zijn nog niet beschikbaar. Bestaande voorkeuren blijven bewaard.</p>';}
 if(!selected.size){h+='<div class="panel empty"><h2>Volg het voetbal van jouw clubs</h2><p>Kies je clubs voor hun laatste nieuws en eerstvolgende competitiewedstrijd.</p><button class="pill primary" id="choose">Kies mijn clubs</button></div>';return h;}
 h+='<div class="clubs">'+[...selected].map(name=>{const t=teams.find(t=>sameClub(t.name,name)),standing=t&&(state.stats.standings||[]).find(x=>String(x.team.id)===String(t.id));return '<button class="club" data-filter="'+esc(name)+'">'+(t?.logo?'<img class="crest" alt="" src="'+validImage(t.logo)+'">':'')+'<span><strong>'+esc(name)+'</strong><small>'+(standing?'Eredivisie · Plaats '+esc(standing.rank)+' · '+esc(standing.points)+' punten':'Gevolgd')+'</small></span><span class="star">★</span></button>';}).join('')+'</div>';
 const fixtures=new Map();for(const t of teams.filter(t=>isSelected(t.name))){const f=nextFixture(t);if(f)fixtures.set(String(f.id),f);}
 if(fixtures.size){h+='<div class="section-head"><h2>Eerstvolgende wedstrijden</h2></div><div class="panel">'+[...fixtures.values()].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(f=>'<div class="fixture"><div class="date">'+esc(date(f.date,{weekday:'long',day:'numeric',month:'short'}))+'</div><div class="teams"><span>'+esc(f.home.name)+'</span><span class="score">'+(f.status==='TBD'?'Tijd volgt':esc(date(f.date,{hour:'2-digit',minute:'2-digit'})))+'</span><span class="away">'+esc(f.away.name)+'</span></div></div>').join('')+'</div>';}
 if(state.stats.updatedAt)h+='<p class="note">Competitiecijfers bijgewerkt: '+esc(date(state.stats.updatedAt,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))+'</p>';
 const rows=unique(state.articles).filter(a=>[...selected].some(club=>mentions(a,club)));
 return h+'<div class="section-head"><h2>Nieuws van mijn clubs</h2></div>'+news(rows,'Nog geen nieuws van jouw clubs');}
function savedContent(){const rows=unique(state.saved);return '<div class="section-head"><h2>Jouw leeslijst</h2><span class="hint">'+rows.length+' bewaard</span></div><p class="hint">Bewaarde artikelen blijven op dit apparaat beschikbaar, ook zonder internet. Afbeeldingen kunnen internet nodig hebben.</p>'+(rows.length?rows.map(a=>'<div class="saved-row">'+news([a],'')+'<button class="remove" data-remove="'+esc(a.id)+'">Verwijderen uit leeslijst</button></div>').join(''):'<div class="panel empty"><h2>Je leeslijst is nog leeg</h2><p>Open een artikel en tik op Bewaren om het hier terug te vinden.</p></div>');}
function searchContent(){const terms=normalize(query).split(' ').filter(Boolean),rows=allArticles().filter(a=>{const text=normalize([a.headline,a.standfirst,a.category,...(Array.isArray(a.body)?a.body:[])].join(' '));return terms.every(term=>(' '+text+' ').includes(' '+term)||text.includes(term));});
 document.getElementById('suggestions').innerHTML=terms.length?'':[...selected].slice(0,4).concat(['Transfers','Eredivisie']).map(x=>'<button data-suggest="'+esc(x)+'">'+esc(x)+'</button>').join('');
 if(!terms.length)return '<p class="hint">Doorzoek koppen en volledige teksten van eigen artikelen en je leeslijst.</p><div class="section-head"><h2>Alle eigen artikelen</h2></div>'+news(rows,'Nog geen artikelen beschikbaar');
 return '<p class="count" role="status">'+rows.length+' '+(rows.length===1?'artikel':'artikelen')+' voor “'+esc(query)+'”</p>'+news(rows,'Geen artikelen gevonden');}
function render(){const search=state.mode==='search';document.getElementById('heading').textContent=search?'Zoeken':'Mijn VoetbalHub';document.getElementById('subtitle').textContent=search?'Eigen nieuws en je bewaarde artikelen':'Jouw clubs. Jouw leeslijst.';document.querySelector('.tabs').hidden=search;document.getElementById('search').hidden=!search;document.getElementById('clubsTab').setAttribute('aria-selected',tab==='clubs');document.getElementById('savedTab').setAttribute('aria-selected',tab==='saved');document.getElementById('savedTab').textContent='Bewaard'+(state.saved?.length?' ('+state.saved.length+')':'');document.getElementById('status').textContent=state.offline?'Verbinding beperkt · laatst opgeslagen gegevens':state.loading?'Gegevens bijwerken…':'Eigen redactie · VoetbalHub';document.getElementById('content').innerHTML=search?searchContent():tab==='saved'?savedContent():clubsContent();trail.capture(uiState());if(restoreScroll!==null){const y=restoreScroll;restoreScroll=null;requestAnimationFrame(()=>window.scrollTo(0,y));}}
document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement)event.target.hidden=true;},true);
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.article)bridge('openArticle',b.dataset.article);if(b.dataset.club)toggleClub(b.dataset.club);if(b.dataset.filter)startSearch(b.dataset.filter);if(b.dataset.remove)bridge('removeSaved',b.dataset.remove);if(b.dataset.suggest)searchFor(b.dataset.suggest);if(b.id==='more'){limit+=30;render();}if(b.id==='edit'||b.id==='choose'){if(editing)pageBack();else{trail.push(uiState());editing=true;render();}}});
function setData(raw){try{const next=JSON.parse(raw);if(!initialized){selected=new Set(next.clubs||[]);if(!uiRestored)query=next.query||'';document.getElementById('query').value=query;initialized=true;}state={...next,mode:state.mode||next.mode,articles:Array.isArray(next.articles)?next.articles:[],saved:Array.isArray(next.saved)?next.saved:[],stats:next.stats||{}};render();}catch{document.getElementById('status').textContent='Gegevens konden niet worden geladen.';}}
</script></body></html>
