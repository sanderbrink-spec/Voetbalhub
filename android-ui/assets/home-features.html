<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src 'self' https: file: data:; style-src 'unsafe-inline'; script-src 'self' file: 'unsafe-inline';"><title>VoetbalHub</title><style>
:root{color-scheme:dark;--green:#25f06b;--muted:#b3bfb7}*{box-sizing:border-box}body{margin:0;background:#050c08;color:#f5f8f6;font:14px/1.35 system-ui,sans-serif}button{font:inherit;color:inherit;background:none;border:0;padding:0;text-align:left;cursor:pointer}button:focus-visible{outline:2px solid white;outline-offset:-3px}button:disabled{cursor:default}.hero{position:relative;height:clamp(245px,62vw,390px);overflow:hidden;background:radial-gradient(ellipse at 70% 30%,#195336,#07170e 70%);touch-action:pan-y}.slide{position:absolute;inset:0;opacity:0;visibility:hidden;transition:opacity .45s}.slide.active{opacity:1;visibility:visible}.cover{position:absolute;width:100%;height:100%;object-fit:cover}.column-cover{object-fit:contain;object-position:100% 0;width:62%;right:0}.shade{position:absolute;inset:0;background:linear-gradient(0deg,#020a06 0%,#020a06c9 22%,#020a0622 70%)}.column-slide .shade{background:linear-gradient(90deg,#06190f 5%,#06190f8c 60%,transparent),linear-gradient(0deg,#020a06 0%,transparent 40%)}.slide-link{position:absolute;inset:0;padding:35px 29px 32px;display:flex;flex-direction:column;justify-content:flex-end;width:100%}.badge{align-self:flex-start;background:var(--green);color:#031208;font-size:11px;font-weight:850;letter-spacing:.4px;padding:4px 6px;border-radius:3px}.hero h1{font-size:clamp(24px,6.1vw,38px);line-height:1.1;letter-spacing:-.6px;max-width:92%;margin:9px 0;font-weight:850;text-wrap:balance;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}.column-slide h1{max-width:60%;font-size:31px}.column-slide h1 span{color:var(--green);display:block;font-size:43px}.hero .meta{font-size:11px;color:#dae5de;max-width:94%}.arrow{position:absolute;top:43%;height:46px;width:28px;font-size:38px;text-align:center;text-shadow:0 1px 8px #000;z-index:2}.arrow.prev{left:0}.arrow.next{right:0}.dots{position:absolute;bottom:9px;left:50%;transform:translateX(-50%);display:flex;align-items:center;z-index:3}.dot{width:23px;height:25px;display:grid;place-items:center}.dot:after{content:'';width:8px;height:8px;background:#b6bdb8;border-radius:50%}.dot[aria-current=true]:after{background:var(--green)}.pause{position:absolute;right:8px;bottom:6px;font-size:10px;padding:7px;background:#0007;border-radius:14px;z-index:3}.teasers{display:grid;grid-template-columns:1fr 1fr;gap:7px;padding:7px 6px 0}.teaser{position:relative;min-width:0;height:160px;border:1px solid #24984c;border-radius:11px;overflow:hidden;background:#092017}.column-card img{position:absolute;right:-5%;height:111%;width:70%;object-fit:contain;object-position:100% 0}.column-card:after{content:'';position:absolute;inset:0;background:linear-gradient(90deg,#062416 1%,#062416bd 48%,transparent 85%)}.column-copy{position:relative;z-index:1;padding:12px 8px}.mini-label{font-size:9px;letter-spacing:.3px;color:var(--green);font-weight:850}.column-copy h2{font-size:18px;line-height:1.05;margin:9px 0 3px;font-weight:850}.column-copy h2 span{color:var(--green);display:block;font-size:28px}.author{font-size:9px;color:var(--green)}.tagline{font-size:8px;margin-top:3px}.pill{display:inline-block;background:var(--green);color:#04140a;padding:6px 8px;border-radius:20px;font-size:9px;font-weight:800;margin-top:9px}.match-card{padding:9px 8px;display:flex;flex-direction:column;justify-content:space-between;text-align:center;background:radial-gradient(ellipse at top,#193c2a,#05110a)}.match-card>.cover{inset:0;opacity:.4}.match-card>div,.match-card>span{position:relative}.match-card .mini-label{text-align:left;font-size:8px}.crests{display:flex;align-items:center;justify-content:space-around;gap:4px;margin:6px 0 2px}.crest{width:38px;height:37px;object-fit:contain}.match-card h2{font-size:17px;line-height:1.1;margin:4px 0 6px;letter-spacing:-.4px}.match-date{font-size:8px;color:#d4dfd7}.match-round{font-size:8px;color:#abbcaf;margin-top:4px}.match-action{color:var(--green);font-size:9px;font-weight:800;margin-top:6px}.match-hero .crests{justify-content:flex-start;gap:22px}.match-hero .crest{width:58px;height:54px}.rail-section{padding:0 6px 7px;margin-top:5px}.section-head{display:flex;justify-content:space-between;align-items:center;gap:7px;margin:0 0 7px;padding-top:5px}.section-head h2{font-size:13px;letter-spacing:.1px;margin:0;border-left:2px solid var(--green);padding-left:7px}.section-head button{font-size:10px;color:var(--green);min-height:32px;white-space:nowrap}.rail-wrap{position:relative}.rail{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;scroll-snap-type:x mandatory;padding-bottom:3px;touch-action:pan-x pan-y}.rail::-webkit-scrollbar{display:none}.rail.expanded{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));overflow:hidden}.rail.expanded .video{min-width:0}.video{flex:0 0 35%;min-width:128px;scroll-snap-align:start}.thumbnail{position:relative;aspect-ratio:16/9;background:#12251a;border-radius:5px;overflow:hidden}.thumbnail img{width:100%;height:100%;object-fit:cover}.play{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:31px;height:31px;border:2px solid white;border-radius:50%;background:#0008;display:grid;place-items:center;padding-left:2px;font-size:16px}.youtube{position:absolute;right:3px;bottom:3px;background:#000b;border-radius:3px;padding:1px 4px;font-size:8px}.video h3{font-size:11px;line-height:1.25;font-weight:500;margin:5px 3px 3px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden;min-height:41px}.video small{display:block;font-size:8px;color:var(--muted);margin:2px 3px}.scroll-next{position:absolute;right:-2px;top:24px;width:27px;height:32px;background:#07120de8;border:1px solid #456450;border-radius:50%;font-size:25px;text-align:center}.empty{padding:12px;border:1px solid #244230;border-radius:8px;font-size:11px;color:var(--muted)}.rail-note{font-size:8px;color:#8b9e90;margin:6px 0 0}img.failed{opacity:0}.loading{font-size:12px;color:#acbcb0} @media(min-width:550px){.teaser{height:210px}.column-copy{padding:20px}.column-copy h2{font-size:27px}.column-copy h2 span{font-size:40px}.author{font-size:13px}.tagline,.pill{font-size:12px}.mini-label,.match-card .mini-label{font-size:12px}.match-card{padding:15px}.match-card h2{font-size:25px}.crest{height:52px;width:55px}.match-date,.match-round,.match-action{font-size:12px}.section-head h2{font-size:18px}.video h3{font-size:14px}.video small{font-size:11px}.thumbnail .play{width:42px;height:42px}}
</style></head><body><section class="hero" aria-roledescription="carrousel" aria-label="Uitgelicht"><div id="slides"></div><button class="arrow prev" aria-label="Vorig onderwerp">‹</button><button class="arrow next" aria-label="Volgend onderwerp">›</button><div class="dots" id="dots"></div><button class="pause" id="pause" aria-label="Automatisch wisselen pauzeren">Ⅱ</button></section><section class="teasers" aria-label="Column en wedstrijd van de week"><button class="teaser column-card" data-action="column"><img src="column-portrait.webp" alt="Sander Brink"><div class="column-copy"><div class="mini-label">COLUMN</div><h2>DE DERDE<span>HELFT</span></h2><div class="author">Door Sander Brink</div><div class="tagline">Een eigen kijk op voetbal.</div><span class="pill">Lees de column　→</span></div></button><button class="teaser match-card" id="matchCard" data-action="match"></button></section><section class="rail-section"><div class="section-head"><h2>LAATSTE VOETBALVIDEO’S</h2><button id="moreVideos">Meer video’s →</button></div><div class="rail-wrap"><div class="rail" id="videos" aria-label="Actuele Eredivisie-video’s"><div class="empty">Actuele YouTube-video’s laden…</div></div><button class="scroll-next" id="railNext" aria-label="Volgende video’s">›</button></div><p class="rail-note" id="videoNote">YouTube · Officiële kanalen · Eredivisie</p></section><script src="home-model.js"></script><script>
'use strict';
const $=id=>document.getElementById(id),esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const image=s=>/^https:\/\//.test(s||'')?esc(s):'';
const call=(method,value='')=>{if(window.HomeHub&&typeof HomeHub[method]==='function')HomeHub[method](value);};
let state={articles:[],stats:{},videos:{}},index=0,paused=matchMedia('(prefers-reduced-motion: reduce)').matches,slides=[],timer;
const date=(s,opts={})=>{try{return new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',...opts}).format(new Date(s));}catch{return '';}};
function crests(f){return '<div class="crests">'+[f.home,f.away].map(t=>'<img class="crest" alt="'+esc(t.name)+'" src="'+image(t.logo)+'">').join('')+'</div>';}
function matchCopy(m){const f=m.fixture;return crests(f)+'<h2>'+esc(f.home.name)+' – '+esc(f.away.name)+'</h2><div class="match-date">'+esc(date(f.date,{weekday:'short',day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))+'</div><div class="match-round">'+esc(m.round||'Eredivisie')+'</div>';}
function render(){
 const articles=HomeModel.published(state.articles),latest=articles.find(a=>!HomeModel.isColumn(a)),column=articles.find(HomeModel.isColumn),m=HomeModel.currentMatch(state.stats),videos=HomeModel.videos(state.videos);
 slides=[{key:'news',kind:'news-slide',action:latest?'article':'none',id:latest?.id||'',badge:'NIEUWSTE ARTIKEL',title:latest?esc(latest.headline):'Het laatste voetbalnieuws',meta:latest?esc(date(latest.publishedAt,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))+' · VoetbalHub':state.loading===false?'Nieuwe artikelen verschijnen hier na publicatie.':'Eigen artikelen laden…',cover:latest&&['cleared','licensed'].includes(latest.imageRights)?image(latest.imageReview?.method==='fixture-specific-stadium-and-logos-v4'&&latest.imageReview?.stadiumImageUrl?latest.imageReview.stadiumImageUrl:latest.imageUrl):''},
 {key:'column',kind:'column-slide',action:'column',badge:'COLUMN',title:column?esc(column.headline):'DE DERDE<span>HELFT</span>',meta:'Door Sander Brink · Een eigen kijk op voetbal.',cover:'column-portrait.webp'},
 {key:'match',kind:'match-hero',action:m?'match':'none',badge:'WEDSTRIJD VAN DE WEEK',title:m?esc(m.fixture.home.name)+' – '+esc(m.fixture.away.name):'De volgende topper',meta:m?esc(date(m.fixture.date,{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+' · Bekijk de voorbeschouwing':'De nieuwe voorbeschouwing volgt zodra het duel is geselecteerd.',cover:m?image(HomeModel.stadiumImage(m)):'',logos:m?crests(m.fixture):''}];
 $('slides').innerHTML=slides.map((s,i)=>'<article class="slide '+s.kind+(i===index?' active':'')+'" aria-hidden="'+(i!==index)+'">'+(s.cover?'<img class="cover '+(s.key==='column'?'column-cover':'')+'" alt="" src="'+s.cover+'">':'')+'<div class="shade"></div><button class="slide-link" data-action="'+s.action+'" data-id="'+esc(s.id||'')+'" tabindex="'+(i===index?'0':'-1')+'" '+(s.action==='none'?'disabled':'')+'><span class="badge">'+s.badge+'</span>'+(s.logos||'')+'<h1>'+s.title+'</h1><span class="meta">'+s.meta+'</span></button></article>').join('');
 $('dots').innerHTML=slides.map((s,i)=>'<button class="dot" aria-label="'+s.badge+'" aria-current="'+(i===index)+'" data-slide="'+i+'"></button>').join('');
 $('matchCard').disabled=!m;$('matchCard').innerHTML='<span class="mini-label">WEDSTRIJD VAN DE WEEK</span>'+(m?(HomeModel.stadiumImage(m)?'<img class="cover" alt="" src="'+image(HomeModel.stadiumImage(m))+'">':'')+'<div>'+matchCopy(m)+'</div><span class="match-action">Bekijk de voorbeschouwing　→</span>':'<div><h2>Voorbeschouwing volgt</h2><div class="match-date">Het volgende duel wordt automatisch geselecteerd.</div></div><span class="match-action">Eredivisie</span>');
 $('videos').innerHTML=videos.length?videos.map(v=>'<button class="video" data-video="'+esc(v.id)+'" aria-label="Bekijk op YouTube: '+esc(v.title)+'"><div class="thumbnail"><img loading="lazy" src="https://i.ytimg.com/vi/'+esc(v.id)+'/hqdefault.jpg" alt=""><span class="play">▶</span><span class="youtube">YouTube</span></div><h3>'+esc(v.title)+'</h3><small>'+esc(v.channel)+' · '+esc(date(v.publishedAt,{day:'numeric',month:'short'}))+'</small></button>').join(''):'<div class="empty">'+(state.videoLoading?'Actuele YouTube-video’s laden…':'Geen actuele Eredivisie-video’s beschikbaar. De selectie wordt automatisch bijgewerkt.')+'</div>';
 $('railNext').hidden=videos.length<3;$('moreVideos').hidden=!videos.length;
 $('videoNote').textContent='YouTube · Officiële kanalen · Laatste 7 dagen'+(state.videos.updatedAt?' · Bijgewerkt '+date(state.videos.updatedAt,{hour:'2-digit',minute:'2-digit'}):'');
 updatePause();resize();
}
function move(n){index=(n+slides.length)%slides.length;document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',i!==index);s.querySelector('button').tabIndex=i===index?0:-1;});document.querySelectorAll('.dot').forEach((d,i)=>d.setAttribute('aria-current',i===index));}
let videoPlaying=false;
function setVideoPlaying(value){videoPlaying=!!value;restart();}
window.setVideoPlaying=setVideoPlaying;
function playVideo(id){const top=document.querySelector('.teasers').offsetTop,bottom=document.querySelector('.rail-section').getBoundingClientRect().bottom+window.scrollY,request=HomeModel.playbackRequest(state.videos,id,top,bottom);if(request)call('openVideo',JSON.stringify(request));}
function restart(){clearInterval(timer);if(!paused&&!videoPlaying&&!document.hidden)timer=setInterval(()=>move(index+1),6500);}
function updatePause(){$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'Automatisch wisselen hervatten':'Automatisch wisselen pauzeren');restart();}
function resize(){requestAnimationFrame(()=>call('resize',String(document.body.scrollHeight)));}
function setData(raw){try{state={...state,...JSON.parse(raw)};render();}catch{}}
window.setData=setData;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.slide!==undefined){move(Number(b.dataset.slide));restart();}if(b.dataset.action==='article')call('openArticle',b.dataset.id);if(b.dataset.action==='column')call('openColumn');if(b.dataset.action==='match')call('openMatch');if(b.dataset.video)playVideo(b.dataset.video);});
document.querySelector('.prev').onclick=()=>{move(index-1);restart();};document.querySelector('.next').onclick=()=>{move(index+1);restart();};$('pause').onclick=()=>{paused=!paused;updatePause();};$('railNext').onclick=()=>{$('videos').scrollBy({left:$('videos').clientWidth*.8,behavior:'smooth'});};$('moreVideos').onclick=()=>{const expanded=$('videos').classList.toggle('expanded');$('moreVideos').textContent=expanded?'Minder video’s ↑':'Meer video’s →';$('moreVideos').setAttribute('aria-expanded',String(expanded));$('railNext').hidden=expanded||HomeModel.videos(state.videos).length<3;resize();};
let touch;document.querySelector('.hero').addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});document.querySelector('.hero').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){move(index+(dx<0?1:-1));restart();}touch=null;},{passive:true});
document.querySelector('.hero').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(index+(e.key==='ArrowRight'?1:-1));restart();}});
document.addEventListener('visibilitychange',restart);document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement)e.target.classList.add('failed');},true);document.addEventListener('load',resize,true);window.addEventListener('resize',resize);render();
</script></body></html>
