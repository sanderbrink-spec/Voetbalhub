function renderNumbers(){const q=quiz[quizIndex];$('numbers').innerHTML='<div class="numbers-panel"><div class="number-kicker">KEN JIJ JE VOETBAL? · '+(quizIndex+1)+' / '+quiz.length+'</div><p class="number-question">'+esc(q.q)+'</p><div class="number-answers">'+q.choices.map((v,i)=>'<button data-answer="'+i+'" aria-pressed="'+(answer===i)+'" '+(answer>=0?'disabled':'')+'>'+esc(v)+'</button>').join('')+'</div><div class="number-result" role="status">'+(answer<0?'Kies je antwoord.':(answer===q.correct?'Goed! ':'Het juiste antwoord is '+esc(q.choices[q.correct])+'. ')+esc(q.fact)+' <button data-action="stadium" data-id="de-kuip">Lees het verhaal →</button>')+'</div><button class="number-next" id="nextQuestion">Volgende vraag →</button></div>';$('nextQuestion').onclick=()=>{quizIndex=(quizIndex+1)%quiz.length;answer=-1;renderNumbers();resize();};document.querySelectorAll('[data-answer]').forEach(b=>b.onclick=()=>{answer=Number(b.dataset.answer);renderNumbers();resize();});}
function render(){
 const articles=HomeModel.published(state.articles),latest=articles.find(a=>!HomeModel.isColumn(a)),column=articles.find(HomeModel.isColumn),m=HomeModel.currentMatch(state.stats)||lastMatch,videos=HomeModel.videos(state.videos);
 if(m)lastMatch=m;clearTimeout(weeklyTimer);const boundary=Date.parse(state.stats?.nextFeatured?.publishAt);if(boundary>Date.now())weeklyTimer=setTimeout(render,Math.min(boundary-Date.now(),2147483647));
 const recent=HomeModel.recentArticles(state.articles);
 const imageSession=VeldioImages39.session();slides=recent.map((a,i)=>({key:'news-'+a.id,kind:'news-slide',action:'article',id:a.id,badge:i===0?'NIEUWSTE ARTIKEL':'UITGELICHT',title:esc(a.headline),meta:esc(a.standfirst||date(a.publishedAt,{day:'numeric',month:'short'})),cover:imageSession.claim(a)&&['cleared','licensed'].includes(a.imageRights)?image(a.imageUrl):'editorial-fallback.svg',context:a.imageReview?.contextOnly===true,generated:a.imageReview?.generated===true}));
 if(!slides.length)slides=[{key:'column',kind:'column-slide',action:'column',badge:'COLUMN',title:'DE DERDE<span>HELFT</span>',meta:'Door Sander Brink · Een eigen kijk op voetbal.',cover:'column-portrait.webp'}];
 index=Math.min(index,slides.length-1);
 $('slides').innerHTML=slides.map((s,i)=>'<article class="slide '+s.kind+(i===index?' active':'')+'" aria-hidden="'+(i!==index)+'">'+(s.cover?'<img class="cover '+(s.key==='column'?'column-cover':'')+'" alt="" src="'+s.cover+'" onerror="this.onerror=null;this.src=\'editorial-fallback.svg\'">':'')+'<div class="shade"></div>'+(s.context?'<span class="image-note">'+(s.generated?'AI-illustratie':'Archiefbeeld')+'</span>':'')+'<button class="slide-link" data-action="'+s.action+'" data-id="'+esc(s.id||'')+'" tabindex="'+(i===index?'0':'-1')+'" '+(s.action==='none'?'disabled':'')+'><span class="badge">'+s.badge+'</span>'+(s.logos||'')+'<h1>'+s.title+'</h1><span class="meta">'+s.meta+'</span></button></article>').join('');
 $('dots').innerHTML=slides.map((s,i)=>'<button class="dot" aria-label="'+s.badge+'" aria-current="'+(i===index)+'" data-slide="'+i+'"></button>').join('');
 const card=$('matchCard');card.disabled=false;card.classList.toggle('spotlight-card',!m);
 if(m){card.dataset.action='match';card.dataset.id=m.publicationId||String(m.fixtureId||'');card.innerHTML='<span class="mini-label">WEDSTRIJD VAN DE WEEK</span>'+(HomeModel.stadiumImage(m)?'<img class="cover" alt="" src="'+image(HomeModel.stadiumImage(m))+'">':'')+'<div>'+matchCopy(m)+'</div><span class="match-action">'+(m.phase==='report'?'Lees het wedstrijdverslag':m.phase==='live'?'Bekijk wedstrijdinformatie':'Bekijk de voorbeschouwing')+'　→</span>';}
 else{
  const a=state.stadiums?.articles?.find(a=>a.id===state.stadiums.current);
  card.dataset.action='stadium';card.dataset.id=a?.id||'';
  const photo=a?.image||{file:'feyenoord-d71e48ea2e5b.webp'};
  card.innerHTML='<img class="cover" alt="'+'AI-sfeerillustratie; fictief stadion'+'" src="news-photos/veldio-arena.webp'+'"><span class="mini-label">STADION VAN DE WEEK</span><div class="spotlight-copy"><div class="spotlight-club">'+esc(a?.venue||'De Kuip')+'</div><h2>'+esc(a?.headline||'Waar staal en herinneringen samenkomen')+'</h2><span class="match-action">Lees het stadionportret　→</span><div class="context-label">AI-sfeerillustratie · fictief stadion</div></div>';
 }
 renderNumbers();

 updatePause();resize();
}
function move(n){index=(n+slides.length)%slides.length;document.querySelectorAll('.slide').forEach((s,i)=>{s.classList.toggle('active',i===index);s.setAttribute('aria-hidden',i!==index);s.querySelector('button').tabIndex=i===index?0:-1;});document.querySelectorAll('.dot').forEach((d,i)=>d.setAttribute('aria-current',i===index));}
let videoPlaying=false;
function setVideoPlaying(value){videoPlaying=!!value;restart();}
window.setVideoPlaying=setVideoPlaying;
function restart(){clearInterval(timer);if(!paused&&!videoPlaying&&!document.hidden)timer=setInterval(()=>move(index+1),6500);}
function updatePause(){$('pause').textContent=paused?'▶':'Ⅱ';$('pause').setAttribute('aria-label',paused?'Automatisch wisselen hervatten':'Automatisch wisselen pauzeren');restart();}
function resize(){requestAnimationFrame(()=>call('resize',String(document.body.scrollHeight)));}
function setData(raw){try{state={...state,...JSON.parse(raw)};render();}catch{}}
window.setData=setData;
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.slide!==undefined){move(Number(b.dataset.slide));restart();}if(b.dataset.action==='quiz')call('openQuiz');if(b.dataset.action==='article')call('openArticle',b.dataset.id);if(b.dataset.action==='column')call('openColumn');if(b.dataset.action==='club')call('openClub',b.dataset.id);if(b.dataset.action==='match'){if(lastMatch)call('openMatch',b.dataset.id||'');else call('openMatchUnavailable');}if(b.dataset.action==='stadium')call('openStadium',b.dataset.id);if(b.dataset.action==='stadiumArchive')call('openStadiumArchive');});
document.querySelector('.prev').onclick=()=>{move(index-1);restart();};document.querySelector('.next').onclick=()=>{move(index+1);restart();};$('pause').onclick=()=>{paused=!paused;updatePause();};
let touch;document.querySelector('.hero').addEventListener('touchstart',e=>{touch={x:e.touches[0].clientX,y:e.touches[0].clientY};},{passive:true});document.querySelector('.hero').addEventListener('touchend',e=>{if(!touch)return;const dx=e.changedTouches[0].clientX-touch.x,dy=e.changedTouches[0].clientY-touch.y;if(Math.abs(dx)>45&&Math.abs(dx)>Math.abs(dy)*1.3){move(index+(dx<0?1:-1));restart();}touch=null;},{passive:true});
document.querySelector('.hero').addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key==='ArrowLeft'){e.preventDefault();move(index+(e.key==='ArrowRight'?1:-1));restart();}});
document.addEventListener('visibilitychange',restart);document.addEventListener('error',e=>{if(e.target instanceof HTMLImageElement)e.target.classList.add('failed');},true);document.addEventListener('load',resize,true);window.addEventListener('resize',resize);render();
</script></body></html>
