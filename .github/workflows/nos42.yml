name: NOS summaries catalogue
on:
  workflow_dispatch:
  schedule:
    - cron: '35 */2 * * *'
permissions:
  contents: write
concurrency:
  group: nos42-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: work/veldio-42
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --test test/nos42.test.js
      - run: node scripts/nos-summaries42.js
        env:
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
      - run: |
          if ! git diff --quiet -- videos/nos42.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add videos/nos42.json
            git commit -m 'Refresh verified NOS catalogue [device-only]'
            git push
          fi
