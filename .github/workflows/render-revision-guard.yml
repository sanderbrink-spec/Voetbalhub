name: Verify and recover Render main revision
on:
  push:
    branches: [main]
  schedule:
    - cron: '8 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: veldio-render-revision-guard
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - name: Verify revision and recover stalled deployment
        id: check
        shell: bash
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: srv-dbdn1duq1p3s73965iq0
        run: |
          set -euo pipefail
          endpoint="https://voetbalhub-redactie.onrender.com/ready"
          current_main() {
            git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1
          }
          matches() {
            local expected="$1" body revision ready
            body="$(curl -fsS --max-time 15 "$endpoint" || true)"
            revision="$(printf '%s' "$body" | jq -r '.revision // empty' 2>/dev/null || true)"
            ready="$(printf '%s' "$body" | jq -r '.ready // false' 2>/dev/null || true)"
            [ "$ready" = true ] && [ "$revision" = "$expected" ]
          }
          expected="$(current_main)"
          if [ -z "$expected" ]; then
            echo "::error::Unable to resolve main revision."
            exit 1
          fi
          # Allow the native Render auto-deploy to start before using recovery.
          for attempt in $(seq 1 6); do
            expected="$(current_main)"
            if matches "$expected"; then
              echo "Render matches main: $expected"
              exit 0
            fi
            sleep 20
          done
          if [ -z "$RENDER_API_KEY" ]; then
            echo "::error::Render is behind main and RENDER_API_KEY is missing; automated recovery cannot run."
            exit 1
          fi
          # Only one fallback deploy per guard run, after native auto-deploy had time.
          # Do not log the credential or request headers.
          status="$(curl -sS -o /tmp/veldio-render-deploy.json -w '%{http_code}' --max-time 20 \
            -X POST "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H 'Content-Type: application/json' \
            -d '{"clearCache":"do_not_clear"}' || true)"
          if [ "$status" != 201 ] && [ "$status" != 202 ]; then
            echo "::error::Render recovery deployment request failed (HTTP $status)."
            exit 1
          fi
          echo "Recovery deploy requested for current main."
          for attempt in $(seq 1 36); do
            expected="$(current_main)"
            if matches "$expected"; then
              echo "Render recovered and matches main: $expected"
              exit 0
            fi
            sleep 20
          done
          echo "::error::Render recovery did not reach current main in time."
          exit 1
      - name: Create or close deployment drift alert
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const title='[Veldio] Render loopt achter op GitHub main';
            const {data:issues}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            if(process.env.CHECK_RESULT!=='success'&&!existing) {
              await github.rest.issues.create({owner,repo,title,body:'De Render /ready revisie komt niet overeen met de actuele main commit, ook niet na automatische herstelpoging. Controleer Render API sleutel, GitHub-Render-integratie en build. Workflow: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId});
            } else if(process.env.CHECK_RESULT==='success'&&existing) {
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
