name: Verify and recover Render main revision
on:
  push:
    branches: [main]
  schedule:
    - cron: '8,38 * * * *'
  workflow_dispatch:
permissions:
  contents: read
  issues: write
concurrency:
  group: veldio-render-revision-guard
  # A new main commit supersedes any older guard. A scheduled check must not
  # cancel an urgent in-progress push verification.
  cancel-in-progress: ${{ github.event_name == 'push' }}
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 19
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Verify current main, avoid duplicate deploys and recover drift
        id: check
        env:
          GITHUB_TOKEN: ${{ github.token }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
        run: node scripts/render-sync-guard.js guard
      - name: Create or close deployment drift alert
        if: always()
        uses: actions/github-script@v7
        env:
          CHECK_RESULT: ${{ steps.check.outcome }}
        with:
          script: |
            const owner=context.repo.owner,repo=context.repo.repo;
            const title='[Veldio] Render loopt achter op GitHub main';
            const {data:issues}=await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing=issues.find(i=>i.title===title);
            if(process.env.CHECK_RESULT!=='success'&&!existing) {
              await github.rest.issues.create({owner,repo,title,body:'De Render /ready revisie komt niet overeen met de actuele main commit, ook niet na automatische herstelpoging. Controleer Render API sleutel, GitHub-Render-integratie en build. Workflow: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId});
            } else if(process.env.CHECK_RESULT==='success'&&existing) {
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
