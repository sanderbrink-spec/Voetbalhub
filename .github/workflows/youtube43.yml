name: Veldio official video catalogue health
on:
  workflow_dispatch:
  schedule:
    - cron: '17 */6 * * *'
permissions:
  contents: read
concurrency:
  group: youtube43-catalogue
  cancel-in-progress: false
jobs:
  refresh:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --test test/youtube43.test.js
      - name: Inspect the catalogue actually used by Android
        run: node scripts/video-health48.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-catalogue-health
          path: .quality-output/video-health.json
          include-hidden-files: true
          if-no-files-found: error
