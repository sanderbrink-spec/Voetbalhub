name: Veldio 40 install APK Android 16
on:
  push:
    branches: [work/veldio-40]
    paths: [.github/workflows/veldio40-install.yml]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify-and-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Verify successful complete phase40 source build
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api repos/sanderbrink-spec/Voetbalhub/actions/runs/41606193539/jobs > build-jobs.json
          gh api repos/sanderbrink-spec/Voetbalhub/actions/runs/41606193539 > build-run.json
          python3 - <<'PY'
          import json
          run=json.load(open('build-run.json'))
          assert run['head_sha']=='c6239e9e59ace0b93907f62e4fe5fb0968e92ed6', 'Unexpected source revision'
          jobs=json.load(open('build-jobs.json'))['jobs']
          assert any(j['name']=='api-test-and-build' and j['conclusion']=='success' for j in jobs), 'Complete APK build did not pass'
          PY
      - name: Download exact debug-signed full APK
        uses: actions/download-artifact@v4
        with:
          name: Veldio-Android-test
          path: apk
          run-id: 41606193539
          github-token: ${{ github.token }}
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
          log-accepted-android-sdk-licenses: false
      - name: Verify debug certificate and prepare installation file
        run: |
          set -euo pipefail
          mkdir -p install
          cp apk/app-debug.apk install/Veldio-40-install.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs install/Veldio-40-install.apk | tee signature.txt
          grep -q 'CN=Android Debug' signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging install/Veldio-40-install.apk > manifest.txt
          grep -q "package: name='nl.voetbalhub.app1.test40premium'" manifest.txt
          sha256sum install/Veldio-40-install.apk | tee apk-sha256.txt
      - name: Prepare Android 16 installation and launch check
        run: |
          cat > verify-install.py <<'PY'
          import subprocess,time,json
          def adb(*args):
              return subprocess.check_output(['adb',*args],text=True,stderr=subprocess.STDOUT)
          assert adb('shell','getprop','ro.build.version.sdk').strip()=='36', 'Expected Android 16/API 36'
          package='nl.voetbalhub.app1.test40premium'
          result=adb('install','-r','install/Veldio-40-install.apk')
          assert 'Success' in result, result
          adb('logcat','-c')
          component=adb('shell','cmd','package','resolve-activity','--brief',package).strip().splitlines()[-1]
          assert '/' in component, component
          launch=adb('shell','am','start','-W','-n',component)
          assert 'Status: ok' in launch, launch
          time.sleep(15)
          pid=adb('shell','pidof',package).strip()
          assert pid, 'App process exited'
          log=adb('logcat','-d','-b','crash')
          assert package not in log, log
          report={'android':16,'api':36,'installation':'Success','launch':'ok','runningPid':pid,'sourceCommit':'c6239e9e59ace0b93907f62e4fe5fb0968e92ed6','package':package,'physicalSamsungTest':False}
          open('android16-installation.json','w').write(json.dumps(report,indent=2))
          print(json.dumps(report))
          PY
      - name: Enable Android emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch exact APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 verify-install.py
      - name: Upload direct-install APK after successful Android 16 check
        uses: actions/upload-artifact@v4
        with:
          name: Veldio-40-install
          path: install/Veldio-40-install.apk
          if-no-files-found: error
      - name: Keep signature and installation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veldio-40-Android16-verification
          path: |
            signature.txt
            manifest.txt
            apk-sha256.txt
            android16-installation.json
            build-run.json
            build-jobs.json
          if-no-files-found: ignore
