name: Veldio interface39 device verification
on:
  workflow_dispatch:
  push:
    branches: [work/veldio-interface-39]
    paths:
      - scripts/android-interface39.py
      - scripts/android-test-accessibility.py
      - .github/workflows/interface39-device.yml
permissions:
  contents: read
  actions: read
jobs:
  verify-existing-apk:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-Android-test
          path: apk
          run-id: 41569860229
          github-token: ${{ github.token }}
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Verify exact phase39 APK on Android
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-interface39.py apk/app-debug.apk
      - name: Keep Android screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veldio-39-device-verification
          path: .android-smoke/
          include-hidden-files: true
          if-no-files-found: error
