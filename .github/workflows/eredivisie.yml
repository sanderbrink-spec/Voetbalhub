name: Licensed football source health
on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: football47-health
  cancel-in-progress: false
jobs:
  sources:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Probe licensed central data only
        run: node scripts/football47-health.js
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: football-source-health
          path: football47-health.json
