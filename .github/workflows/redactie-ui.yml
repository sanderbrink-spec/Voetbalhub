name: Editorial desk browser checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Unit and API tests
        run: npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check mobile and desktop editorial flow
        run: node scripts/browser/editorial-desk.cjs
