name: Editorial desk browser checks
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    env:
      REDIS_TEST_URL: redis://127.0.0.1:6379
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install existing illustration renderer dependency
        run: python3 -m pip install Pillow
      - name: Install service dependencies
        run: npm ci --ignore-scripts
      - name: Unit and API tests
        run: npm test
      - name: Install browser test tools
        run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Check complete editorial chains and visible Veldio article
        env:
          EDITORIAL_BROWSER_TEST: '1'
        run: node --test test/editorial-chain.redis.test.js
      - name: Check mobile and desktop editorial flow
        run: node scripts/browser/editorial-desk.cjs
      - name: Check internal Eredivisie statistics on mobile
        run: node scripts/browser/eredivisie.cjs
      - name: Check dedicated match reader and delayed navigation
        run: node scripts/browser/match-preview.cjs
      - name: Check personal clubs, saved originals and search
        run: node scripts/browser/personal-hub.cjs
      - name: Check Veldio homepage portrait and responsive layout
        run: node scripts/browser/veldio-home.cjs
      - name: Check photographic home, safe text and all three club spotlights
        run: node scripts/browser/phase32.cjs
      - name: Check stadium reader, archive and offline football quiz
        run: node scripts/browser/phase33.cjs
      - name: Check weekly match report, fallback and exact preview transition
        run: node scripts/browser/weekly-feature.cjs
      - name: Check professional contact form on mobile
        run: node scripts/browser/contact.cjs
      - name: Keep statistics screen for visual inspection
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eredivisie-mobile-preview
          path: .browser-output/*.png
          include-hidden-files: true
          if-no-files-found: ignore
