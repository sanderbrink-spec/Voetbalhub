name: Approved own editorial method
on:
  workflow_dispatch:
  schedule:
    - cron: '43 * * * *'
permissions:
  contents: read
concurrency:
  group: approved-own-editorial
  cancel-in-progress: false
jobs:
  run:
    if: vars.VELDIO_AUTONOMY_APPROVED == '1'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run the server-approved method only
        env:
          HUB_AUTOMATION_SECRET: ${{ secrets.HUB_AUTOMATION_SECRET }}
          EDITORIAL_METHOD_ID: ${{ vars.EDITORIAL_METHOD_ID }}
        run: node scripts/run-autonomous.js
