name: Veldio editorial watchdog
on:
  schedule:
    - cron: '48 * * * *'
  workflow_dispatch:
permissions:
  actions: write
  issues: write
  contents: read
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Recover one failed scheduled run and detect repeated failures
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'automatic-publication.yml';
            const title = '[Veldio] Automatische redactie: herhaalde uitvoeringsfouten';
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, event: 'schedule', per_page: 20
            });
            const runs = data.workflow_runs
              .filter(run => run.status === 'completed')
              .sort((a,b) => new Date(b.created_at)-new Date(a.created_at));
            // Retry at most once per scheduled run. Do not rerun an in-progress attempt.
            const newest = runs[0];
            if (newest && newest.conclusion === 'failure' && newest.run_attempt === 1) {
              const ageMinutes = (Date.now()-new Date(newest.updated_at).getTime())/60000;
              if (ageMinutes >= 5 && ageMinutes <= 90) {
                await github.rest.actions.reRunWorkflow({owner,repo,run_id:newest.id});
                core.notice('Eenmalige automatische herstart: '+newest.html_url);
                return;
              }
            }
            // A missing schedule is itself a failure; do not wait for three runs.
            const latestScheduled = runs[0];
            const lastStart = latestScheduled ? new Date(latestScheduled.created_at).getTime() : 0;
            const stale = !lastStart || Date.now() - lastStart > 3 * 60 * 60 * 1000;
            if (stale) {
              const missingTitle = '[Veldio] Automatische redactie: geplande rondes ontbreken';
              const {data:openIssues} = await github.rest.issues.listForRepo({
                owner,repo,state:'open',per_page:100
              });
              const missing = openIssues.find(issue => issue.title === missingTitle);
              if (!missing) await github.rest.issues.create({
                owner,repo,title:missingTitle,
                body:'Er is in de afgelopen drie uur geen geplande automatische redactieronde gestart. Controleer GitHub Actions schedules en repositoryinstellingen.'
              });
              // Recover a dropped GitHub schedule through the existing watchdog.
              // Never overlap a live publication run or repeatedly dispatch within 90 minutes.
              const {data:all} = await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,per_page:20});
              const latest = all.workflow_runs[0];
              const active = all.workflow_runs.some(run => run.status !== 'completed');
              const recentlyStarted = latest && Date.now()-new Date(latest.created_at).getTime() < 90*60000;
              if (!active && !recentlyStarted) {
                await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id,ref:'main'});
                core.notice('Ontbrekende planning: één vervangende redactieronde aangevraagd.');
              } else {
                core.notice('Ontbrekende planning gesignaleerd; een recente of lopende ronde voorkomt een dubbele start.');
              }
              return;
            }
            const {data:openIssues} = await github.rest.issues.listForRepo({
              owner,repo,state:'open',per_page:100
            });
            const missing = openIssues.find(issue => issue.title === '[Veldio] Automatische redactie: geplande rondes ontbreken');
            if (missing) await github.rest.issues.update({owner,repo,issue_number:missing.number,state:'closed'});
            if (runs.length < 3) {
              core.info('Nog geen drie voltooide geplande redactierondes.');
              return;
            }
            const last = runs.slice(0,3);
            const failures = last.every(run => run.conclusion !== 'success');
            const {data:issues} = await github.rest.issues.listForRepo({
              owner, repo, state:'open', labels:'veldio-editorial-alert', per_page:100
            });
            const existing = issues.find(issue => issue.title === title);
            if (failures) {
              const body = [
                'De laatste drie voltooide geplande redactierondes zijn niet geslaagd.',
                'Dit is een technische waarschuwing, geen reden om de kwaliteitscontrole te verlagen.',
                '',
                ...last.map(run => '- '+run.created_at+': '+run.conclusion+' '+run.html_url),
                '',
                'Controleer GitHub Actions, Groq-limieten, bronverzameling en Render.',
                'Na een geslaagde geplande ronde sluit de bewaking deze melding automatisch.'
              ].join('\n');
              if (!existing) {
                try {
                  await github.rest.issues.create({owner,repo,title,body,labels:['veldio-editorial-alert']});
                } catch (error) {
                  if (error.status !== 422) throw error;
                  await github.rest.issues.create({owner,repo,title,body});
                }
              } else {
                await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
              }
              core.setFailed('Drie opeenvolgende geplande redactierondes mislukt.');
            } else if (existing && last[0].conclusion === 'success') {
              await github.rest.issues.createComment({
                owner,repo,issue_number:existing.number,
                body:'Automatisch hersteld: de meest recente geplande redactieronde is geslaagd. '+last[0].html_url
              });
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
