name: Veldio editorial watchdog
on:
  # One checked recovery run after this watchdog fix first reaches main.
  push:
    branches: [main]
    paths: ['.github/workflows/editorial-watchdog.yml']
  schedule:
    - cron: '4,19,34,49 * * * *'
  workflow_dispatch:
  # Reuse the already running scouts as a heartbeat if GitHub drops cron events.
  workflow_run:
    workflows: ['Veldio 10 AI news scouts']
    types: [completed]
permissions:
  actions: write
  issues: write
  contents: read
concurrency:
  group: veldio-editorial-watchdog
  cancel-in-progress: false
jobs:
  monitor:
    # Never run privileged recovery from a PR or an unscheduled scout push.
    if: github.event_name != 'workflow_run' || (github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # github-script requires the pure local decision module from the repository.
      - uses: actions/checkout@v4
      - name: Recover one failed scheduled run and detect repeated failures
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const workflow_id = 'automatic-publication.yml';
            const {publicationOpportunity117} = require('./scripts/editorial-watchdog113');
            const title = '[Veldio] Automatische redactie: herhaalde uitvoeringsfouten';
            const {data} = await github.rest.actions.listWorkflowRuns({
              owner, repo, workflow_id, event: 'schedule', per_page: 20
            });
            const runs = data.workflow_runs
              .filter(run => run.status === 'completed')
              .sort((a,b) => new Date(b.created_at)-new Date(a.created_at));
            // A new dispatch uses current main, never reruns an obsolete deployment.
            const {data:all} = await github.rest.actions.listWorkflowRuns({owner,repo,workflow_id,per_page:20});
            let scoutState;
            try {
              const {data:raw} = await github.rest.repos.getContent({
                owner,repo,path:'editorial-agent-leads101.json',ref:'editorial-media',mediaType:{format:'raw'}
              });
              scoutState=JSON.parse(typeof raw==='string'?raw:Buffer.from(raw.content||'','base64').toString('utf8'));
            } catch {
              core.warning('Scoutcheckpoint niet leesbaar; tijdgebonden herstel blijft beschikbaar.');
            }
            const decision=publicationOpportunity117(all.workflow_runs,scoutState);
            // Alert on the missing scheduled heartbeat, separately from actual recovery.
            const latestScheduled = runs[0];
            const lastStart = latestScheduled ? new Date(latestScheduled.created_at).getTime() : 0;
            const stale = !lastStart || Date.now() - lastStart > 3 * 60 * 60 * 1000;
            const missingTitle = '[Veldio] Automatische redactie: geplande rondes ontbreken';
            const {data:openIssues} = await github.rest.issues.listForRepo({
              owner,repo,state:'open',per_page:100
            });
            const missing = openIssues.find(issue => issue.title === missingTitle);
            if (stale && !missing) await github.rest.issues.create({
              owner,repo,title:missingTitle,
              body:'Er is in de afgelopen drie uur geen geplande automatische redactieronde gestart. Controleer GitHub Actions schedules en repositoryinstellingen.'
            });
            if (!stale && missing) await github.rest.issues.update({owner,repo,issue_number:missing.number,state:'closed'});
            if (decision.allowed) {
              await github.rest.actions.createWorkflowDispatch({owner,repo,workflow_id,ref:'main',inputs:{sportmonks_only:'false',validation_only:'false'}});
              core.notice('Volledige redactieronde aangevraagd: '+decision.reason);
              return;
            }
            core.info('Redactieplanning: '+decision.reason);
            if(stale)return;
            if (runs.length < 3) {
              core.info('Nog geen drie voltooide geplande redactierondes.');
              return;
            }
            const last = runs.slice(0,3);
            const failures = last.every(run => run.conclusion !== 'success');
            const {data:issues} = await github.rest.issues.listForRepo({
              owner, repo, state:'open', labels:'veldio-editorial-alert', per_page:100
            });
            const existing = issues.find(issue => issue.title === title);
            if (failures) {
              const body = [
                'De laatste drie voltooide geplande redactierondes zijn niet geslaagd.',
                'Dit is een technische waarschuwing, geen reden om de kwaliteitscontrole te verlagen.',
                '',
                ...last.map(run => '- '+run.created_at+': '+run.conclusion+' '+run.html_url),
                '',
                'Controleer GitHub Actions, Groq-limieten, bronverzameling en Render.',
                'Na een geslaagde geplande ronde sluit de bewaking deze melding automatisch.'
              ].join('\n');
              if (!existing) {
                try {
                  await github.rest.issues.create({owner,repo,title,body,labels:['veldio-editorial-alert']});
                } catch (error) {
                  if (error.status !== 422) throw error;
                  await github.rest.issues.create({owner,repo,title,body});
                }
              } else {
                await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
              }
              core.setFailed('Drie opeenvolgende geplande redactierondes mislukt.');
            } else if (existing && last[0].conclusion === 'success') {
              await github.rest.issues.createComment({
                owner,repo,issue_number:existing.number,
                body:'Automatisch hersteld: de meest recente geplande redactieronde is geslaagd. '+last[0].html_url
              });
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }
