name: Veldio50 real Android prediction acceptance
on:
  push:
    branches: [main]
    paths: ['.github/workflows/prediction50-device.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  prediction:
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-50
          path: apk
          run-id: 42077690558
          github-token: ${{ github.token }}
      - run: python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-phase50.py apk/Veldio-50.apk && python3 scripts/prediction50-device.py apk/Veldio-50.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-50-real-predictions-Android16
          path: |
            .android-smoke/
            .android-prediction50/
          include-hidden-files: true
          if-no-files-found: error
