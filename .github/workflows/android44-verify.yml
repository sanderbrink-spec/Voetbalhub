name: Veldio44 exact APK Android16 verification
on:
  push:
    branches: [main]
    paths: ['.github/workflows/android44-verify.yml']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-Android-test
          run-id: 41726830643
          github-token: ${{ github.token }}
          path: apk
      - name: Verify exact delivered APK checksum
        run: echo '04a23c20e6b47bdf9bee0fea4567184852445853be4ecd4d9429da1afe74a668  apk/Veldio-44-install.apk' | sha256sum --check
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check Android16 installation, live news, manual refresh and reader navigation
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: python3 scripts/android-brand-smoke.py apk/Veldio-44-install.apk
      - name: Keep exact APK Android16 results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veldio44-Android16-results
          path: .android-smoke/
          include-hidden-files: true
