name: One-time Ajax day illustration import 110B
on:
  push:
    branches:
      - feat/110b-ajax-ado-day-pending
    paths:
      - '.github/workflows/one-time-ajax-day-import110b.yml'
permissions:
  contents: write
jobs:
  import:
    if: github.repository == 'sanderbrink-spec/Voetbalhub'
    runs-on: ubuntu-24.04
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - name: Import exact user-authorized original, never approve
        env:
          SOURCE_URL: 'https://d2jqrm6oza8nb6.cloudfront.net/datasets/a5c6a1a3-8d28-45c3-8574-4d9250a0dba7.webp?_jwt=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJrZXlIYXNoIjoiZWQzMGI1Y2VmMzcyYTg1YSIsImJ1Y2tldCI6InJ1bndheS1kYXRhc2V0cyIsInN0YWdlIjoicHJvZCIsImV4cCI6MTc5NTU0NjA2Mn0.8YkVCSPNfo0fDekKrM83fEUpT9MMVKatnOPwtEvPdeA'
        shell: bash
        run: |
          set -euo pipefail
          target='public/match-covers110/sm-19714592-ajax-ado-day.webp'
          mkdir -p "$(dirname "$target")"
          curl --fail --location --silent --show-error --max-time 45 \
            "$SOURCE_URL" --output "$target"
          echo "c5d0655f730675579c17846fea822177f7ea0e9ba3be85544ed277031da1e4dd  $target" | sha256sum --check --status
          file "$target" | grep -q 'Web/P image'
          git config user.name 'veldio-artwork-import[bot]'
          git config user.email 'veldio-artwork-import@users.noreply.github.com'
          git add -- "$target"
          git commit -m '110B: exact Ajax daytime illustration, no rights or publication approval'
          git push origin "HEAD:feat/110b-ajax-ado-day-pending"
