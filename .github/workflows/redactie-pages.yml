name: VoetbalHub Redactie Dashboard
on:
  push:
    branches: [main]
    paths:
      - "redactie/dashboard/**"
      - ".github/workflows/redactie-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp redactie/dashboard/index.html _site/index.html
          printf 'VoetbalHub redactie dashboard\n' > _site/README.txt
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
