name: Veldio Redactie Dashboard Package
on:
  push:
    branches: [main]
    paths:
      - "redactie/dashboard/**"
      - ".github/workflows/redactie-pages.yml"
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Prepare dashboard site
        run: |
          mkdir -p _site
          cp redactie/dashboard/index.html _site/index.html
          printf 'Veldio redactie dashboard\n' > _site/README.txt
          touch _site/.nojekyll
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Publish dashboard package artifact
        uses: actions/upload-artifact@v4
        with:
          name: Veldio-Redactie-Dashboard
          path: _site/
          if-no-files-found: error
          retention-days: 30
