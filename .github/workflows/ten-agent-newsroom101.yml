name: Veldio 10 AI news scouts

on:
  push:
    branches: [main]
    paths:
      - 'scripts/ten-agent-newsroom101.js'
      - '.github/workflows/ten-agent-newsroom101.yml'
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: veldio-ten-agent-news-scouts
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Validate ten-agent monitoring and safety policy
        run: |
          node --test test/ten-agent-newsroom101.test.js
          node --check scripts/ten-agent-newsroom101.js
      - name: Scan three publisher RSS feeds using ten specialist beats
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: node scripts/ten-agent-newsroom101.js
      - name: Preserve scouting and rumor research report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: veldio-ten-agent-news-scouts
          path: .automatic-output/ten-agent-newsroom.json
          if-no-files-found: warn
          retention-days: 14
