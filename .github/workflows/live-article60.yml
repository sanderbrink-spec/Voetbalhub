name: Veldio production article Android16 proof
on:
  push:
    branches: [main]
    paths: ['editorial-evidence/reviewed-revisions71.json', '.github/workflows/live-article60.yml', 'scripts/verify-live-article60.py']
  workflow_run:
    workflows: ['Automatic verified news and images']
    types: [completed]
  workflow_dispatch:
    inputs:
      run_id:
        description: Successful autonomous publication run ID
        required: true
permissions:
  contents: read
  actions: read
jobs:
  publication:
    # Inspect even failed editorial runs: a verified publication can precede an unrelated provider outage.
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch' || (github.event.workflow_run.head_branch == 'main' && (github.event.workflow_run.conclusion == 'success' || github.event.workflow_run.conclusion == 'failure'))
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    outputs:
      article_ids: ${{ steps.report.outputs.article_ids || steps.revisions.outputs.article_ids }}
    steps:
      - uses: actions/checkout@v4
        if: github.event_name == 'push'
      - id: revisions
        if: github.event_name == 'push'
        run: |
          python3 - <<'PYTHON'
          import json, os, time, urllib.request
          base = 'https://voetbalhub-redactie.onrender.com'
          rows = json.load(open('editorial-evidence/reviewed-revisions71.json'))
          for _ in range(30):
              try:
                  with urllib.request.urlopen(base+'/ready', timeout=10) as res:
                      revision = json.load(res)['revision']
                  with urllib.request.urlopen(base+'/articles', timeout=12) as res:
                      articles = json.load(res)['articles']
                  if revision == os.environ['GITHUB_SHA'] and all(
                      len([a for a in articles if a.get('matchId') == row['matchId']]) == 1
                      and any(a['id'] == row['id'] and all(a.get(k) == row['draft'][k]
                          for k in ('headline', 'standfirst', 'body')) for a in articles)
                      for row in rows):
                      with open(os.environ['GITHUB_OUTPUT'], 'a') as out:
                          print('article_ids='+' '.join(row['id'] for row in rows), file=out)
                      break
              except (OSError, ValueError, KeyError):
                  pass
              time.sleep(15)
          else:
              raise SystemExit('De twee revisies zijn nog niet op de actieve productiecommit zichtbaar.')
          PYTHON
      - uses: actions/download-artifact@v4
        if: github.event_name != 'push'
        with:
          name: automatic-editorial-report
          path: report
          run-id: ${{ inputs.run_id || github.event.workflow_run.id }}
          github-token: ${{ github.token }}
      - id: report
        if: github.event_name != 'push'
        run: |
          python3 - <<'PY'
          import json,os
          r=json.load(open('report/report.json'))
          if r['counts']['published']>0 and r.get('published') and r['published'][0].get('id'):
              with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write('article_ids='+r['published'][0]['id']+'\n')
          else:print('Geen productieartikel om op Android te valideren.')
          PY
  android16:
    needs: publication
    if: needs.publication.outputs.article_ids != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Resolve the current premium APK build
        id: apk
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const {owner, repo} = context.repo;
            const expected = JSON.parse(fs.readFileSync('android-project/source-provenance.json', 'utf8'));
            const suffix = /^4\.(\d+)$/.exec(expected.version);
            if (!suffix) return core.setFailed('Onbekende productieversie in Android-bronmanifest.');
            const name = 'Veldio-' + suffix[1];
            const {data} = await github.rest.actions.listWorkflowRuns({owner, repo, workflow_id: 'build.yml', branch: 'main', status: 'success', per_page: 30});
            for (const run of data.workflow_runs) {
              const {data: artifacts} = await github.rest.actions.listWorkflowRunArtifacts({owner, repo, run_id: run.id});
              if (!artifacts.artifacts.some(a => a.name === name && !a.expired)) continue;
              const {data: source} = await github.rest.repos.getContent({owner, repo, ref: run.head_sha, path: 'android-project/source-provenance.json'});
              const built = JSON.parse(Buffer.from(source.content, 'base64'));
              if (JSON.stringify(built.files) !== JSON.stringify(expected.files)) continue;
              core.setOutput('run_id', String(run.id));
              core.setOutput('name', name);
              return;
            }
            core.setFailed('Geen gevalideerde ondertekende APK voor deze Android-bronversie.');
      - uses: actions/download-artifact@v4
        with:
          name: ${{ steps.apk.outputs.name }}
          path: apk
          run-id: ${{ steps.apk.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Restore the same approved offline artwork as the APK build
        run: python3 scripts/bundle-match-artwork68.py
      - name: Require APK provenance to match the production source
        env:
          APK_NAME: ${{ steps.apk.outputs.name }}
        run: |
          (cd apk && sha256sum -c sha256.txt)
          python3 scripts/verify-android-source.py "apk/$APK_NAME.apk"
          python3 - <<'PY'
          import json
          expected=json.load(open('android-project/source-provenance.json'))
          built=json.load(open('apk/Veldio-build-provenance.json'))
          assert built['files']==expected['files'], 'APK-broncode wijkt af van de productiebroncode'
          PY
      - run: python3 -m pip install 'uiautomator2>=3,<4'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Prepare the reader verification command
        run: |
          cat > "$RUNNER_TEMP/veldio-reader-proof.sh" <<'BASH'
          set -e
          adb shell wm size 1080x2340
          adb shell wm density 440
          mkdir -p .android-proof
          for article_id in $ARTICLE_IDS; do
            adb shell am force-stop nl.voetbalhub.app1
            python3 scripts/verify-live-article60.py "apk/$APK_NAME.apk" "$article_id" || {
              mv .android-smoke ".android-proof/$article_id"
              exit 1
            }
            mv .android-smoke ".android-proof/$article_id"
          done
          BASH
      - uses: reactivecircus/android-emulator-runner@v2
        env:
          ARTICLE_IDS: ${{ needs.publication.outputs.article_ids }}
          APK_NAME: ${{ steps.apk.outputs.name }}
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash "$RUNNER_TEMP/veldio-reader-proof.sh"
      - uses: actions/upload-artifact@v4
        if: always() && hashFiles('.android-proof/**/*') != ''
        with:
          name: Veldio-production-article-Android16
          path: .android-proof/
          include-hidden-files: true
          if-no-files-found: error
