name: Artwork queue evidence audit
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/artwork-queue-audit109.js'
      - 'scripts/artwork-production-plan110.js'
      - 'scripts/artwork-intake110c.js'
      - 'artwork-intake110c.json'
      - '.github/workflows/artwork-queue-audit109.yml'
  schedule:
    - cron: '47 8 * * *'
permissions:
  contents: read
concurrency:
  group: artwork-audit109
  cancel-in-progress: false
jobs:
  evidence-audit:
    if: github.repository == 'sanderbrink-spec/Voetbalhub'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Install pinned project dependencies
        run: npm install --ignore-scripts --no-audit --no-fund
      - name: Test queue audit safety invariants
        run: node --test test/artwork-queue-audit109.test.js test/artwork-production-plan110.test.js test/artwork-intake110c.test.js
      - name: Retrieve editorial queue without exposing encrypted drafts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .automatic-output
          git fetch --no-tags --depth=1 origin editorial-media
          git show FETCH_HEAD:editorial-queue45.json > .automatic-output/private-queue.tmp
      - name: Obtain verified recent finals from four subscribed competitions
        env:
          HUB_API_SECRET: ${{ secrets.HUB_API_SECRET }}
        shell: bash
        run: |
          set -euo pipefail
          # Only the current consented month. No new plan or paid add-on.
          if [[ -z "${HUB_API_SECRET:-}" || "$(date -u +%Y%m%d)" -ge 20261222 ]]; then
            echo "Provider not configured or one-month evaluation elapsed."
            exit 0
          fi
          for competition in eredivisie kkd premierleague knvbbeker; do
            target=".automatic-output/private-sportmonks-${competition}.tmp"
            if ! curl --fail --silent --show-error --max-time 45 \
              -H "Authorization: Bearer ${HUB_API_SECRET}" \
              "https://voetbalhub-redactie.onrender.com/editorial-sportmonks-recent?competition=${competition}" \
              -o "${target}"; then
              rm -f "${target}"
              echo "::warning::Verified ${competition} results unavailable; no guesses in audit."
            fi
          done
          node - <<'NODE'
          const fs=require('node:fs');
          const names=['eredivisie','kkd','premierleague','knvbbeker'];
          const snapshots=[];
          for(const name of names){
            const path='.automatic-output/private-sportmonks-'+name+'.tmp';
            if(!fs.existsSync(path))continue;
            try{
              const record=JSON.parse(fs.readFileSync(path,'utf8'));
              if(record?.competition===name&&
                ['available','source_unavailable','empty_recent_window'].includes(record?.status)){
                snapshots.push(record);
              }
            }catch{
              console.log('Unparseable provider response: '+name);
            }finally{fs.rmSync(path,{force:true});}
          }
          if(snapshots.length)fs.writeFileSync(
            '.automatic-output/private-sportmonks.tmp',JSON.stringify(snapshots));
          console.log('Provider competition statuses received: '+snapshots.length+'/4');
          NODE
      - name: Produce read-only evidence-gap report
        shell: bash
        run: |
          set -euo pipefail
          trap 'rm -f .automatic-output/private-queue.tmp .automatic-output/private-sportmonks.tmp' EXIT
          args=(--queue .automatic-output/private-queue.tmp --out .automatic-output/artwork-audit109.json)
          if [[ -f .automatic-output/private-sportmonks.tmp ]]; then
            args+=(--sportmonks .automatic-output/private-sportmonks.tmp)
          fi
          node scripts/artwork-queue-audit109.js "${args[@]}"
          node - <<'NODE'
          const fs=require('node:fs');
          const a=JSON.parse(fs.readFileSync('.automatic-output/artwork-audit109.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '## Veldio artwork audit 109A\n\n'+
            '- Vastgelopen beeldtaken: '+a.artworkRetries+'\n'+
            '- Zonder verifieerbare wedstrijdsnapshot: '+a.blockedWithoutVerifiedFixture+'\n'+
            '- Met geverifieerde wedstrijdcontext: '+a.verifiedFixtureCount+'\n'+
            '- Conflicterende wedstrijd-ID’s: '+a.fixtureConflicts+'\n'+
            '- Competitiedekking: '+JSON.stringify(a.verifiedCoverageByCompetition)+'\n'+
            '- Automatisch goedgekeurd: **0**\n'+
            '- Bericht: alleen bewijsadministratie; geen inhoud of beeld vrijgegeven.\n');
          NODE
      - name: Build rights-safe image production briefs from verified audit
        shell: bash
        run: |
          set -euo pipefail
          node scripts/artwork-production-plan110.js \
            --audit .automatic-output/artwork-audit109.json \
            --out .automatic-output/artwork-production-plan110.json
          node - <<'NODE'
          const fs=require('node:fs');
          const p=JSON.parse(fs.readFileSync('.automatic-output/artwork-production-plan110.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### Beeldproductie, alleen na externe kwaliteits- en rechtencontrole\n\n'+
            '- Verse dossiers met verifieerbaar dagdeel: '+p.readyNow+'\n'+
            '- Actietypen: '+JSON.stringify(p.counts)+'\n'+
            '- Eerste prioriteit: '+(p.firstBatch.join(', ')||'geen')+'\n'+
            '- Automatisch gegenereerd of goedgekeurd: **0**\n');
          NODE
      - name: Report staged originals without claiming rights or publication
        shell: bash
        run: |
          set -euo pipefail
          node scripts/artwork-intake110c.js \
            --audit .automatic-output/artwork-audit109.json \
            --intake artwork-intake110c.json \
            --out .automatic-output/artwork-intake-status110c.json
          node - <<'NODE'
          const fs=require('node:fs');
          const data=JSON.parse(fs.readFileSync('.automatic-output/artwork-intake-status110c.json','utf8'));
          fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY,
            '\n### 110C: exacte beeldherkomst en onafhankelijke rechtencontrole\n\n'+
            '- Beeldstatussen: '+JSON.stringify(data.summary)+'\n'+
            '- Automatisch goedgekeurd/gepubliceerd: **0**\n');
          NODE
      - name: Upload sanitized audit (never upload sealed draft checkpoints)
        uses: actions/upload-artifact@v4
        with:
          name: veldio-artwork-evidence-audit
          path: |
            .automatic-output/artwork-audit109.json
            .automatic-output/artwork-production-plan110.json
            .automatic-output/artwork-intake-status110c.json
          if-no-files-found: error
          retention-days: 14
