name: Read-only Veldio stadium production verification
on:
  push:
    branches: [verify/stadium84-85-production]
    paths: [.github/workflows/verify-stadium84-85-once.yml]
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Verify protected production dossiers and rasters
        env:
          HUB_API_SECRET: ${{ secrets.HUB_API_SECRET }}
        run: |
          node <<'NODE'
          const assert = require('node:assert/strict');
          const {createHash} = require('node:crypto');
          const manifest = require('./image-library49.json').assets;
          const phase84 = 'c5fc0d472188fd1cb97d3d73178332ea56ce3e5d';
          const base = 'https://voetbalhub-redactie.onrender.com';
          const secret = process.env.HUB_API_SECRET;
          assert.ok(secret, 'Redactiesleutel is niet beschikbaar');
          const get = (path, auth = false) => fetch(base + path, {
            headers: auth ? {authorization: 'Bearer ' + secret} : {},
            redirect: 'error',
            signal: AbortSignal.timeout(20000)
          });
          async function verify() {
            const response = await get('/editorial/stadium-review74', true);
            assert.equal(response.status, 200, 'Beveiligde productie-inventaris');
            const desk = await response.json();
            const assets = desk.slots.flatMap(slot => slot.pendingImages);
            assert.deepEqual([desk.slotsTotal, assets.length, desk.reviewPlan.firstReview, desk.reviewPlan.repairFirst, desk.reviewPlan.approved], [36, 36, 28, 8, 0]);
            assert.equal(assets.filter(asset => asset.preliminaryScreening).length, 28);
            assert.equal(assets.filter(asset => asset.knownIssue).length, 8);
            const assessments = assets.filter(asset => asset.fullResolutionAssessment);
            if (assessments.length) {
              assert.deepEqual(Object.fromEntries(assessments.map(a => [a.id, a.fullResolutionAssessment.score])), {
                'veldio74-fcgroningen-preview': 7.8, 'veldio74-fcgroningen-report': 8,
                'veldio75-sccambuur-preview': 8.2, 'veldio75-sccambuur-report': 7.5
              });
              assert.ok(assessments.every(a => a.fullResolutionAssessment.decision === 'pending'));
            }
            for (let i = 0; i < assets.length; i += 4) {
              await Promise.all(assets.slice(i, i + 4).map(async asset => {
                const row = manifest.find(r => r.id === asset.id);
                assert.equal(row.sha256, asset.sha256, asset.id);
                const image = await get(asset.reviewUrl, true);
                assert.equal(image.status, 200, asset.id);
                assert.match(image.headers.get('cache-control'), /private, no-store/);
                assert.equal(createHash('sha256').update(Buffer.from(await image.arrayBuffer())).digest('hex'), asset.sha256, asset.id);
                assert.equal((await get('/' + row.file.slice(7))).status, 404, asset.id);
              }));
            }
            return assessments.length;
          }
          (async () => {
            const initial = await (await get('/ready')).json();
            assert.equal(initial.revision, phase84);
            assert.equal(await verify(), 0);
            console.log('Fase 84 productie: 36 beschermde rasters met correcte SHA-256, 36 publieke routes gesloten, 28 screenings en 8 herstelgevallen.');
            for (let i = 0; i < 48; i++) {
              await new Promise(resolve => setTimeout(resolve, 7000));
              const current = await (await get('/ready')).json();
              if (current.revision === phase84 || !current.ready) continue;
              assert.equal(await verify(), 4);
              console.log('Fase 85 productie: vier beoordelingen pending, 0 van 36 vrijgegeven, revision ' + current.revision);
              return;
            }
            throw Error('Productiedeploy fase 85 niet tijdig zichtbaar');
          })().catch(error => { console.error(error.message); process.exitCode = 1; });
          NODE
