name: Veldio44 live image verification
on:
  push:
    branches: [main]
    paths: ['scripts/verify-image44.js', '.github/workflows/image44-smoke.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: veldio44-image-smoke
  cancel-in-progress: false
jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm ci --no-audit --no-fund
      - name: Verify live scarf generation, pixel review, hosting and unchanged public articles
        env:
          HUB_API_SECRET: ${{ secrets.HUB_API_SECRET }}
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/verify-image44.js
      - name: Keep checked image and provenance
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Veldio44-image-verification
          path: .automatic-output/image44-smoke.*
          include-hidden-files: true
          if-no-files-found: warn
