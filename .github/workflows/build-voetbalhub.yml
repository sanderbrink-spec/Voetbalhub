name: Build VoetbalHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Extract VoetbalHub
        run: |
          rm -rf vh-source
          mkdir vh-source
          unzip -q VoetbalHub-Finale.zip -d vh-source

      - name: Build APK
        working-directory: vh-source
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoetbalHub-APK
          path: vh-source/app/build/outputs/apk/debug/app-debug.apk
