name: VoetbalHub build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android project if repository stores a ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname 'VoetbalHub*.zip' | head -n 1 || true)"
            if [ -z "$ZIP" ]; then echo "::error::Geen Android-project of VoetbalHub ZIP gevonden."; exit 1; fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SETTINGS="$(find extracted -type f -name settings.gradle.kts | head -n 1 || true)"
            if [ -z "$SETTINGS" ]; then SETTINGS="$(find extracted -type f -name settings.gradle | head -n 1 || true)"; fi
            if [ -z "$SETTINGS" ]; then echo "::error::ZIP bevat geen settings.gradle(.kts)."; exit 1; fi
            cp -a "$(dirname "$SETTINGS")"/. .
          fi
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project structure found."
      - name: Fix back navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/nl/voetbalhub/app/MainActivity.java")
          s = p.read_text()
          start = s.index("    public void onBackPressed() {")
          marker = "        if (backPressedOnce) {"
          marker_pos = s.index(marker, start)
          prefix = s[start:marker_pos]
          if "active != null && !active.equals(\"Voor jou\")" not in prefix:
              replacement = '''    public void onBackPressed() {
                  // Artikelweergave eerst sluiten.
                  if (articleOpen) {
                      closeArticleView();
                      return;
                  }
                  // Vanaf iedere subpagina terug naar de hoofdpagina zonder afsluitmelding.
                  if (active != null && !active.equals("Voor jou")) {
                      showTab("Voor jou");
                      backPressedOnce = false;
                      main.removeCallbacks(resetBackPressed);
                      return;
                  }

'''
              s = s[:start] + replacement + s[marker_pos:]
              p.write_text(s)
          print("Back navigation rule verified/applied.")
          PY
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoetbalHub-back-navigation-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
