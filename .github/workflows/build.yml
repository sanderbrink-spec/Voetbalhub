                                  boolean isColumn = "column".equalsIgnoreCase(article.optString("type", "")) || "column".equalsIgnoreCase(article.optString("category", "")) || "de derde helft".equalsIgnoreCase(article.optString("category", ""));
                                  TextView label = tv(isColumn ? "✍  DE DERDE HELFT  ·  DOOR SANDER BRINK" : article.optString("category", "VOETBAL").toUpperCase(java.util.Locale.ROOT) + "  ·  VOETBALHUB ORIGINALS", 12, C.GREEN, true);
                                  label.setPadding(0, 0, 0, dp(8));
