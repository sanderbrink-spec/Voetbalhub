                              section.addView(tv("LAATSTE NIEUWS  ·  VOETBALHUB ORIGINALS", 14, C.GREEN, true));
                              for (org.json.JSONObject article : rows) {
                                  // Image-led, original artwork card: no third-party photo or logo rights needed.
                                  android.widget.FrameLayout hero = new android.widget.FrameLayout(this);
