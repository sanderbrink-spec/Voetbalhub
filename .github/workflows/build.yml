name: Veldio premium source APK build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['android-project/**', 'scripts/android-*.py', 'scripts/verify-android-source.py', 'scripts/browser/subpages46.cjs', 'scripts/browser/phase49.cjs', 'scripts/browser/functional47.cjs', 'test/subpages46.test.js', '.github/workflows/build.yml']
  push:
    branches: [main, 'fix/veldio-44b-premium-recovery', 'work/veldio-45', 'work/veldio-46', 'fix/veldio-47-functional', 'work/veldio-48', 'work/veldio-49']
    paths: ['android-project/**', 'scripts/android-*.py', 'scripts/verify-android-source.py', 'scripts/browser/subpages46.cjs', 'scripts/browser/phase49.cjs', 'scripts/browser/functional47.cjs', 'test/subpages46.test.js', '.github/workflows/build.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate49:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node scripts/browser/phase49.cjs
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: node scripts/browser/functional47.cjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-49-integration
          path: .browser-output/phase49.json
          include-hidden-files: true
  build:
    needs: validate49
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bundle approved offline artwork (SHA-256 checked)
        run: python3 scripts/bundle-match-artwork68.py
      - name: Verify approved versioned source
        run: python3 scripts/verify-android-source.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require matching healthy Render revision before main APK build
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/render-sync-guard.js verify
      - name: Validate models; mobile browser checks already passed on this source
        run: node --test test/subpages46.test.js test/football47.test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Prepare persistent release signing for main APK
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.VELDIO_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.VELDIO_RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.VELDIO_RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.VELDIO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('SIGNING_KEYSTORE_BASE64', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_PASSWORD', 'SIGNING_KEY_ALIAS')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('GitHub Actions signing secrets missing: ' + ', '.join(missing))

          def java_property(value):
              return (value.replace('\\', '\\\\').replace('\n', '\\n')
                           .replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:'))

          root = Path('android-project')
          try:
              decoded = base64.b64decode(''.join(os.environ['SIGNING_KEYSTORE_BASE64'].split()), validate=True)
          except Exception:
              raise SystemExit('VELDIO_RELEASE_KEYSTORE_BASE64 is not valid Base64 data')
          if len(decoded) < 1000:
              raise SystemExit('The release keystore is unexpectedly small')
          keystore = root / 'veldio-release.jks'
          keystore.write_bytes(decoded)
          keystore.chmod(0o600)
          properties = root / 'keystore.properties'
          properties.write_text(
              'storeFile=veldio-release.jks\n'
              + 'storePassword=' + java_property(os.environ['SIGNING_STORE_PASSWORD']) + '\n'
              + 'keyAlias=' + java_property(os.environ['SIGNING_KEY_ALIAS']) + '\n'
              + 'keyPassword=' + java_property(os.environ['SIGNING_KEY_PASSWORD']) + '\n',
              encoding='utf-8'
          )
          properties.chmod(0o600)
          print('Release signing material prepared (values not logged).')
          PY
      - name: Build release APK from current Veldio source
        working-directory: android-project
        run: gradle :app:assembleRelease --no-daemon
      - name: Remove signing material after compilation
        if: always()
        run: rm -f android-project/keystore.properties android-project/veldio-release.jks
      - name: Verify signature, manifest and approved APK assets
        run: |
          set -euo pipefail
          cp android-project/app/build/outputs/apk/release/app-release.apk Veldio-67.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Veldio-67.apk > signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Veldio-67.apk > manifest.txt
          grep -q "package: name='nl.voetbalhub.app1'.*versionCode='107'.*versionName='4.67'" manifest.txt
          grep -q "application-label:'Veldio'" manifest.txt
          python3 scripts/apk-secret-scan.py Veldio-67.apk
          python3 scripts/verify-android-source.py Veldio-67.apk
          python3 scripts/verify-apk-match-artwork68.py Veldio-67.apk
          sha256sum Veldio-67.apk > sha256.txt
          grep -qi 'Signer #1 certificate SHA-256 digest: 682c149cd7879d80a81c757f02fbca093b5a86e629fd29a0e5f8c715e0206d57' signature.txt
          echo 'PASS: main APK signed with permanently pinned new Veldio release certificate'
      - uses: actions/upload-artifact@v4
        with:
          name: Veldio-67
          path: |
            Veldio-67.apk
            Veldio-build-provenance.json
            signature.txt
            manifest.txt
            sha256.txt
          if-no-files-found: error
  preview:
    # Separate package remains installable beside the old differently signed app.
    # Main uses the new pinned certificate for fresh installations only.
    needs: validate49
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Bundle approved offline artwork (SHA-256 checked)
        run: python3 scripts/bundle-match-artwork68.py
      - name: Verify versioned source
        run: python3 scripts/verify-android-source.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build Android test APK on pull requests
        if: github.event_name == 'pull_request'
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Prepare Android WebView tests on pull requests
        if: github.event_name == 'pull_request'
        run: |
          python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Check match events on Android 16 before merge
        if: github.event_name == 'pull_request'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-match-events.py android-project/app/build/outputs/apk/debug/app-debug.apk
      - name: Prepare persistent release signing for separate preview
        if: github.ref == 'refs/heads/main'
        env:
          SIGNING_KEYSTORE_BASE64: ${{ secrets.VELDIO_RELEASE_KEYSTORE_BASE64 }}
          SIGNING_STORE_PASSWORD: ${{ secrets.VELDIO_RELEASE_KEYSTORE_PASSWORD }}
          SIGNING_KEY_PASSWORD: ${{ secrets.VELDIO_RELEASE_KEY_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.VELDIO_RELEASE_KEY_ALIAS }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          import os
          from pathlib import Path

          names = ('SIGNING_KEYSTORE_BASE64', 'SIGNING_STORE_PASSWORD', 'SIGNING_KEY_PASSWORD', 'SIGNING_KEY_ALIAS')
          missing = [name for name in names if not os.environ.get(name)]
          if missing:
              raise SystemExit('GitHub Actions signing secrets missing: ' + ', '.join(missing))

          def java_property(value):
              return (value.replace('\\', '\\\\').replace('\n', '\\n')
                           .replace('\r', '\\r').replace('=', '\\=').replace(':', '\\:'))

          root = Path('android-project')
          try:
              decoded = base64.b64decode(''.join(os.environ['SIGNING_KEYSTORE_BASE64'].split()), validate=True)
          except Exception:
              raise SystemExit('VELDIO_RELEASE_KEYSTORE_BASE64 is not valid Base64 data')
          if len(decoded) < 1000:
              raise SystemExit('The release keystore is unexpectedly small')
          keystore = root / 'veldio-release.jks'
          keystore.write_bytes(decoded)
          keystore.chmod(0o600)
          properties = root / 'keystore.properties'
          properties.write_text(
              'storeFile=veldio-release.jks\n'
              + 'storePassword=' + java_property(os.environ['SIGNING_STORE_PASSWORD']) + '\n'
              + 'keyAlias=' + java_property(os.environ['SIGNING_KEY_ALIAS']) + '\n'
              + 'keyPassword=' + java_property(os.environ['SIGNING_KEY_PASSWORD']) + '\n',
              encoding='utf-8'
          )
          properties.chmod(0o600)
          print('Release signing material prepared (values not logged).')
          PY
      - name: Compile separately signed Veldio preview APK
        if: github.ref == 'refs/heads/main'
        working-directory: android-project
        run: gradle :app:assembleRelease -PveldioPreview51=true --no-daemon
      - name: Remove signing material after compilation
        if: always()
        run: rm -f android-project/keystore.properties android-project/veldio-release.jks
      - name: Verify isolated package and APK safety
        if: github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          cp android-project/app/build/outputs/apk/release/app-release.apk Veldio-67-preview-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Veldio-67-preview-release.apk > preview-signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Veldio-67-preview-release.apk > preview-manifest.txt
          grep -q "package: name='nl.voetbalhub.preview51'.*versionCode='107'.*versionName='4.67'" preview-manifest.txt
          grep -q "application-label:'Veldio 64 Test'" preview-manifest.txt
          python3 scripts/apk-secret-scan.py Veldio-67-preview-release.apk
          python3 scripts/verify-android-source.py Veldio-67-preview-release.apk
          python3 scripts/verify-apk-match-artwork68.py Veldio-67-preview-release.apk
          grep -qi 'Signer #1 certificate SHA-256 digest: 682c149cd7879d80a81c757f02fbca093b5a86e629fd29a0e5f8c715e0206d57' preview-signature.txt
          sha256sum Veldio-67-preview-release.apk > preview-sha256.txt
      - uses: actions/upload-artifact@v4
        if: github.ref == 'refs/heads/main'
        with:
          name: Veldio-67-preview-release
          path: |
            Veldio-67-preview-release.apk
            preview-signature.txt
            preview-manifest.txt
            preview-sha256.txt
          if-no-files-found: error

  android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-67
          path: apk
      - name: Install device test driver
        run: python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test signed production release on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-release-smoke.py apk/Veldio-67.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-67-Android16-release
          path: .android-smoke/
          include-hidden-files: true
          if-no-files-found: error
