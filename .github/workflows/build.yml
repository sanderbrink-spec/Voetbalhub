                  });
              }

              '''
              method = method.replace("ENDPOINT_VALUE", endpoint)
              if method_marker not in s:
                  raise SystemExit("Could not find safe insertion point for editorial API method.")
              s = s.replace(method_marker, method + method_marker, 1)
          if "private void addPublisherLinkSection(LinearLayout parent)" not in s:
              method = """
              private void addPublisherLinkSection(LinearLayout parent) {
                  LinearLayout section = new LinearLayout(this);
                  section.setOrientation(LinearLayout.VERTICAL);
                  section.setPadding(dp(12), dp(10), dp(12), dp(10));
                  section.setBackground(cardBackground());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, 0, 0, dp(8));
                  parent.addView(section, lp);
                  section.addView(tv("NIEUWS BIJ DE BRON", 13, C.GREEN, true));
                  section.addView(tv("Open het laatste nieuws rechtstreeks bij de uitgever. Koppen en foto's worden hier niet overgenomen.", 13, C.MUTED, false));
                  String[][] publishers = {
                      {"VI", "https://www.vi.nl/"},
                      {"VoetbalPrimeur", "https://www.voetbalprimeur.nl/"},
                      {"VoetbalNieuws", "https://www.voetbalnieuws.nl/"}
                  };
                  for (String[] publisher : publishers) {
                      TextView link = tv("Open " + publisher[0] + "  ↗", 15, C.TEXT, true);
                      link.setPadding(0, dp(12), 0, dp(8));
                      link.setOnClickListener(v -> openArticle(publisher[1], publisher[0]));
                      section.addView(link);
                  }
              }

              """
              marker = "    private void scheduleScoresMidnightReset()"
              if marker not in s: raise SystemExit("Could not find insertion point for publisher links.")
              s = s.replace(marker, method + marker, 1)
          if "addEditorialNewsSection(list);" not in s:
              news_start = s.find("private void showNews()")
              if news_start < 0:
                  raise SystemExit("Could not find showNews() for editorial section.")
              list_marker = "LinearLayout list = new LinearLayout(this);"
              list_pos = s.find(list_marker, news_start)
              if list_pos < 0:
                  raise SystemExit("Could not find news list for editorial section.")
              list_end = list_pos + len(list_marker)
              s = s[:list_end] + "\n        addEditorialNewsSection(list);\n        addPublisherLinkSection(list);" + s[list_end:]
          elif "addPublisherLinkSection(list);" not in s:
              s = s.replace("addEditorialNewsSection(list);", "addEditorialNewsSection(list);\n        addPublisherLinkSection(list);", 1)

          # Originals reader intentionally uses its local branded illustration.
          # Do not inject a second image view, empty placeholder or photo credit.
          # Audit native app news sources before stripping unlicensed third-party feeds.
          print("AUDIT THIRD-PARTY FEED REFERENCES:")
          for n, line in enumerate(s.splitlines(), 1):
              low = line.lower()
              if any(k in low for k in ["rss", "feedburner", "voetbalprimeur", "espn.com", "vi.nl", "voetbalzone", "voetbalnieuws", "flashscore", "newsapi", "api-football", "scoreboard"]):
                  print(f"FEED_AUDIT {n}: {line.strip()[:350]}")
          # Print precise source for the results screen so its broken feed can be diagnosed.
          score_pos = s.find("private void showScores()")
          print("DEBUG SHOW SCORES:", s[score_pos:score_pos+11000] if score_pos >= 0 else "showScores method signature not found")
          # Route Back from bottom tabs first, then from a news subcategory.
          ix = s.find("private void addDailyFixtureSection")
          print("DEBUG DAILY FIXTURE:", s[ix:ix+6500] if ix >= 0 else "method not found")
          print("DEBUG NAV LINES:")
          for n,line in enumerate(s.splitlines(),1):
              if any(k in line.lower() for k in ["favorieten", "competities", "uitslagen", "bottom", "navigation", "navitem", "setonclicklistener", "onbackpressed"]):
                  print(f"{n}: {line[:260]}")
          marker = "public void onBackPressed()"
          method_start = s.index(marker)
          back_pos = s.index("if (backPressedOnce)", method_start)
          line_start = s.rfind(chr(10), 0, back_pos) + 1
          indent = s[line_start:back_pos]
          insert = 'if (editorialArticleOpen) { editorialArticleOpen = false; currentBottomTab = "Nieuws"; active = "Voor jou"; showNews(); backPressedOnce = false; main.removeCallbacks(resetBackPressed); return; }' + chr(10) + indent + 'if (returnToNewsBottomTab()) return;' + chr(10) + indent + 'if (active != null && !active.equals("Voor jou")) {' + chr(10) + indent + '    active = "Voor jou"; articleDisplayLimit = 20; buildChips(); showNews();' + chr(10) + indent + '    backPressedOnce = false;' + chr(10) + indent + '    main.removeCallbacks(resetBackPressed);' + chr(10) + indent + '    return;' + chr(10) + indent + '}' + chr(10) + indent
          s = s[:line_start] + indent + insert + s[line_start + len(indent):]
          if "private void addEditorialNewsSection(LinearLayout parent)" not in s or "addEditorialNewsSection(list);" not in s:
              raise SystemExit("Approved editorial articles section is missing.")
          p.write_text(s)
          print("Patched ESPN feeds, home screen and back navigation.")
          PY

      - name: Check public football score feeds
        shell: bash
        run: |
          set -u
          for league in uefa.champions uefa.europa uefa.europa.conf eng.1 esp.1 ita.1 ger.1 fra.1; do
            url="https://site.api.espn.com/apis/site/v2/sports/soccer/$league/scoreboard"
            echo "Checking $league"
            curl -L --max-time 15 -sS -o /tmp/scoreboard.json -w 'HTTP %{http_code} | %{content_type}\n' "$url" || true
            if python3 -c 'import json; d=json.load(open("/tmp/scoreboard.json")); print("events:",len(d.get("events",[])),"keys:",list(d.keys())[:8])' 2>/dev/null; then :; else echo "Response is not valid ESPN scoreboard JSON"; fi
          done

      - name: Verify live editorial API
        shell: bash
        run: |
          set -euo pipefail
          URL="${{ vars.EDITORIAL_API_URL }}"
          if [ -z "$URL" ]; then URL="https://voetbalhub-redactie.onrender.com/articles"; fi
          echo "Checking editorial API response (no credentials or article data are printed)."
          CODE="$(curl -L --max-time 30 -sS -o /tmp/editorial-api.json -w '%{http_code}' "$URL")"
          echo "Editorial API HTTP status: $CODE"
          if [ "$CODE" != "200" ]; then
            echo "::error::Editorial API did not return HTTP 200; APK build stopped so a broken API is not shipped as healthy."
            head -c 300 /tmp/editorial-api.json || true
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          d=json.loads(Path('/tmp/editorial-api.json').read_text())
          if not isinstance(d, dict) or not isinstance(d.get('articles'), list):
              raise SystemExit('Editorial API response must be JSON with an articles array.')
          print('Editorial API schema OK; published article count:', len(d['articles']))
          if not d['articles']:
              print('::warning::Editorial API is healthy but has no manually published originals yet. APK will build with its empty editorial state.')
          elif not all(isinstance(a, dict) and a.get('status') == 'published' and a.get('headline') and isinstance(a.get('body'), list) and any(str(p).strip() for p in a['body']) for a in d['articles']):
              raise SystemExit('Editorial API contains malformed published articles. Fix the published records before building.')
          else:
              print('Verified published original articles with readable body.')
          PY

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoetbalHub-1-redactie
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
