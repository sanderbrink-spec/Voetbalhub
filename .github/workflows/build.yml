                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> status.setText("Eigen nieuws tijdelijk niet beschikbaar (" + e.getClass().getSimpleName() + "). Tik op VERVERS om opnieuw te proberen."));
                      } finally {
