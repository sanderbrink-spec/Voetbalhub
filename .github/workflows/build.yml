name: VoetbalHub API test and APK build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  api-test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project if repository stores a ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname 'VoetbalHub*.zip' | head -n 1 || true)"
            if [ -z "$ZIP" ]; then
              echo "::error::Geen Android-project of VoetbalHub ZIP gevonden."
              exit 1
            fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SETTINGS="$(find extracted -type f -name settings.gradle.kts | head -n 1 || true)"
            if [ -z "$SETTINGS" ]; then
              SETTINGS="$(find extracted -type f -name settings.gradle | head -n 1 || true)"
            fi
            if [ -z "$SETTINGS" ]; then
              echo "::error::ZIP bevat geen settings.gradle(.kts)."
              exit 1
            fi
            ROOT="$(dirname "$SETTINGS")"
            cp -a "$ROOT"/. .
          fi
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project structure found."

      - name: Patch live match feeds and home screen
        env:
          EDITORIAL_API_URL: ${{ vars.EDITORIAL_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/nl/voetbalhub/app/MainActivity.java")
          s = p.read_text()
          start = s.index("    /** European fixtures from API-Football.")
          end = s.index("\n    private void scheduleScoresMidnightReset()", start)
          replacement = """    /** European fixtures use public ESPN scoreboards as a fallback to API-Football plan restrictions. */
              private void addApiFootballEuropeanSection(LinearLayout parent) {
                  addDailyFixtureSection(parent, "EUROPA CLUBS · LIVE & PROGRAMMA", new String[]{
                      "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard",
                      "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard",
                      "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa.conf/scoreboard"
                  }, false);
              }
          """
          s = s[:start] + replacement + s[end:]
          old = '''        if (active.equals("Voor jou") || active.equals("Eredivisie")) {
                      addEredivisieLiveBlock(list);
                  }'''
          new = '''        if (active.equals("Voor jou")) {
                      addDailyFixtureSection(list, "LIVE WEDSTRIJDEN · EUROPA", new String[]{
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.champions/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/uefa.europa.conf/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/esp.1/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/ita.1/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/ger.1/scoreboard",
                          "https://site.api.espn.com/apis/site/v2/sports/soccer/fra.1/scoreboard"
                      }, false);
                      addEredivisieLiveBlock(list);
                  } else if (active.equals("Eredivisie")) {
                      addEredivisieLiveBlock(list);
                  }'''
          if old not in s:
              raise SystemExit("Home-screen insertion point not found; stopping safely.")
          s = s.replace(old, new, 1)
          # Track the actual bottom navigation tab separately from the news category chips.
          class_pos = s.index("public class MainActivity")
          class_open = s.index("{", class_pos) + 1
          if "currentBottomTab" not in s:
              s = s[:class_open] + '\n    private String currentBottomTab = "Nieuws";\n' + s[class_open:]
          # Track bottom-tab selections directly in the existing switch cases.
          for tab, action in [("Nieuws", None), ("Uitslagen", "showScores()"), ("Competities", "showCompetitions()"), ("Favorieten", "showFavorites()"), ("Meer", "showMore()")]:
              marker_case = 'case "' + tab + '":'
              pos = s.find(marker_case, s.find('String[][] items ='))
              if pos >= 0:
                  end = s.find("break;", pos)
                  if end >= 0 and "currentBottomTab" not in s[pos:end]:
                      s = s[:pos] + marker_case + ' currentBottomTab = "' + tab + '";' + s[pos+len(marker_case):]
          # Add a safe helper to find and activate the bottom Nieuws item if a tab is active.
          back_marker = "public void onBackPressed()"
          if "private boolean returnToNewsBottomTab()" not in s:
              helper = """
          private boolean returnToNewsBottomTab() {
              if ("Nieuws".equals(currentBottomTab)) return false;
              currentBottomTab = "Nieuws";
              active = "Voor jou";
              articleDisplayLimit = 20;
              buildChips();
              showNews();
              backPressedOnce = false;
              main.removeCallbacks(resetBackPressed);
              return true;
          }

          """
              back_index = s.index(back_marker)
              annotation_index = s.rfind("@Override", 0, back_index)
              insert_index = annotation_index if annotation_index >= 0 and back_index - annotation_index < 100 else back_index
              s = s[:insert_index] + helper + s[insert_index:]
          # Add the published-article API section to the home screen.
          import os
          api_url = os.environ.get("EDITORIAL_API_URL", "").strip()
          if api_url and not api_url.startswith("https://"):
              raise SystemExit("EDITORIAL_API_URL must be an HTTPS URL.")
          endpoint = api_url or "NOT_CONFIGURED"
          method_marker = "    private void scheduleScoresMidnightReset()"
          if "private void addEditorialNewsSection(LinearLayout parent)" not in s:
              method = '''
              private static final String EDITORIAL_API_URL = "ENDPOINT_VALUE";

              private void addEditorialNewsSection(LinearLayout parent) {
                  LinearLayout section = new LinearLayout(this);
                  section.setOrientation(LinearLayout.VERTICAL);
                  section.setPadding(dp(12), dp(10), dp(12), dp(10));
                  section.setBackground(cardBackground());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, 0, 0, dp(8));
                  parent.addView(section, 0, lp);
                  section.addView(tv("VOETBALHUB ORIGINALS", 13, C.GREEN, true));
                  TextView status = tv("Eigen voetbalartikelen laden…", 13, C.MUTED, false);
                  status.setPadding(0, dp(5), 0, 0);
                  section.addView(status);
                  if (EDITORIAL_API_URL.equals("NOT_CONFIGURED")) {
                      status.setText("Eigen artikelen volgen zodra de redactie-API is gekoppeld.");
                      return;
                  }
                  executor.execute(() -> {
                      HttpURLConnection conn = null;
                      try {
                          conn = (HttpURLConnection) new URL(EDITORIAL_API_URL).openConnection();
                          conn.setConnectTimeout(7000);
                          conn.setReadTimeout(7000);
                          conn.setRequestMethod("GET");
                          conn.setRequestProperty("Accept", "application/json");
                          org.json.JSONObject data;
                          try (InputStream in = conn.getInputStream();
                               java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream()) {
                              byte[] buf = new byte[4096]; int n;
                              while ((n = in.read(buf)) != -1) out.write(buf, 0, n);
                              data = new org.json.JSONObject(out.toString("UTF-8"));
                          }
                          org.json.JSONArray articles = data.optJSONArray("articles");
                          final java.util.ArrayList<org.json.JSONObject> rows = new java.util.ArrayList<>();
                          if (articles != null) for (int i = 0; i < articles.length() && i < 8; i++) {
                              org.json.JSONObject article = articles.optJSONObject(i);
                              if (article != null && "published".equals(article.optString("status"))) rows.add(article);
                          }
                          runOnUiThread(() -> {
                              section.removeView(status);
                              if (rows.isEmpty()) {
                                  section.addView(tv("Nog geen goedgekeurde artikelen gepubliceerd.", 13, C.MUTED, false));
                                  return;
                              }
                              for (org.json.JSONObject article : rows) {
                                  TextView headline = tv(article.optString("headline", "Voetbalnieuws"), 16, C.TEXT, true);
                                  headline.setPadding(0, dp(9), 0, dp(3));
                                  section.addView(headline);
                                  String intro = article.optString("standfirst", "");
                                  if (!intro.isEmpty()) section.addView(tv(intro, 13, C.MUTED, false));
                                  org.json.JSONArray body = article.optJSONArray("body");
                                  if (body != null && body.length() > 0) {
                                      TextView paragraph = tv(body.optString(0), 13, C.TEXT, false);
                                      paragraph.setPadding(0, dp(4), 0, dp(8));
                                      section.addView(paragraph);
                                  }
                                  View divider = new View(this);
                                  divider.setBackgroundColor(0xFF20372A);
                                  section.addView(divider, new LinearLayout.LayoutParams(-1, dp(1)));
                              }
                          });
                      } catch (Exception e) {
                          runOnUiThread(() -> status.setText("Eigen nieuws tijdelijk niet beschikbaar."));
                      } finally {
                          if (conn != null) conn.disconnect();
                      }
                  });
              }

              '''
              method = method.replace("ENDPOINT_VALUE", endpoint)
              if method_marker not in s:
                  raise SystemExit("Could not find safe insertion point for editorial API method.")
              s = s.replace(method_marker, method_marker + "\n" + method, 1)
          if "addEditorialNewsSection(list);" not in s:
              home_marker = '                  if (active.equals("Voor jou")) {'
              if home_marker not in s:
                  raise SystemExit("Could not find home screen insertion point for editorial section.")
              s = s.replace(home_marker, home_marker + "\n                      addEditorialNewsSection(list);", 1)

          # Print precise source for the results screen so its broken feed can be diagnosed.
          score_pos = s.find("private void showScores()")
          print("DEBUG SHOW SCORES:", s[score_pos:score_pos+11000] if score_pos >= 0 else "showScores method signature not found")
          # Route Back from bottom tabs first, then from a news subcategory.
          ix = s.find("private void addDailyFixtureSection")
          print("DEBUG DAILY FIXTURE:", s[ix:ix+6500] if ix >= 0 else "method not found")
          print("DEBUG NAV LINES:")
          for n,line in enumerate(s.splitlines(),1):
              if any(k in line.lower() for k in ["favorieten", "competities", "uitslagen", "bottom", "navigation", "navitem", "setonclicklistener", "onbackpressed"]):
                  print(f"{n}: {line[:260]}")
          marker = "public void onBackPressed()"
          method_start = s.index(marker)
          back_pos = s.index("if (backPressedOnce)", method_start)
          line_start = s.rfind(chr(10), 0, back_pos) + 1
          indent = s[line_start:back_pos]
          insert = 'if (returnToNewsBottomTab()) return;' + chr(10) + indent + 'if (active != null && !active.equals("Voor jou")) {' + chr(10) + indent + '    active = "Voor jou"; articleDisplayLimit = 20; buildChips(); showNews();' + chr(10) + indent + '    backPressedOnce = false;' + chr(10) + indent + '    main.removeCallbacks(resetBackPressed);' + chr(10) + indent + '    return;' + chr(10) + indent + '}' + chr(10) + indent
          s = s[:line_start] + indent + insert + s[line_start + len(indent):]
          p.write_text(s)
          print("Patched ESPN feeds, home screen and back navigation.")
          PY

      - name: Check public football score feeds
        shell: bash
        run: |
          set -u
          for league in uefa.champions uefa.europa uefa.europa.conf eng.1 esp.1 ita.1 ger.1 fra.1; do
            url="https://site.api.espn.com/apis/site/v2/sports/soccer/$league/scoreboard"
            echo "Checking $league"
            curl -L --max-time 15 -sS -o /tmp/scoreboard.json -w 'HTTP %{http_code} | %{content_type}\n' "$url" || true
            if python3 -c 'import json; d=json.load(open("/tmp/scoreboard.json")); print("events:",len(d.get("events",[])),"keys:",list(d.keys())[:8])' 2>/dev/null; then :; else echo "Response is not valid ESPN scoreboard JSON"; fi
          done

      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build debug APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoetbalHub-live-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
