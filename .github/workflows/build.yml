name: VoetbalHub API test and APK build

on:
  workflow_dispatch:

jobs:
  api-test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Extract Android project if repository stores a ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname 'VoetbalHub*.zip' | head -n 1 || true)"
            if [ -z "$ZIP" ]; then
              echo "::error::Geen Android-project of VoetbalHub ZIP gevonden."
              exit 1
            fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SETTINGS="$(find extracted -type f -name settings.gradle.kts | head -n 1 || true)"
            if [ -z "$SETTINGS" ]; then
              SETTINGS="$(find extracted -type f -name settings.gradle | head -n 1 || true)"
            fi
            if [ -z "$SETTINGS" ]; then
              echo "::error::ZIP bevat geen settings.gradle(.kts)."
              exit 1
            fi
            ROOT="$(dirname "$SETTINGS")"
            cp -a "$ROOT"/. .
          fi
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project structure found."

      - name: Separate VoetbalHub 1 from private app
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          gradle = Path("app/build.gradle.kts")
          if not gradle.exists():
              gradle = Path("app/build.gradle")
          if not gradle.exists():
              raise SystemExit("App Gradle file not found.")
          content = gradle.read_text()
          if gradle.name.endswith(".kts"):
              pattern = r'applicationId\s*=\s*"[^"]+"'
              replacement = 'applicationId = "nl.voetbalhub.app1"'
          else:
              pattern = r'applicationId\s+"[^"]+"'
              replacement = 'applicationId "nl.voetbalhub.app1"'
          updated, n = re.subn(pattern, replacement, content, count=1)
          if n != 1:
              raise SystemExit("Could not safely locate applicationId in app Gradle file.")
          gradle.write_text(updated)
          print(f"Set separate applicationId in {gradle}")
          label_changed = False
          for p in Path("app/src/main/res").glob("values*/strings.xml"):
              content = p.read_text()
              updated, n = re.subn(r'(<string\s+name="app_name"[^>]*>).*?(</string>)', r'\1VoetbalHub 1\2', content, count=1, flags=re.S)
              if n:
                  p.write_text(updated)
                  label_changed = True
          if not label_changed:
              manifest = Path("app/src/main/AndroidManifest.xml")
              if manifest.exists():
                  content = manifest.read_text()
                  updated, n = re.subn(r'android:label="[^"]+"', 'android:label="VoetbalHub 1"', content, count=1)
                  if n:
                      manifest.write_text(updated)
                      label_changed = True
          if not label_changed:
              raise SystemExit("Could not safely update Android app label.")
          print("App label set to VoetbalHub 1.")
          PY

      - name: Patch live match feeds and home screen
        env:
          EDITORIAL_API_URL: ${{ vars.EDITORIAL_API_URL }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path("app/src/main/java/nl/voetbalhub/app/MainActivity.java")
          s = p.read_text()
          # Rights-safe mode: do not reproduce third-party RSS headlines, snippets or images
          # until explicit commercial reuse permission is confirmed. Originals remain manually approved.
          feed_patch = re.sub(r'private final String\[\] feedNames\s*=\s*\{[^}]*\};', 'private final String[] feedNames = {};', s, count=1, flags=re.S)
          if feed_patch == s:
              raise SystemExit("Could not safely locate feedNames declaration.")
          s = feed_patch
          feed_patch = re.sub(r'private final String\[\] feedUrls\s*=\s*\{[^}]*\};', 'private final String[] feedUrls = {};', s, count=1, flags=re.S)
          if feed_patch == s:
              raise SystemExit("Could not safely locate feedUrls declaration.")
          s = feed_patch
          # Never present an intentionally disabled RSS feed as a network failure.
          # The public /articles endpoint contains only human-approved originals.
          s = s.replace("Geen nieuws ontvangen. Controleer internet en tik op VERVERS.", "")
          s = s.replace("Geen nieuws opgehaald. Controle: ", "")
          # Show a single authoritative editorial empty state instead of duplicate notices.
          print("Verified manually approved article fetch and accurate empty-state messaging.")
          # The editorial API remains a separate, manually approved VoetbalHub Originals section.
          # Replace the scores screen with a clear rights-safe placeholder, and remove
          # all live score cards from the home/news categories.
          score_start = s.find("private void showScores()")
          if score_start < 0:
              raise SystemExit("Could not find showScores() to disable unlicensed live scores.")
          score_end = s.find("\n    private ", score_start + 1)
          if score_end < 0:
              raise SystemExit("Could not safely find end of showScores().")
          score_method = """private void showScores() {
              if (liveScoresRefresh != null) main.removeCallbacks(liveScoresRefresh);
              scoresPageVisible = false;
              content.removeAllViews();
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.addView(sectionHeader("Uitslagen", "NIEUWS", this::showNews));
              LinearLayout list = new LinearLayout(this);
              list.setOrientation(LinearLayout.VERTICAL);
              list.setPadding(dp(18), dp(18), dp(18), dp(24));
              list.addView(tv("Live uitslagen zijn tijdelijk verwijderd totdat de gebruiksrechten zijn bevestigd.", 15, C.MUTED, false));
              root.addView(list, new LinearLayout.LayoutParams(-1, -1));
              content.addView(root);
          }

          """
          s = s[:score_start] + score_method + s[score_end:]
          # Disable the scorecard-rendering helpers themselves. Keeping their signatures avoids
          # touching call sites or accidentally deleting Java declarations.
          def disable_method(source, signature, replacement_body):
              start = source.find(signature)
              if start < 0: return source
              brace = source.find("{", start)
              if brace < 0: raise SystemExit("Missing body for " + signature)
              depth = 0
              end = -1
              for j in range(brace, len(source)):
                  if source[j] == "{": depth += 1
                  elif source[j] == "}":
                      depth -= 1
                      if depth == 0:
                          end = j + 1
                          break
              if end < 0: raise SystemExit("Unclosed body for " + signature)
              return source[:brace] + "{ " + replacement_body + " }" + source[end:]
          s = disable_method(s, "private void addDailyFixtureSection(", "/* disabled pending rights confirmation */")
          s = disable_method(s, "private void addEredivisieLiveBlock(", "/* disabled pending rights confirmation */")
          # Disable the API-Football European match block too, irrespective of comment changes.
          helper_start = s.find("private void addApiFootballEuropeanSection(")
          if helper_start >= 0:
              brace = s.find("{", helper_start)
              depth = 0
              helper_end = -1
              for j in range(brace, len(s)):
                  if s[j] == "{": depth += 1
                  elif s[j] == "}":
                      depth -= 1
                      if depth == 0:
                          helper_end = j + 1
                          break
              if helper_end < 0:
                  raise SystemExit("Could not safely close European scoreboard helper.")
              s = s[:helper_start] + 'private void addApiFootballEuropeanSection(LinearLayout parent) { /* disabled pending rights confirmation */ }' + s[helper_end:]
          # Remove third-party source links from the More and Scores screens.
          s = re.sub(r'\s*addSiteCard\(list,\s*"(?:Flashscore|VI[^"]*|VoetbalPrimeur|VoetbalNieuws)"[^;]*;', '', s)
          # Hide stale RSS label when feeds have been disabled.
          s = s.replace('"Live RSS  •  VI  •  VoetbalPrimeur  •  VoetbalNieuws"', '"Alleen eigen VoetbalHub-artikelen"')
          # Track the actual bottom navigation tab separately from the news category chips.
          class_pos = s.index("public class MainActivity")
          class_open = s.index("{", class_pos) + 1
          if "currentBottomTab" not in s:
              s = s[:class_open] + '\n    private String currentBottomTab = "Nieuws";\n' + s[class_open:]
          # Track bottom-tab selections directly in the existing switch cases.
          for tab, action in [("Nieuws", None), ("Uitslagen", "showScores()"), ("Competities", "showCompetitions()"), ("Favorieten", "showFavorites()"), ("Meer", "showMore()")]:
              marker_case = 'case "' + tab + '":'
              pos = s.find(marker_case, s.find('String[][] items ='))
              if pos >= 0:
                  end = s.find("break;", pos)
                  if end >= 0 and "currentBottomTab" not in s[pos:end]:
                      s = s[:pos] + marker_case + ' currentBottomTab = "' + tab + '";' + s[pos+len(marker_case):]
          # Replace the disabled Uitslagen bottom-navigation slot with a permanent column tab.
          # The column is a first-class destination, not merely a transient home-page card.
          nav_start = s.find("String[][] items =")
          if nav_start < 0:
              raise SystemExit("Cannot locate bottom navigation to install column tab.")
          nav_end = s.find("};", nav_start)
          if nav_end < 0:
              raise SystemExit("Cannot locate bottom navigation item array end.")
          nav = s[nav_start:nav_end+2]
          if '"Uitslagen"' not in nav:
              raise SystemExit("Expected disabled Uitslagen navigation slot is missing.")
          s = s[:nav_start] + nav.replace('"Uitslagen"', '"Column"') + s[nav_end+2:]
          # The bottom tab dispatcher now opens the dedicated column destination.
          nav_start = s.find("String[][] items =")
          switch_pos = s.find('case "Uitslagen":', nav_start)
          if switch_pos < 0:
              raise SystemExit("Cannot locate Uitslagen bottom navigation switch case.")
          switch_end = s.find("break;", switch_pos)
          if switch_end < 0:
              raise SystemExit("Cannot locate bottom navigation switch case end.")
          old_case = s[switch_pos:switch_end]
          new_case = old_case.replace('case "Uitslagen":', 'case "Column":').replace('showScores()', 'showColumn()').replace('currentBottomTab = "Uitslagen"', 'currentBottomTab = "Column"')
          s = s[:switch_pos] + new_case + s[switch_end:]
          if "private void showColumn()" not in s:
              column_page = """
          private void showColumn() {
              if (liveScoresRefresh != null) main.removeCallbacks(liveScoresRefresh);
              scoresPageVisible = false;
              content.removeAllViews();
              LinearLayout root = new LinearLayout(this);
              root.setOrientation(LinearLayout.VERTICAL);
              root.addView(sectionHeader("De Derde Helft", "NIEUWS", this::showNews));
              ScrollView scroll = new ScrollView(this);
              LinearLayout page = new LinearLayout(this);
              page.setOrientation(LinearLayout.VERTICAL);
              page.setPadding(dp(14), dp(16), dp(14), dp(28));
              page.addView(tv("DE DERDE HELFT", 18, C.GREEN, true));
              TextView heading = tv("Door Sander Brink", 27, C.TEXT, true);
              heading.setPadding(0, dp(8), 0, dp(8));
              page.addView(heading);
              page.addView(tv("Geen meeloperij. Geen excuses. Gewoon mijn kijk op voetbal.", 16, C.MUTED, false));
              TextView columnPromise = tv("Iedere week een scherpe, volledig zelfgeschreven column over de Eredivisie. Geen automatische AI-columns en geen publicatie zonder mijn akkoord.", 14, C.MUTED, false);
              columnPromise.setPadding(0, dp(12), 0, dp(8));
              page.addView(columnPromise);
              TextView archive = tv("COLUMN & ARTIKELEN", 13, C.GREEN, true);
              archive.setPadding(0, dp(22), 0, dp(10));
              page.addView(archive);
              addEditorialNewsSection(page);
              scroll.addView(page);
              root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
              content.addView(root);
          }

          """
              insert_at = s.find("private void showScores()")
              if insert_at < 0:
                  raise SystemExit("Cannot insert column destination without scores placeholder.")
              s = s[:insert_at] + column_page + s[insert_at:]
          # Avoid silently losing the permanent tab when future UI patches run.
          if 'case "Column":' not in s or "private void showColumn()" not in s:
              raise SystemExit("Permanent column navigation patch incomplete.")
          # Add a safe helper to find and activate the bottom Nieuws item if a tab is active.
          back_marker = "public void onBackPressed()"
          if "private boolean returnToNewsBottomTab()" not in s:
              helper = """
          private boolean returnToNewsBottomTab() {
              if ("Nieuws".equals(currentBottomTab)) return false;
              currentBottomTab = "Nieuws";
              active = "Voor jou";
              articleDisplayLimit = 20;
              buildChips();
              showNews();
              backPressedOnce = false;
              main.removeCallbacks(resetBackPressed);
              return true;
          }

          """
              back_index = s.index(back_marker)
              annotation_index = s.rfind("@Override", 0, back_index)
              insert_index = annotation_index if annotation_index >= 0 and back_index - annotation_index < 100 else back_index
              s = s[:insert_index] + helper + s[insert_index:]
          # Add the published-article API section to the home screen.
          import os
          api_url = os.environ.get("EDITORIAL_API_URL", "").strip()
          if api_url and not api_url.startswith("https://"):
              raise SystemExit("EDITORIAL_API_URL must be an HTTPS URL.")
          endpoint = api_url or "https://voetbalhub-redactie.onrender.com/articles"
          method_marker = "    private void scheduleScoresMidnightReset()"
          if "private void addEditorialNewsSection(LinearLayout parent)" not in s:
              method = '''
              private static final String EDITORIAL_API_URL = "ENDPOINT_VALUE";

              private boolean editorialArticleOpen = false;
              private android.app.Dialog editorialDialog;

              private void closeEditorialArticle() {
                  if (editorialDialog != null) editorialDialog.dismiss();
                  editorialArticleOpen = false;
              }

              private void showEditorialArticle(org.json.JSONObject article) {
                  editorialArticleOpen = true;
                  if (liveScoresRefresh != null) main.removeCallbacks(liveScoresRefresh);
                  if (editorialDialog != null && editorialDialog.isShowing()) editorialDialog.dismiss();
                  LinearLayout root = new LinearLayout(this);
                  root.setOrientation(LinearLayout.VERTICAL);
                  root.addView(sectionHeader("VoetbalHub Originals", "TERUG", this::closeEditorialArticle));
                  ScrollView scroll = new ScrollView(this);
                  LinearLayout page = new LinearLayout(this);
                  page.setOrientation(LinearLayout.VERTICAL);
                  page.setPadding(dp(18), dp(14), dp(18), dp(28));
                  page.addView(tv(article.optString("category", "VOETBAL").toUpperCase(java.util.Locale.ROOT), 12, C.GREEN, true));
                  TextView title = tv(article.optString("headline", "Voetbalnieuws"), 25, C.TEXT, true);
                  title.setPadding(0, dp(8), 0, dp(10));
                  page.addView(title);
                  TextView originalArt = tv("⚽  VOETBALHUB ORIGINALS", 17, C.GREEN, true);
                  originalArt.setGravity(android.view.Gravity.CENTER);
                  android.graphics.drawable.GradientDrawable artBackground = new android.graphics.drawable.GradientDrawable(
                      android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                      new int[]{0xFF145B36, 0xFF091C14});
                  artBackground.setCornerRadius(dp(14));
                  originalArt.setBackground(artBackground);
                  LinearLayout.LayoutParams artParams = new LinearLayout.LayoutParams(-1, dp(150));
                  artParams.setMargins(0, dp(10), 0, dp(14));
                  page.addView(originalArt, artParams);
                  String intro = article.optString("standfirst", "").trim();
                  if (!intro.isEmpty()) {
                      TextView introText = tv(intro, 16, C.MUTED, false);
                      introText.setPadding(0, 0, 0, dp(12));
                      page.addView(introText);
                  }
                  // Original articles use the local licensed VoetbalHub banner only.
                  // No remote image slot or image credit is created in this reader.
                  TextView byline = tv(article.optString("author", "VoetbalHub Redactie"), 11, C.MUTED, false);
                  byline.setPadding(0, 0, 0, dp(12));
                  page.addView(byline);
                  org.json.JSONArray paragraphs = article.optJSONArray("body");
                  if (paragraphs != null) {
                      for (int i = 0; i < paragraphs.length(); i++) {
                          String paragraph = paragraphs.optString(i, "").trim();
                          if (!paragraph.isEmpty()) {
                              TextView bodyText = tv(paragraph, 16, C.TEXT, false);
                              bodyText.setPadding(0, 0, 0, dp(14));
                              page.addView(bodyText);
                          }
                      }
                  }
                  String why = article.optString("why_it_matters", "");
                  if (!why.isEmpty()) {
                      page.addView(tv("WAAROM DIT ERTOE DOET", 12, C.GREEN, true));
                      TextView whyText = tv(why, 15, C.TEXT, false);
                      whyText.setPadding(0, dp(6), 0, dp(14));
                      page.addView(whyText);
                  }
                  android.view.View line = new android.view.View(this);
                  line.setBackgroundColor(0xFF244136);
                  LinearLayout.LayoutParams lineLp = new LinearLayout.LayoutParams(-1, dp(1));
                  lineLp.setMargins(0, dp(8), 0, dp(12));
                  page.addView(line, lineLp);
                  page.addView(tv("VOETBALHUB ORIGINALS  ·  Onafhankelijke redactie", 11, C.GREEN, true));
                  scroll.addView(page);
                  root.addView(scroll, new LinearLayout.LayoutParams(-1, 0, 1));
                  editorialDialog = new android.app.Dialog(this);
                  editorialDialog.requestWindowFeature(android.view.Window.FEATURE_NO_TITLE);
                  editorialDialog.setContentView(root);
                  editorialDialog.setOnDismissListener(dialog -> { editorialArticleOpen = false; editorialDialog = null; });
                  editorialDialog.show();
                  android.view.Window articleWindow = editorialDialog.getWindow();
                  if (articleWindow != null) {
                      articleWindow.setBackgroundDrawableResource(android.R.color.black);
                      articleWindow.setLayout(-1, -1);
                  }
              }

              private void addEditorialNewsSection(LinearLayout parent) {
                  LinearLayout section = new LinearLayout(this);
                  section.setOrientation(LinearLayout.VERTICAL);
                  section.setPadding(dp(6), dp(7), dp(6), dp(7));
                  section.setBackground(cardBackground());
                  LinearLayout.LayoutParams lp = new LinearLayout.LayoutParams(-1, -2);
                  lp.setMargins(0, 0, 0, dp(8));
                  parent.addView(section, 0, lp);
                  // Prominent editorial column feature: visible even before the first column is published.
                  LinearLayout columnHero = new LinearLayout(this);
                  columnHero.setOrientation(LinearLayout.VERTICAL);
                  columnHero.setPadding(dp(18), dp(18), dp(18), dp(18));
                  android.graphics.drawable.GradientDrawable columnBg = new android.graphics.drawable.GradientDrawable(
                      android.graphics.drawable.GradientDrawable.Orientation.TL_BR,
                      new int[]{0xFF143A26, 0xFF091511, 0xFF080C0B});
                  columnBg.setCornerRadius(dp(18));
                  columnBg.setStroke(dp(1), 0xFF8AF000);
                  columnHero.setBackground(columnBg);
                  LinearLayout.LayoutParams columnLp = new LinearLayout.LayoutParams(-1, -2);
                  columnLp.setMargins(0, dp(2), 0, dp(16));
                  section.addView(columnHero, columnLp);
                  TextView columnTag = tv("✍  DE DERDE HELFT", 15, C.GREEN, true);
                  columnTag.setPadding(0, 0, 0, dp(12));
                  columnHero.addView(columnTag);
                  TextView columnTitle = tv("Negen wedstrijden. Eén uitgesproken mening.", 26, C.TEXT, true);
                  columnHero.addView(columnTitle);
                  TextView columnSub = tv("Scherpe analyses, eerlijke kritiek en geen meeloperij. Iedere week de Eredivisie door de ogen van Sander Brink.", 15, C.TEXT, false);
                  columnSub.setPadding(0, dp(10), 0, dp(13));
                  columnHero.addView(columnSub);
                  TextView columnAuthor = tv("DOOR SANDER BRINK  ·  BINNENKORT", 12, C.GREEN, true);
                  columnHero.addView(columnAuthor);
                  TextView columnAction = tv("ONTDEK DE RUBRIEK  →", 16, 0xFF091109, true);
                  columnAction.setGravity(android.view.Gravity.CENTER);
                  columnAction.setPadding(dp(12), dp(12), dp(12), dp(12));
                  android.graphics.drawable.GradientDrawable actionBg = new android.graphics.drawable.GradientDrawable();
                  actionBg.setColor(0xFF9CFF00);
                  actionBg.setCornerRadius(dp(12));
                  columnAction.setBackground(actionBg);
                  LinearLayout.LayoutParams actionLp = new LinearLayout.LayoutParams(-1, -2);
                  actionLp.setMargins(0, dp(18), 0, 0);
                  columnHero.addView(columnAction, actionLp);
                  columnHero.setOnClickListener(v -> new android.app.AlertDialog.Builder(this)
                      .setTitle("De Derde Helft")
                      .setMessage("Binnenkort: de wekelijkse Eredivisie-column van Sander Brink. De eerste editie verschijnt pas na persoonlijke goedkeuring.")
                      .setPositiveButton("Sluiten", (dialog, which) -> dialog.dismiss())
                      .show());
                  // The image cards already carry the Originals label; avoid duplicate headings.
                  TextView status = tv("Eigen voetbalartikelen laden…", 13, C.MUTED, false);
                  status.setPadding(0, dp(5), 0, 0);
                  section.addView(status);
                  if (EDITORIAL_API_URL.equals("NOT_CONFIGURED")) {
                      status.setText("Eigen artikelen volgen zodra de redactie-API is gekoppeld.");
                      return;
                  }
                  executor.execute(() -> {
                      HttpURLConnection conn = null;
                      try {
                          org.json.JSONObject data = null;
                          java.io.IOException lastNetworkError = null;
                          for (int attempt = 0; attempt < 2 && data == null; attempt++) {
                              try {
                                  if (conn != null) { conn.disconnect(); conn = null; }
                                  conn = (HttpURLConnection) new URL(EDITORIAL_API_URL).openConnection();
                                  // Render free services can take a minute to wake after inactivity.
                                  conn.setConnectTimeout(30000);
                                  conn.setReadTimeout(75000);
                                  conn.setRequestMethod("GET");
                                  conn.setRequestProperty("Accept", "application/json");
                                  conn.setRequestProperty("Cache-Control", "no-cache");
                                  try (InputStream in = conn.getInputStream();
                                       java.io.ByteArrayOutputStream out = new java.io.ByteArrayOutputStream()) {
                                      byte[] buf = new byte[4096]; int n;
                                      while ((n = in.read(buf)) != -1) {
                                          if (out.size() + n > 1048576) throw new java.io.IOException("News response too large");
                                          out.write(buf, 0, n);
                                      }
                                      String responseText = out.toString("UTF-8");
                                      data = new org.json.JSONObject(responseText);
                                      if (data.optJSONArray("articles") != null) {
                                          getSharedPreferences("voetbalhub_editorial", MODE_PRIVATE).edit().putString("last_articles", responseText).apply();
                                      }
                                  }
                              } catch (java.io.IOException networkError) {
                                  lastNetworkError = networkError;
                                  if (attempt == 0) runOnUiThread(() -> status.setText("Nieuwsserver wordt opnieuw benaderd…"));
                              }
                          }
                          if (data == null) {
                              String savedNews = getSharedPreferences("voetbalhub_editorial", MODE_PRIVATE).getString("last_articles", "");
                              if (!savedNews.isEmpty()) {
                                  data = new org.json.JSONObject(savedNews);
                                  runOnUiThread(() -> status.setText("Offline: laatst opgeslagen artikelen"));
                              } else {
                                  throw lastNetworkError != null ? lastNetworkError : new java.io.IOException("Geen serverreactie");
                              }
                          }
                          org.json.JSONArray articles = data.optJSONArray("articles");
                          final java.util.ArrayList<org.json.JSONObject> rows = new java.util.ArrayList<>();
                          final java.util.HashSet<String> seenHeadlines = new java.util.HashSet<>();
                          if (articles != null) for (int i = 0; i < articles.length() && rows.size() < 8; i++) {
                              org.json.JSONObject article = articles.optJSONObject(i);
                              if (article == null || !"published".equals(article.optString("status"))) continue;
                              String normalizedHeadline = java.text.Normalizer.normalize(article.optString("headline", "").trim().toLowerCase(java.util.Locale.ROOT), java.text.Normalizer.Form.NFKC).replace("  ", " ");
                              if (normalizedHeadline.isEmpty() || !seenHeadlines.add(normalizedHeadline)) continue;
                              boolean columnOnly = "Column".equals(currentBottomTab);
                              String itemType = article.optString("type", "");
                              String itemCategory = article.optString("category", "");
                              boolean columnArticle = "column".equalsIgnoreCase(itemType) || "column".equalsIgnoreCase(itemCategory) || "de derde helft".equalsIgnoreCase(itemCategory);
                              if (columnOnly && !columnArticle) continue;
                              rows.add(article);
                          }
                          runOnUiThread(() -> {
                              section.removeView(status);
                              if (rows.isEmpty()) {
                                  section.addView(tv("Column".equals(currentBottomTab) ? "De eerste column van Sander Brink verschijnt hier na zijn persoonlijke goedkeuring." : "Er zijn nog geen door de redactie goedgekeurde VoetbalHub-artikelen. Externe nieuwsfeeds zijn uitgeschakeld zolang hergebruikrechten niet zijn bevestigd.", 13, C.MUTED, false));
                                  return;
                              }
                              org.json.JSONObject latestColumn = null;
                              for (org.json.JSONObject item : rows) {
                                  String kind = item.optString("type", "");
                                  String cat = item.optString("category", "");
                                  if ("column".equalsIgnoreCase(kind) || "column".equalsIgnoreCase(cat) || "de derde helft".equalsIgnoreCase(cat)) {
                                      latestColumn = item;
                                      break;
                                  }
                              }
                              if (latestColumn != null) {
                                  final org.json.JSONObject featured = latestColumn;
                                  columnTitle.setText(featured.optString("headline", "De Derde Helft"));
