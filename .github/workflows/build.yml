
name: Build VoetbalHub APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Find and extract VoetbalHub ZIP
        shell: bash
        run: |
          set -euo pipefail

          ZIP=$(find . -maxdepth 1 -type f \
            -iname 'VoetbalHub*.zip' | head -n 1)

          if [ -z "$ZIP" ]; then
            echo "FOUT: Geen VoetbalHub ZIP gevonden."
            exit 1
          fi

          echo "Gevonden: $ZIP"

          rm -rf project extracted
          mkdir -p project extracted

          unzip -q "$ZIP" -d extracted

          # Zoek de map met het Android-project.
          SETTINGS=$(find extracted -type f \
            -name settings.gradle.kts | head -n 1 || true)

          if [ -z "$SETTINGS" ]; then
            SETTINGS=$(find extracted -type f \
              -name settings.gradle | head -n 1 || true)
          fi

          if [ -z "$SETTINGS" ]; then
            echo "FOUT: Geen settings.gradle(.kts) gevonden."
            echo "Controleer of de ZIP de Android-broncode bevat."
            find extracted -maxdepth 4 -type f | head -n 100
            exit 1
          fi

          ROOT=$(dirname "$SETTINGS")
          echo "Projectmap gevonden: $ROOT"

          cp -a "$ROOT"/. project/

          if [ ! -f project/build.gradle.kts ] && \
             [ ! -f project/build.gradle ]; then
            echo "FOUT: Gradle-buildbestand ontbreekt."
            exit 1
          fi

          if [ ! -d project/app ]; then
            echo "FOUT: De map app ontbreekt."
            find project -maxdepth 3 -type f | head -n 100
            exit 1
          fi

          echo "Android-project gevonden."

      - name: Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: project
        run: gradle :app:assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoetbalHub-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
