name: VoetbalHub API test and APK build

on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  api-test-and-build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - name: Extract Android project if repository stores a ZIP
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f settings.gradle.kts ] && [ ! -f settings.gradle ]; then
            ZIP="$(find . -maxdepth 2 -type f -iname 'VoetbalHub*.zip' | head -n 1 || true)"
            if [ -z "$ZIP" ]; then echo "::error::Geen Android-project of VoetbalHub ZIP gevonden."; exit 1; fi
            mkdir -p extracted
            unzip -q "$ZIP" -d extracted
            SETTINGS="$(find extracted -type f -name settings.gradle.kts | head -n 1 || true)"
            if [ -z "$SETTINGS" ]; then SETTINGS="$(find extracted -type f -name settings.gradle | head -n 1 || true)"; fi
            if [ -z "$SETTINGS" ]; then echo "::error::ZIP bevat geen settings.gradle(.kts)."; exit 1; fi
            ROOT="$(dirname "$SETTINGS")"
            cp -a "$ROOT"/. .
          fi
          test -f app/build.gradle.kts -o -f app/build.gradle
          echo "Android project structure found."
      - name: Inspect original fixture and navigation code
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          lines=Path("app/src/main/java/nl/voetbalhub/app/MainActivity.java").read_text().splitlines()
          for a,b in [(1450,1545),(1828,1868)]:
              print(f"\n===== SOURCE LINES {a}-{b} =====")
              print("\n".join(f"{i+1}: {lines[i]}" for i in range(a-1,min(b,len(lines)))))
          PY
      - name: Patch live feeds and back navigation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p = Path("app/src/main/java/nl/voetbalhub/app/MainActivity.java")
          s = p.read_text()
          # Correct navigation: on any non-home tab, back switches to home and never shows exit prompt.
          old = '''    public void onBackPressed() {
                  // Vanuit een artikel sluit TERUG de ingebouwde browser en keert direct terug naar VoetbalHub.
                  // Dit voorkomt dat de gebruiker eerst door eerdere VI-doorverwijzingen moet teruggaan.
                  if (articleOpen) {
                      closeArticleView();
                      return;
                  }

                  // Op het hoofdscherm moet TERUG twee keer binnen 2 seconden worden ingedrukt.'''
          new = '''    public void onBackPressed() {
                  // Artikelen eerst sluiten en terugkeren naar VoetbalHub.
                  if (articleOpen) {
                      closeArticleView();
                      return;
                  }
                  // Op een subpagina gaat TERUG altijd naar de hoofdpagina; geen afsluitmelding.
                  if (active != null && !active.equals("Voor jou")) {
                      showTab("Voor jou");
                      backPressedOnce = false;
                      main.removeCallbacks(resetBackPressed);
                      return;
                  }

                  // Alleen op de hoofdpagina is tweemaal TERUG nodig om af te sluiten.'''
          if old not in s:
              # Avoid brittle comments/indentation; locate method and replace its prefix only.
              method_start = s.index("    public void onBackPressed() {")
              marker = "        if (backPressedOnce) {"
              marker_pos = s.index(marker, method_start)
              prefix = s[method_start:marker_pos]
              new_prefix = '''    public void onBackPressed() {
                  // Artikelen eerst sluiten en terugkeren naar VoetbalHub.
                  if (articleOpen) {
                      closeArticleView();
                      return;
                  }
                  // Op een subpagina gaat TERUG altijd naar de hoofdpagina.
                  if (active != null && !active.equals("Voor jou")) {
                      showTab("Voor jou");
                      backPressedOnce = false;
                      main.removeCallbacks(resetBackPressed);
                      return;
                  }

'''
              s = s[:method_start] + new_prefix + s[marker_pos:]
          else:
              s = s.replace(old,new,1)
          p.write_text(s)
          print("Back navigation patch applied.")
          PY
      - name: Gradle setup
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        env:
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
        run: gradle :app:assembleDebug --no-daemon
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VoetbalHub-live-fix
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
