                                          p.setStyle(android.graphics.Paint.Style.STROKE);
                                          p.setStrokeWidth(dp(2));
                                          p.setColor(0x5555FF9D);
                                          float left = w * 0.42f, top = h * 0.06f, right = w * 1.13f, bottom = h * 0.91f;
                                          canvas.drawRect(left, top, right, bottom, p);
                                          canvas.drawLine((left + right) / 2f, top, (left + right) / 2f, bottom, p);
                                          canvas.drawCircle((left + right) / 2f, (top + bottom) / 2f, dp(52), p);
                                          canvas.drawRect(right - w * 0.22f, top + h * 0.22f, right, bottom - h * 0.22f, p);
                                          p.setStyle(android.graphics.Paint.Style.FILL);
                                      }
                                  };
                                  hero.addView(pitch, new android.widget.FrameLayout.LayoutParams(-1, -1));
                                  android.widget.TextView watermark = tv("VH", 80, C.TEXT, true);
                                  watermark.setGravity(android.view.Gravity.CENTER);
                                  watermark.setAlpha(0.07f);
                                  android.widget.FrameLayout.LayoutParams wmLp = new android.widget.FrameLayout.LayoutParams(dp(155), dp(150), android.view.Gravity.TOP | android.view.Gravity.RIGHT);
                                  hero.addView(watermark, wmLp);
                                  // Only display artwork explicitly approved and rights-cleared by the editorial API.
                                  String editorialImage = article.optString("imageUrl", "");
