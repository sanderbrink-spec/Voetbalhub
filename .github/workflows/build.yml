name: Veldio premium source APK build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['android-project/**', 'scripts/android-*.py', 'scripts/verify-android-source.py', 'scripts/browser/subpages46.cjs', 'scripts/browser/phase49.cjs', 'test/subpages46.test.js', '.github/workflows/build.yml']
  push:
    branches: [main, 'fix/veldio-44b-premium-recovery', 'work/veldio-45', 'work/veldio-46', 'fix/veldio-47-functional', 'work/veldio-48', 'work/veldio-49']
    paths: ['android-project/**', 'scripts/android-*.py', 'scripts/verify-android-source.py', 'scripts/browser/subpages46.cjs', 'scripts/browser/phase49.cjs', 'test/subpages46.test.js', '.github/workflows/build.yml']
permissions:
  contents: read
  actions: read
jobs:
  validate49:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-timeout 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node scripts/browser/phase49.cjs
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-49-integration
          path: .browser-output/phase49.json
          include-hidden-files: true
  build:
    needs: validate49
    if: (github.event_name != 'pull_request' || !startsWith(github.head_ref, 'work/veldio-')) && !(github.ref == 'refs/heads/main' && contains(github.event.head_commit.message, '[reuse-tested-apk]'))
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved versioned source
        run: python3 scripts/verify-android-source.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require matching healthy Render revision before main APK build
        if: github.ref == 'refs/heads/main'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/render-sync-guard.js verify
      - name: Validate models; mobile browser checks already passed on this source
        run: node --test test/subpages46.test.js test/football47.test.js
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Require the original phase48 signing key before compiling
        env:
          VELDIO_PHASE48_KEYSTORE_BASE64: ${{ secrets.VELDIO_PHASE48_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "$VELDIO_PHASE48_KEYSTORE_BASE64" ]; then
            echo "Original phase48 signing key missing. No replacement key or update APK will be generated."
            exit 1
          fi
          mkdir -p "$HOME/.android"
          printf '%s' "$VELDIO_PHASE48_KEYSTORE_BASE64" | base64 --decode > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"
          signer=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1)
          test "$signer" = "c5defd54898546731e0fc0ea5cac921e78ceb4cde2688df7d7aa99abd0df64d6"
      - name: Build directly from versioned source
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Download installed phase48 signing reference
        uses: actions/download-artifact@v4
        with:
          name: Veldio-48
          path: signing-reference48
          run-id: 42001506136
          github-token: ${{ github.token }}
      - name: Verify signature, manifest and approved APK assets
        run: |
          set -euo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk Veldio-49.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Veldio-49.apk > signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Veldio-49.apk > manifest.txt
          grep -q "package: name='nl.voetbalhub.app1'.*versionCode='89'.*versionName='4.49-test'" manifest.txt
          grep -q "application-label:'Veldio'" manifest.txt
          python3 scripts/apk-secret-scan.py Veldio-49.apk
          python3 scripts/verify-android-source.py Veldio-49.apk
          sha256sum Veldio-49.apk > sha256.txt
          python3 scripts/verify-apk-update-signature.py signing-reference48/signature.txt signature.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Veldio-49
          path: |
            Veldio-49.apk
            Veldio-build-provenance.json
            signature.txt
            manifest.txt
            sha256.txt
          if-no-files-found: error
  android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-49
          path: apk
      - name: Install device test driver
        run: python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test premium pages, navigation and player on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-phase49.py apk/Veldio-49.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-49-Android16
          path: .android-smoke/
          include-hidden-files: true
          if-no-files-found: error
