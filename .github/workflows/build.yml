name: Veldio premium source APK build
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
    paths: ['android-project/**', 'scripts/android-*.py', 'scripts/verify-android-source.py', 'scripts/browser/subpages46.cjs', 'test/subpages46.test.js', '.github/workflows/build.yml']
  push:
    branches: [main, 'fix/veldio-44b-premium-recovery', 'work/veldio-45', 'work/veldio-46']
    paths: ['android-project/**', 'scripts/android-*.py', 'scripts/verify-android-source.py', 'scripts/browser/subpages46.cjs', 'test/subpages46.test.js', '.github/workflows/build.yml']
permissions:
  contents: read
jobs:
  build:
    if: github.event_name != 'pull_request' || github.head_ref != 'work/veldio-46'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Verify approved versioned source
        run: python3 scripts/verify-android-source.py
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Validate subpage models and mobile routes
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install --with-deps chromium
          node --test test/subpages46.test.js
          node scripts/browser/subpages46.cjs
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Build directly from versioned source
        working-directory: android-project
        run: gradle :app:assembleDebug --no-daemon
      - name: Verify signature, manifest and approved APK assets
        run: |
          set -euo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk Veldio-46.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Veldio-46.apk > signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Veldio-46.apk > manifest.txt
          grep -q "package: name='nl.voetbalhub.app1'.*versionCode='86'.*versionName='4.46-test'" manifest.txt
          grep -q "application-label:'Veldio'" manifest.txt
          python3 scripts/apk-secret-scan.py Veldio-46.apk
          python3 scripts/verify-android-source.py Veldio-46.apk
          sha256sum Veldio-46.apk > sha256.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Veldio-46
          path: |
            Veldio-46.apk
            Veldio-build-provenance.json
            signature.txt
            manifest.txt
            sha256.txt
          if-no-files-found: error
  android16:
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-46
          path: apk
      - name: Install device test driver
        run: python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test premium pages, navigation and player on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-phase43.py apk/Veldio-46.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-46-Android16
          path: .android-smoke/
          include-hidden-files: true
          if-no-files-found: error
