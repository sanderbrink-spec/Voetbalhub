                                      hero.addView(photo, new android.widget.FrameLayout.LayoutParams(-1, -1));
                                      executor.execute(() -> {
                                          HttpURLConnection imageConnection = null;
                                          try {
                                              imageConnection = (HttpURLConnection) new URL(editorialImage).openConnection();
                                              imageConnection.setConnectTimeout(12000);
                                              imageConnection.setReadTimeout(12000);
                                              imageConnection.setInstanceFollowRedirects(false);
                                              String type = imageConnection.getContentType();
                                              int size = imageConnection.getContentLength();
                                              if (imageConnection.getResponseCode() != 200 ||
                                                  type == null || !type.toLowerCase(java.util.Locale.ROOT).startsWith("image/") ||
                                                  size > 5000000) return;
                                              android.graphics.Bitmap bitmap;
                                              try (InputStream stream = imageConnection.getInputStream()) {
                                                  bitmap = android.graphics.BitmapFactory.decodeStream(stream);
