name: Veldio 50 validation and Android preview
on:
  push:
    branches: ['work/veldio-50']
  workflow_dispatch:
concurrency:
  group: veldio50-current-source
  cancel-in-progress: true
permissions:
  contents: read
  actions: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    services:
      redis:
        image: redis:7-alpine
        ports: ['6379:6379']
        options: --health-cmd "redis-cli ping" --health-interval 2s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: npm ci --ignore-scripts
      - run: npm test
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - run: node scripts/browser/phase49.cjs
        env:
          REDIS_TEST_URL: redis://127.0.0.1:6379
          CHROMIUM_PATH: /usr/bin/google-chrome
      - run: node scripts/browser/phase50.cjs
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-50-browser-and-tests
          path: .browser-output/
          include-hidden-files: true
  apk:
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/verify-android-source.py
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'
      - name: Select safe signing mode
        id: signing
        env:
          ORIGINAL_KEY: ${{ secrets.VELDIO_PHASE48_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -n "$ORIGINAL_KEY" ]; then
            mkdir -p "$HOME/.android"
            printf '%s' "$ORIGINAL_KEY" | base64 --decode > "$HOME/.android/debug.keystore"
            chmod 600 "$HOME/.android/debug.keystore"
            signer=$(keytool -exportcert -keystore "$HOME/.android/debug.keystore" -alias androiddebugkey -storepass android | sha256sum | cut -d' ' -f1)
            test "$signer" = "c5defd54898546731e0fc0ea5cac921e78ceb4cde2688df7d7aa99abd0df64d6"
            echo 'preview=false' >> "$GITHUB_OUTPUT"
          else
            echo 'preview=true' >> "$GITHUB_OUTPUT"
            echo 'Separate preview package: existing Veldio installation and local data remain intact.'
          fi
      - name: Build current versioned source once
        working-directory: android-project
        run: gradle :app:assembleDebug -PveldioPreview50=${{ steps.signing.outputs.preview }} --no-daemon
      - name: Verify APK and source commit
        env:
          PREVIEW: ${{ steps.signing.outputs.preview }}
        run: |
          set -euo pipefail
          cp android-project/app/build/outputs/apk/debug/app-debug.apk Veldio-50.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs Veldio-50.apk > signature.txt
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging Veldio-50.apk > manifest.txt
          grep -q "versionCode='90'.*versionName='4.50-test'" manifest.txt
          if [ "$PREVIEW" = true ]; then grep -q "package: name='nl.voetbalhub.preview50'" manifest.txt; else grep -q "package: name='nl.voetbalhub.app1'" manifest.txt; fi
          python3 scripts/apk-secret-scan.py Veldio-50.apk
          python3 scripts/verify-android-source.py Veldio-50.apk
          sha256sum Veldio-50.apk > sha256.txt
          printf 'preview=%s\nsource=%s\n' "$PREVIEW" "$GITHUB_SHA" > installation.txt
      - uses: actions/upload-artifact@v4
        with:
          name: Veldio-50
          path: |
            Veldio-50.apk
            Veldio-build-provenance.json
            signature.txt
            manifest.txt
            sha256.txt
            installation.txt
          if-no-files-found: error
  android16:
    needs: apk
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-50
          path: apk
      - run: python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-phase50.py apk/Veldio-50.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-50-Android16
          path: .android-smoke/
          include-hidden-files: true
