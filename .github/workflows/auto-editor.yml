name: VoetbalHub automatische redactie

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */2 * * *"

permissions:
  contents: read

jobs:
  create-editorial-draft:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install dependencies
        run: npm install
      - name: Generate one source-based draft
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          HUB_API_SECRET: ${{ secrets.HUB_API_SECRET }}
          GROQ_MODEL: openai/gpt-oss-120b
        run: node scripts/auto-editor.js
