name: Automatic verified news and images
on:
  push:
    branches: [main]
    paths:
      - 'automatic-editorial.json'
      - 'editorial-production45.js'
      - 'editorial-match55.js'
      - 'editorial-match-evidence122.js'
      - 'editorial-match-guidance133.js'
      - 'automatic-bootstrap.json'
      - 'scripts/automatic-publication.js'
      - 'editorial-ai.js'
      - 'editorial-provider-router.js'
      - 'editorial-overlap-repair.js'
      - 'scripts/render-editorial-cover.py'
      - 'scripts/refresh-automatic-covers.js'
      - 'editorial-image44.js'
      - 'editorial-image44-service.js'
      - '.github/workflows/automatic-publication.yml'
  schedule:
    - cron: '23 * * * *'
  workflow_dispatch:
    inputs:
      source_url:
        description: Optional discovered official article URL to process alone
        required: false
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: automatic-verified-editorial-publication
  cancel-in-progress: false
jobs:
  publish:
    # Start a push run only when the commit explicitly requests a verified editorial run.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-verified-news]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate publication gates
        run: npm test
      - name: Verify the matching Render revision
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 https://voetbalhub-redactie.onrender.com/ready |
              jq -e --arg sha "$GITHUB_SHA" '.ready and .revision == $sha' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Render draait nog niet op de workflowcommit."
          exit 1
      - name: Collect official sources and publish checked stories with artwork
        env:
          FOCUS_SOURCE_URL: ${{ inputs.source_url }}
          HUB_API_SECRET: ${{ secrets.HUB_API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/automatic-publication.js
      - name: Keep editorial run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-editorial-report
          path: .automatic-output/
          include-hidden-files: true
          if-no-files-found: error

      - name: Signal technical failures and unexplained zero publication
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = '.automatic-output/report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path,'utf8')) : null;
            const title = '[Veldio] Publicatieketen: technische blokkade';
            const {owner,repo} = context.repo;
            const {data:issues} = await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing = issues.find(issue => issue.title === title);
            const unexplained = report && report.counts.selected > 0 && report.counts.published === 0 && !report.skipped.length && !report.processingErrors.length;
            const failed = !report || report.outcome === 'error' || unexplained;
            if (failed) {
              const body = ['Technische controle vereist. Kwaliteitsgrens blijft minimaal 85.',
                'Run: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'Status: '+(report?.status || 'geen productierapport'),
                'Tellingen: '+JSON.stringify(report?.counts || {}),
                'Wachtrij: '+JSON.stringify(report?.queue || {}),
                'Details staan in het redactierapport van deze run.'].join('\n');
              if (existing) await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
              else await github.rest.issues.create({owner,repo,title,body});
              core.setFailed('Technische publicatieblokkade; zie redactierapport.');
            } else if (existing) {
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }

            // A explained editorial rejection is not a technical failure, but persistent
            // zero output must remain visible even when Actions is green.
            const qualityTitle = '[Veldio] Redactie: geen publiceerbare artikelen';
            const qualityAlert = issues.find(issue => issue.title === qualityTitle);
            const awaitingReview = report?.signals?.some(signal => signal.outcome === 'queue_review');
            const editorialBlock = report && !failed && report.counts.published === 0 && (report.counts.generated > 0 || awaitingReview);
            if (editorialBlock) {
              const body = ['Geen artikel gepubliceerd ondanks generatie of een beoordelingswachtrij.',
                'Dit is een redactionele waarschuwing. Verlaag geen kwaliteitsnormen.',
                'Run: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'Tellingen: '+JSON.stringify(report.counts),
                ...report.skipped.map(item => '- '+item.topic+': '+item.reason),
                'Wachtrijredenen en beoordelingen staan in het runrapport.'].join('\n');
              if (qualityAlert) await github.rest.issues.update({owner,repo,issue_number:qualityAlert.number,body});
              else await github.rest.issues.create({owner,repo,title:qualityTitle,body});
              core.warning('Geen publiceerbaar artikel; redactionele blokkade zichtbaar gemaakt.');
            } else if (qualityAlert && report?.counts.published > 0) {
              await github.rest.issues.update({owner,repo,issue_number:qualityAlert.number,state:'closed'});
            }
