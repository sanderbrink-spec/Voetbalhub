name: Automatic verified news and images
on:
  push:
    branches: [main]
    paths:
      - 'automatic-editorial.json'
      - 'test/editorial-sportmonks-ten-articles.test.js'
      - 'editorial-production45.js'
      - 'editorial-match55.js'
      - 'editorial-match-narrative71.js'
      - 'editorial-match-gap111.js'
      - 'editorial-match-copyedit112f.js'
      - 'test/editorial-match-copyedit112f.test.js'
      - 'test/editorial-112g-real-validation.test.js'
      - 'editorial-match-evidence122.js'
      - 'editorial-match-guidance133.js'
      - 'editorial-recovery136.js'
      - 'editorial-facts.js'
      - 'editorial-desk-model.js'
      - 'automatic-bootstrap.json'
      - 'scripts/automatic-publication.js'
      - 'scripts/editorial-oranje-draw.js'
      - 'scripts/editorial-draw-copy339.js'
      - 'scripts/editorial-international.js'
      - 'scripts/editorial-official-finals98w.js'
      - 'test/editorial-official-finals98w.test.js'
      - 'test/automatic-publication.test.js'
      - 'editorial-ai.js'
      - 'editorial-provider-router.js'
      - 'test/editorial-provider-router.test.js'
      - 'editorial-overlap-repair.js'
      - 'scripts/render-editorial-cover.py'
      - 'scripts/refresh-automatic-covers.js'
      - 'editorial-image44.js'
      - 'editorial-image44-service.js'
      - 'image-library49.js'
      - 'image-library49.json'
      - 'image-rotation65.js'
      - 'public/article-art71/**'
      - '.github/workflows/automatic-publication.yml'
  schedule:
    # Stagger away from the top of the hour. Runtime evidence and quota gates
    # remain mandatory; Actions cron is best-effort, not a delivery guarantee.
    - cron: '8,23,38,53 * * * *'
  workflow_dispatch:
    inputs:
      validation_only:
        description: Generate and review three articles without publishing
        default: false
        type: boolean
      sportmonks_only:
        description: Optional restricted Sportmonks match-report probe (normal runs cover all news)
        default: false
        type: boolean
      source_url:
        description: Optional discovered official article URL to process alone
        required: false
        type: string
permissions:
  contents: write
  issues: write
concurrency:
  group: automatic-verified-editorial-publication
  # Laat een actieve bron- en publicatieronde aflopen. Een nieuwe scheduled
  # check mag geen reeds verwerkte feiten en eindredactie weggooien.
  # Oudere commits kunnen niets publiceren: de /ready-revisiecheck bewaakt dit.
  cancel-in-progress: false
# Nieuwe productieronde: gebruik de bestaande gecontroleerde workflow.
# Journalistieke voorbeelden sturen nieuwsselectie; publicatie blijft afhankelijk van
# geverifieerde feiten, onafhankelijke review, rechten en feedcontrole.
jobs:
  publish:
    # Start a push run only when the commit explicitly requests a verified editorial run.
    if: github.event_name != 'push' || contains(github.event.head_commit.message, '[publish-verified-news]') || contains(github.event.head_commit.message, '[verify-editorial-sources]') || contains(github.event.head_commit.message, '[validate-editorial-generation]')
    runs-on: ubuntu-24.04
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install Pillow
      - run: npm install --ignore-scripts --no-audit --no-fund
      - name: Validate publication gates for a new revision or manual proof
        if: github.event_name != 'schedule'
        run: npm test
      - name: Scheduled publication safety checks
        if: github.event_name == 'schedule'
        run: |
          node --check server.js
          node --check editorial-quality.js
          node --check scripts/automatic-publication.js
          node --test test/editorial-registration118.test.js test/editorial-evidence121.test.js test/editorial-provider-router.test.js
      - name: Verify the matching Render revision
        run: |
          for attempt in $(seq 1 60); do
            if curl -fsS --max-time 10 https://voetbalhub-redactie.onrender.com/ready |
              jq -e --arg sha "$GITHUB_SHA" '.ready and .revision == $sha' >/dev/null; then
              exit 0
            fi
            sleep 10
          done
          echo "::error::Render draait nog niet op de workflowcommit."
          exit 1
      - name: Remove any test-only report before a real production attempt
        run: rm -rf .automatic-output
      - name: Collect official sources and publish checked stories with artwork
        env:
          EDITORIAL_DISCOVERY_ONLY: ${{ github.event_name == 'push' && contains(github.event.head_commit.message, '[verify-editorial-sources]') }}
          EDITORIAL_SPORTMONKS_ONLY: ${{ (github.event_name == 'push' && contains(github.event.head_commit.message, '[sportmonks-ten]')) || (github.event_name == 'workflow_dispatch' && inputs.sportmonks_only) }}
          EDITORIAL_VALIDATION_ONLY: ${{ inputs.validation_only || (github.event_name == 'push' && contains(github.event.head_commit.message, '[validate-editorial-generation]')) }}
          FOCUS_SOURCE_URL: ${{ inputs.source_url }}
          HUB_API_SECRET: ${{ secrets.HUB_API_SECRET }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GEMINI_FREE_TIER_CONFIRMED: ${{ vars.GEMINI_FREE_TIER_CONFIRMED }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          GITHUB_TOKEN: ${{ github.token }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: node scripts/automatic-publication.js
      - name: Diagnose publication desk bottlenecks (111B, read-only)
        if: ${{ always() && hashFiles('scripts/editorial-desk-diagnostic111.js') != '' }}
        run: node scripts/editorial-desk-diagnostic111.js .automatic-output/report.json .automatic-output/desk-diagnostic111.json

      - name: Audit trained scout handoffs and independent editorial scores (112D, read-only)
        if: ${{ always() && ((github.event_name == 'push' && contains(github.event.head_commit.message, '[validate-editorial-generation]')) || (github.event_name == 'workflow_dispatch' && inputs.validation_only)) }}
        run: node scripts/editorial-desk-evaluation112d.js .automatic-output/report.json .automatic-output/desk-evaluation112d.json

      - name: Keep editorial run report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: automatic-editorial-report
          path: .automatic-output/
          include-hidden-files: true
          if-no-files-found: error

      - name: Signal technical failures and unexplained zero publication
        if: ${{ always() && !inputs.validation_only && !(github.event_name == 'push' && contains(github.event.head_commit.message, '[validate-editorial-generation]')) }}
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('node:fs');
            const path = '.automatic-output/report.json';
            const report = fs.existsSync(path) ? JSON.parse(fs.readFileSync(path,'utf8')) : null;
            const title = '[Veldio] Publicatieketen: technische blokkade';
            const {owner,repo} = context.repo;
            const {data:issues} = await github.rest.issues.listForRepo({owner,repo,state:'open',per_page:100});
            const existing = issues.find(issue => issue.title === title);
            const unexplained = report && report.counts.selected > 0 && report.counts.published === 0 && !report.skipped.length && !report.processingErrors.length;
            const failed = !report || report.outcome === 'error' || unexplained;
            if (report?.outcome === 'partial_success' && report.counts.published > 0) {
              core.warning('Artikel gepubliceerd en in publieke feed geverifieerd; resterende taak blijft in de wachtrij wegens beperkte AI-capaciteit.');
            }
            if (failed) {
              const body = ['Technische controle vereist. Kwaliteitsgrens blijft minimaal 85.',
                'Run: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'Status: '+(report?.status || 'geen productierapport'),
                'Tellingen: '+JSON.stringify(report?.counts || {}),
                'Wachtrij: '+JSON.stringify(report?.queue || {}),
                'Details staan in het redactierapport van deze run.'].join('\n');
              if (existing) await github.rest.issues.update({owner,repo,issue_number:existing.number,body});
              else await github.rest.issues.create({owner,repo,title,body});
              core.setFailed('Technische publicatieblokkade; zie redactierapport.');
            } else if (existing) {
              await github.rest.issues.update({owner,repo,issue_number:existing.number,state:'closed'});
            }

            // A explained editorial rejection is not a technical failure, but persistent
            // zero output must remain visible even when Actions is green.
            const qualityTitle = '[Veldio] Redactie: geen publiceerbare artikelen';
            const qualityAlert = issues.find(issue => issue.title === qualityTitle);
            const awaitingReview = report?.signals?.some(signal => signal.outcome === 'queue_review');
            const editorialBlock = report && !failed && report.counts.published === 0 && (report.counts.generated > 0 || report.counts.attempted > 0 || awaitingReview || report.queue?.awaitingApprovedArtwork > 0);
            if (editorialBlock) {
              const body = ['Geen artikel gepubliceerd na controle van kandidaatonderwerpen of bij een redactionele beoordelingswachtrij.',
                'Dit is een redactionele waarschuwing. Verlaag geen kwaliteitsnormen.',
                'Wachten op rechtengecontroleerd beeld: '+(report.queue?.awaitingApprovedArtwork || 0),
                'Oudere technische reviews (niet noodzakelijk fouten van deze run): '+(report.queue?.technicalReview || 0),
                'Run: '+context.serverUrl+'/'+owner+'/'+repo+'/actions/runs/'+context.runId,
                'Tellingen: '+JSON.stringify(report.counts),
                ...report.skipped.map(item => '- '+item.topic+': '+item.reason),
                'Wachtrijredenen en beoordelingen staan in het runrapport.'].join('\n');
              if (qualityAlert) await github.rest.issues.update({owner,repo,issue_number:qualityAlert.number,body});
              else await github.rest.issues.create({owner,repo,title:qualityTitle,body});
              core.warning('Geen publiceerbaar artikel; redactionele blokkade zichtbaar gemaakt.');
            } else if (qualityAlert && report?.counts.published > 0) {
              await github.rest.issues.update({owner,repo,issue_number:qualityAlert.number,state:'closed'});
            }
