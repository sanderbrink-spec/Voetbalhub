name: Veldio Android16 verified artifact regression
on:
  push:
    branches: [main, "work/veldio-48"]
    paths: ['.github/workflows/android47-regression.yml', 'scripts/android-phase47.py']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  browser:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false playwright@1.56.1
      - name: Exercise shipped assets at mobile sizes
        env:
          CHROMIUM_PATH: /usr/bin/google-chrome
        run: |
          node scripts/browser/functional47.cjs
          node scripts/browser/subpages46.cjs
          node scripts/browser/subpage-surfaces46.cjs
          node scripts/browser/personal-hub.cjs
          node scripts/browser/veldio-home.cjs
          node scripts/browser/contact.cjs
          node scripts/browser/editorial-desk.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-48-mobile-browser
          path: .browser-output/
          include-hidden-files: true
          if-no-files-found: error
  android16:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Veldio-47
          path: apk
          run-id: 41912848471
          github-token: ${{ github.token }}
      - name: Verify identical packaged source
        run: python3 scripts/verify-android-source.py apk/Veldio-47.apk
      - name: Install Android test driver
        run: python3 -m pip install 'uiautomator2>=3,<4' 'websocket-client>=1,<2'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Test existing APK on Android 16
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: adb shell wm size 1080x2340 && adb shell wm density 440 && python3 scripts/android-phase47.py apk/Veldio-47.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Veldio-48-regression-Android16
          path: .android-smoke/
          include-hidden-files: true
          if-no-files-found: error
