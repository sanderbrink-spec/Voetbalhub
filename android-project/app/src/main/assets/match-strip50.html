<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><style>body{margin:0;background:#030605;color:#f4f6f3;font:13px system-ui}*{box-sizing:border-box}h2{display:flex;justify-content:space-between;align-items:center;margin:8px 4px;font-size:20px}button{min-height:44px;color:#a9ff35;border:0;background:transparent;font:inherit;cursor:pointer}button:focus-visible{outline:2px solid #a9ff35}.rows{display:flex;overflow-x:auto;gap:9px;padding:0 3px 8px}.match{min-width:265px;display:grid;grid-template-columns:35px 1fr 60px 1fr 35px;gap:5px;align-items:center;border:1px solid #34463a;border-radius:13px;background:linear-gradient(#19221b,#080e0a);padding:8px;color:white;font-size:11px;text-align:center}.club-shirt{width:34px;height:46px}small{display:block;color:#afc2b4;font-size:10px}.empty{color:#b7c7bc;padding:10px 4px}</style><h2>Vandaag <button onclick="MatchStrip50.open()">Alle wedstrijden →</button></h2><div id="rows" class="rows"></div><script src="club-directory.js"></script><script src="football47.js"></script><script>
const esc=x=>String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function setMatches50(rows){document.getElementById('rows').innerHTML=rows.length?rows.map(f=>'<button class="match" onclick="MatchStrip50.open()">'+Football47.shirt(f.home)+'<b>'+esc(f.home.name)+'</b><span>'+esc(f.status==='FT'?f.goals.home+' – '+f.goals.away:new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',weekday:'short',hour:'2-digit',minute:'2-digit'}).format(new Date(f.date)))+'<small>'+esc(f.competition==='eredivisie'?'Eredivisie':'Europa')+'</small></span><b>'+esc(f.away.name)+'</b>'+Football47.shirt(f.away)+'</button>').join(''):'<div class="empty">Geen gecontroleerde duels voor vandaag.</div>';}
setMatches50([]);
</script></html>
