function eventRow88(f,e,group){
 const side=e.side==='home'?f.home.name:e.side==='away'?f.away.name:'Club onbekend';
 const minute=Number.isInteger(e.minute)&&e.minute>0&&e.minute<=130?
  e.minute+(Number.isInteger(e.extra)&&e.extra>0?'+'+e.extra:'')+'′':'–';
 const label=eventLabels88[e.kind];
 const marker=group==='cards'?'<span class="event-card88" aria-hidden="true"></span>':'';
 const player='<strong>'+esc(e.player||'Speler onbekend')+'</strong>';
 const names=group==='substitution'?
  '<div class="event-player88"><span class="event-in88">IN</span>'+player+'</div>'+
  '<div class="event-player88"><span class="event-out88">UIT</span><strong>'+esc(e.relatedPlayer||'Speler onbekend')+'</strong></div>':
  '<div class="event-player88">'+marker+player+'</div>';
 const score=group==='goal'&&e.score?'<span class="event-score88" aria-label="Tussenstand '+esc(e.score)+'">'+esc(e.score)+'</span>':'';
 const meta=[side,label].filter(Boolean).join(' · ');
 return '<li class="event-line88" data-event-kind="'+esc(e.kind)+'"><span class="event-minute88">'+esc(minute)+'</span>'+
  '<div class="event-description88">'+names+'<small>'+esc(meta)+score+'</small></div></li>';
}

function matchEventDetails88(f){
 if(!['FT','AET','PEN'].includes(f.status))return '<p class="events-note88">Gebeurtenissen worden na een gecontroleerde wedstrijd beschikbaar.</p>'+

function fixtures50(){

 };

 h+='<div class="round50"><button data-round50="'+esc(rounds[index-1]||'')+'" '+(index<=0?'disabled':'')+' aria-label="Vorige speelronde">‹</button><select id="round50" aria-label="Speelronde">'+(rounds.length?rounds.map(r=>'<option value="'+esc(r)+'" '+(r===round50?'selected':'')+'>'+esc(Football47.roundLabel(r))+'</option>').join(''):'<option>Geen speelronde</option>')+'</select><button data-round50="'+esc(rounds[index+1]||'')+'" '+(index<0||index>=rounds.length-1?'disabled':'')+' aria-label="Volgende speelronde">›</button></div>';

 h+='<details class="fixtures-tools86"><summary>Meer filters</summary><label class="toggle">Alleen mijn clubs<input id="favoriteOnly" type="checkbox" '+(favoriteOnly?'checked':'')+'></label></details>';
 const visible=rows.filter(f=>f.round===round50);
 h+='<p class="fixture-counter87" role="status">'+visible.length+' '+(visible.length===1?'wedstrijd':'wedstrijden')+' in deze selectie</p>';h+=visible.length?'<div class="match-list50" role="list">'+visible.map(match).join('')+'</div>':unavailable(state.loading?'Wedstrijden laden':filter==='live'?'Geen livewedstrijden':filter==='upcoming'?'Geen geplande wedstrijden':'Geen gecontroleerde wedstrijden',state.stats.message||'Voor deze selectie zijn momenteel geen gecontroleerde duels beschikbaar.');
 if(state.competition==='eredivisie'&&filter==='all'){
  const europe=state.stats.europeanFixtures||[],next=europe.filter(f=>Date.parse(f.date)>Date.now()-86400000&&Date.parse(f.date)<Date.now()+7*86400000);
  if(next.length)h+='<h2 class="section50">Grote wedstrijden Europa</h2><div class="match-list50" role="list">'+next.map(match).join('')+'</div>';
 }
 return h+'<details class="source-details86"><summary>Databron en controle</summary>'+source47()+'</details><button class="secondary" id="refresh">Vernieuwen</button>';
}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.comp50){filter='all';round50='';bridge('competition',b.dataset.comp50);}if(b.dataset.filter86){filter=b.dataset.filter86;round50='';render();}if(b.dataset.round50){round50=b.dataset.round50;render();}});document.addEventListener('change',e=>{if(e.target.id==='round50'){round50=e.target.value;render();}});
function loadPrediction47(){const el=document.querySelector('#fixture');if(!el)return;const p=(state.predictions||[]).find(x=>String(x.fixtureId)===el.value);document.querySelector('#homeGoals').value=p?.home??'';document.querySelector('#awayGoals').value=p?.away??'';}
function visible47(){return fixtures().filter(f=>filter==='all'||(filter==='live'?['LIVE','1H','HT','2H','ET','BT','P','INT'].includes(f.status):filter==='upcoming'?['NS','TBD'].includes(f.status):['FT','AET','PEN'].includes(f.status))).filter(f=>!favoriteOnly||(state.clubs||[]).some(c=>Subpage46.same(c,f.home.name)||Subpage46.same(c,f.away.name))).sort((a,b)=>{const an=Date.parse(a.date),bn=Date.parse(b.date);return filter==='results'?bn-an:an-bn;}).slice(0,100);}
function filters47(){const list=window.VELDIO_COMPETITIONS47||{};return '<label for="competitionFilter">Competitie</label><select id="competitionFilter">'+Object.entries(list).map(([key,c])=>'<option value="'+key+'" '+(state.competition===key?'selected':'')+'>'+esc(c.name)+'</option>').join('')+'</select><label for="fixtureFilter">Wedstrijden tonen</label><select id="fixtureFilter"><option value="all" '+(filter==='all'?'selected':'')+'>Alle beschikbare duels</option><option value="upcoming" '+(filter==='upcoming'?'selected':'')+'>Komende duels</option><option value="results" '+(filter==='results'?'selected':'')+'>Uitslagen</option></select><label class="toggle">Alleen mijn clubs<input id="favoriteOnly" type="checkbox" '+(favoriteOnly?'checked':'')+'></label>';}
function source47(){return state.stats.updatedAt&&state.stats.sourceDetails?'<p class="quiet">'+esc(state.stats.source)+' · Gecontroleerd '+esc(date(state.stats.updatedAt))+' · '+esc(state.stats.sourceDetails?.license||'')+' · Periodieke update</p><p class="quiet">'+esc(state.stats.standingsNote||'')+'</p><button class="secondary" data-source47="'+esc(state.stats.sourceDetails.url)+'">Databron ↗</button>'+ (state.stats.sourceDetails.license==='ODbL-1.0'?'<button class="secondary" data-source47="https://opendatacommons.org/licenses/odbl/1-0/">Datalicentie ODbL 1.0 ↗</button>':''):'';}
function competitionContent47(){const c=window.VELDIO_COMPETITIONS47?.[state.competition];if(!c)return unavailable('Competitie onbekend','Deze competitie is niet ondersteund.');let h='<div class="hero"><span class="eyebrow">COMPETITIEGIDS</span><h1>'+esc(c.name)+'</h1><p>'+esc(c.region)+'</p></div><section class="panel"><h2>Over de competitie</h2>'+c.body.map(x=>'<p>'+esc(x)+'</p>').join('')+'<button class="secondary" data-source47="'+esc(c.url)+'">Officiële competitiebron ↗</button><p class="quiet">Achtergrond gecontroleerd: 4 november 2026. Deelnemers worden uitsluitend uit de beschikbare seizoenfeed afgeleid.</p></section>';
const rows=state.stats.standings||[];if(rows.length){h+='<section class="panel" style="overflow-x:auto"><h2>Stand op basis van beschikbare uitslagen</h2><table><thead><tr><th>#</th><th>Club</th><th>G</th><th>W</th><th>GL</th><th>V</th><th>DV</th><th>DT</th><th>DS</th><th>PT</th><th>Vorm</th></tr></thead><tbody>'+rows.map(r=>'<tr><td>'+r.rank+'</td><td>'+esc(r.team.name)+'</td>'+[r.all.played,r.all.win,r.all.draw,r.all.lose,r.all.goals.for,r.all.goals.against,r.goalsDiff,r.points].map(v=>'<td>'+v+'</td>').join('')+'<td>'+esc(r.form)+'</td></tr>').join('')+'</tbody></table></section> ';if(state.competition==='eredivisie')h+='<button class="secondary" data-route="statistics">Uitgebreide statistieken</button>';}
const teams47=new Map();for(const f of fixtures())for(const t of [f.home,f.away])teams47.set(String(t.id||t.name),t);if(teams47.size)h+='<section class="panel"><h2>Deelnemende clubs in de beschikbare feed</h2>'+[...teams47.values()].sort((a,b)=>a.name.localeCompare(b.name)).map(t=>'<p>'+Football47.shirt((window.VELDIO_CLUB_DIRECTORY||[]).find(c=>Subpage46.same(c.name,t.name))||t)+' '+esc(t.name)+'</p>').join('')+'</section>';

h+='<section class="panel"><h2>Competitieachtergrond</h2><p>'+esc(c.history)+'</p></section><button class="primary" data-route="competitionNews">Eigen Veldio-artikelen</button>'+source47();const games=fixtures().filter(f=>Date.parse(f.date)>Date.now()||f.status==='FT').sort((a,b)=>Math.abs(Date.parse(a.date)-Date.now())-Math.abs(Date.parse(b.date)-Date.now())).slice(0,12);h+='<h2>Wedstrijden rond deze week</h2>'+games.map(f=>'<section class="panel"><h2>'+esc(f.home.name)+' – '+esc(f.away.name)+'</h2><p>'+esc(f.status==='TBD'?new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',day:'numeric',month:'short'}).format(new Date(f.date)):date(f.date))+' · '+(f.status==='FT'?f.goals.home+' – '+f.goals.away:f.status==='TBD'?'Aftraptijd volgt':'Gepland')+'</p></section>').join('');if(!games.length)h+=unavailable('Wedstrijdgegevens niet vrijgegeven',state.stats.message||'De competitieachtergrond en officiële bron blijven beschikbaar.');return h+'<button class="secondary" id="refresh">Opnieuw laden</button>';}

function unavailable(title,message){return '<section class="panel"><span class="tag">'+(state.loading?'BEZIG MET LADEN':'MOMENTEEL NIET BESCHIKBAAR')+'</span><h2>'+esc(title)+'</h2><p>'+esc(message)+'</p></section>';}let lastBoundary47=Date.now();setInterval(()=>{const now=Date.now();if(fixtures().some(f=>Date.parse(f.date)>lastBoundary47&&Date.parse(f.date)<=now))render();lastBoundary47=now;},1000);render();
