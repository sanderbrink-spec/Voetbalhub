</style></head><body><main><header><button class="back" aria-label="Terug naar vorig scherm" onclick="bridge('back')">‹</button><div><h1 id="heading">Mijn Veldio</h1><p id="subtitle">Jouw clubs. Jouw leeslijst.</p></div></header><nav class="tabs" aria-label="Favorieten"><button id="clubsTab" role="tab" aria-selected="true" onclick="setTab('clubs')">Mijn clubs</button><button id="savedTab" role="tab" aria-selected="false" onclick="setTab('saved')">Bewaard</button></nav><div id="status" class="status" role="status">Gegevens laden…</div><section id="search" hidden><label for="query" class="hidden">Zoek in eigen artikelen</label><div class="search-wrap"><input id="query" type="search" maxlength="160" placeholder="Club, speler of onderwerp" autocomplete="off" aria-label="Zoek in eigen artikelen"><button class="clear" aria-label="Zoekterm wissen" onclick="searchFor('')">×</button></div><div id="suggestions" class="suggestions"></div></section><section id="content"></section></main><script src="page-history.js"></script><script src="club-directory.js"></script><script src="football47.js"></script><script src="image-registry39.js"></script><script src="subpage-model46.js"></script><script src="club-profiles46.js"></script><script src="club-profile-view46.js"></script><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

const bridge=(method,value)=>{if(window.PersonalHub&&typeof window.PersonalHub[method]==='function')window.PersonalHub[method](value??'');};
const validImage=url=>/^https:\/\//i.test(url||'')||/^news-photos\/[a-z0-9-]+\.webp$/.test(url||'')?esc(url):'';
let state={articles:[],saved:[],stats:{},clubs:[],loading:true},initialized=false,selected=new Set(),tab='clubs',editing=false,limit=30,query='';
const trail=new PageTrail();let uiRestored=false,restoreScroll=null;
function uiState(){return {mode:state.mode,tab,editing,limit,query,scrollY:window.scrollY};}
function applyUi(s){uiRestored=true;state.mode=['search','profile','competition'].includes(s.mode)?s.mode:'favorites';tab=s.tab==='saved'?'saved':'clubs';editing=!!s.editing;limit=Math.max(30,Math.min(300,Number(s.limit)||30));query=String(s.query||'').slice(0,160);document.getElementById('query').value=query;restoreScroll=Number(s.scrollY)||0;if(initialized)render();}
function pageBack(){const previous=trail.pop();if(previous)applyUi(previous);else bridge('back');}
function restorePageState(raw){try{const s=trail.restore(raw);if(s)applyUi(s);}catch{}}
function startSearch(value){trail.push(uiState());state.mode='search';searchFor(value);}
function unique(rows){return Subpage46.articles(rows,{maxAge:Infinity});}
function allArticles(){return unique([...(state.articles||[]),...(state.saved||[])]);}
function aliases(name){const n=normalize(name);const map={'psv':['psv','psv eindhoven'],'psv eindhoven':['psv','psv eindhoven'],'nec':['nec','n e c'],'n e c':['nec','n e c'],'sc heerenveen':['sc heerenveen','heerenveen'],'fc groningen':['fc groningen','groningen'],'az':['az','az alkmaar'],'az alkmaar':['az','az alkmaar'],'fc twente':['fc twente','twente'],'fc utrecht':['fc utrecht','utrecht']};return map[n]||[n];}
function mentions(article,club){const hay=' '+normalize([article.headline,article.standfirst,(article.tags||[]).join?.(' ')||''].join(' '))+' ';return aliases(club).some(a=>hay.includes(' '+a+' '));}
function sameClub(a,b){return aliases(a).some(x=>aliases(b).includes(x));}
function clubRows(){const directory=state.directory?.length?state.directory:(window.VELDIO_CLUB_DIRECTORY||[]),teams=directory.map(t=>({...t}));for(const row of state.stats.standings||[]){const t=row.team;if(t&&!teams.some(c=>sameClub(c.name,t.name)))teams.push(t);}return teams;}
function emblem(t){return Football47.shirt(t);}

let savePending=false,saveBefore=[],saveMessage='';
function clubsSaved(ok){if(!savePending)return;if(!ok)selected=new Set(saveBefore);savePending=false;saveMessage=ok?'Clubkeuze op dit apparaat opgeslagen.':'Opslaan mislukt. Je vorige clubkeuze is behouden.';render();}

function isSelected(name){return[...selected].some(x=>sameClub(x,name));}
function date(value,options){try{return new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',...options}).format(new Date(value));}catch{return '';}}
function stamp(a){return date(a.publishedAt,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'});}
function news(rows,empty){const imageSession=VeldioImages39.session();if(!rows.length)return '<div class="panel empty"><h2>'+esc(empty)+'</h2><p>'+(state.loading?'De artikelen worden bijgewerkt.':'Nieuwe artikelen verschijnen hier zodra de redactie ze publiceert.')+'</p></div>';return '<div class="news">'+rows.slice(0,limit).map(a=>'<button class="row" data-article="'+esc(a.id)+'">'+(imageSession.claim(a)&&validImage(a.imageAsset||a.imageUrl)&&['cleared','licensed'].includes(a.imageRights)?'<img class="thumb" alt="" loading="lazy" src="'+validImage(a.imageAsset||a.imageUrl)+'">':'')+'<div class="row-copy"><div class="category">'+esc(a.category||'Veldio')+'</div><h3>'+esc(a.headline)+'</h3><time>'+esc(stamp(a))+'</time></div></button>').join('')+'</div>'+(rows.length>limit?'<button class="pill more" id="more">Meer berichten ('+(rows.length-limit)+')</button>':'');}
function setTab(value){if(tab!==value)trail.push(uiState());tab=value;editing=false;limit=30;render();}
function searchFor(value){query=value;document.getElementById('query').value=value;limit=30;render();}
document.getElementById('query').addEventListener('input',event=>{query=event.target.value;limit=30;render();});
function toggleClub(name){if(savePending)return;saveBefore=[...selected];savePending=true;saveMessage='Clubkeuze opslaan…';if(isSelected(name)){for(const item of [...selected])if(sameClub(item,name))selected.delete(item);}else selected.add(name);bridge('saveClubs',JSON.stringify([...selected]));render();}
function nextFixture(team){return Subpage46.clubData(state.stats,team.name).next;}
function clubsContent(){let h='<div class="club-atmosphere"><span class="eyebrow">MIJN VELDIO</span><h2>Jouw club. Jouw kleuren.</h2><p>Volg je clubs en bewaar jouw voetbal.</p></div><p class="hint" role="status">'+esc(saveMessage)+'</p><div class="section-head"><h2>Mijn favoriete clubs</h2><button class="text-button" id="edit">'+(editing?'Gereed':'Club toevoegen +')+'</button></div>';
 const teams=clubRows();for(const name of selected)if(!teams.some(t=>sameClub(t.name,name)))teams.push({name});
 if(selected.size)h+='<label for="primaryClub">Primaire favoriete club</label><select id="primaryClub">'+[...selected].map(name=>'<option '+(name===state.primaryClub?'selected':'')+'>'+esc(name)+'</option>').join('')+'</select>';
 if(editing){h+='<p class="hint">Tik op een club om deze te volgen. Je keuze wordt lokaal opgeslagen.</p><div class="club-picker">'+teams.map(t=>'<button class="club-choice" '+(savePending?'disabled ':'')+'data-club="'+esc(t.name)+'" aria-pressed="'+isSelected(t.name)+'">'+emblem(t)+'<span>'+esc(t.name)+'</span><span class="check">'+(isSelected(t.name)?'✓':'+')+'</span></button>').join('')+'</div>';if(!teams.length)h+='<p class="hint">De actuele Eredivisieclubs zijn nog niet beschikbaar. Bestaande voorkeuren blijven bewaard.</p>';}
 if(!selected.size){h+='<div class="panel empty"><h2>Volg het voetbal van jouw clubs</h2><p>Kies je clubs voor hun laatste nieuws en eerstvolgende competitiewedstrijd.</p><button class="pill primary" id="choose">Club toevoegen</button></div>';return h;}
 h+='<div class="clubs">'+[...selected].map(name=>{const t=teams.find(t=>sameClub(t.name,name)),standing=t&&(state.stats.standings||[]).find(x=>String(x.team.id)===String(t.id));return '<button class="club" data-filter="'+esc(name)+'">'+emblem(t||{name})+'<span><strong>'+esc(name)+'</strong><small>'+(standing?'Eredivisie · Plaats '+esc(standing.rank)+' · '+esc(standing.points)+' punten':'Gevolgd')+'</small></span><span class="star">★</span></button>';}).join('')+'</div>';
 const fixtures=new Map();for(const t of teams.filter(t=>isSelected(t.name))){const f=nextFixture(t);if(f)fixtures.set(String(f.id),f);}
 if(fixtures.size){h+='<div class="section-head"><h2>Eerstvolgende wedstrijden</h2></div><div class="panel">'+[...fixtures.values()].sort((a,b)=>new Date(a.date)-new Date(b.date)).map(f=>'<div class="fixture"><div class="date">'+esc(date(f.date,{weekday:'long',day:'numeric',month:'short'}))+'</div><div class="teams"><span>'+esc(f.home.name)+'</span><span class="score">'+(f.status==='TBD'?'Tijd volgt':esc(date(f.date,{hour:'2-digit',minute:'2-digit'})))+'</span><span class="away">'+esc(f.away.name)+'</span></div></div>').join('')+'</div>';}
 if(state.stats.updatedAt)h+='<p class="note">Competitiecijfers bijgewerkt: '+esc(date(state.stats.updatedAt,{day:'numeric',month:'short',hour:'2-digit',minute:'2-digit'}))+'</p>';
 const rows=unique(state.articles).filter(a=>[...selected].some(club=>mentions(a,club)));
 return h+'<div class="section-head"><h2>Nieuws van mijn clubs</h2></div>'+news(rows,'Nog geen nieuws van jouw clubs');}
function savedContent(){const rows=unique(state.saved);return '<div class="section-head"><h2>Jouw leeslijst</h2><span class="hint">'+rows.length+' bewaard</span></div><p class="hint">Bewaarde artikelen blijven op dit apparaat beschikbaar, ook zonder internet. Afbeeldingen kunnen internet nodig hebben.</p>'+(rows.length?rows.map(a=>'<div class="saved-row">'+news([a],'')+'<button class="remove" data-remove="'+esc(a.id)+'">Verwijderen uit leeslijst</button></div>').join(''):'<div class="panel empty"><h2>Je leeslijst is nog leeg</h2><p>Open een artikel en tik op Bewaren om het hier terug te vinden.</p></div>');}
function searchContent(){const terms=normalize(query).split(' ').filter(Boolean),rows=allArticles().filter(a=>{const text=normalize([a.headline,a.standfirst,a.category,...(Array.isArray(a.body)?a.body:[])].join(' '));return terms.every(term=>(' '+text+' ').includes(' '+term)||text.includes(term));});
 document.getElementById('suggestions').innerHTML=terms.length?'':[...selected].slice(0,4).concat(['Transfers','Eredivisie']).map(x=>'<button data-suggest="'+esc(x)+'">'+esc(x)+'</button>').join('');
 if(!terms.length)return '<p class="hint">Doorzoek koppen en volledige teksten van eigen artikelen en je leeslijst.</p><div class="section-head"><h2>Alle eigen artikelen</h2></div>'+news(rows,'Nog geen artikelen beschikbaar');
 return '<p class="count" role="status">'+rows.length+' '+(rows.length===1?'artikel':'artikelen')+' voor “'+esc(query)+'”</p>'+news(rows,'Geen artikelen gevonden');}
function render(){const search=state.mode==='search',detail=['profile','competition'].includes(state.mode);document.getElementById('heading').textContent=detail?query:search?'Zoeken':'Mijn Clubs';document.getElementById('subtitle').textContent=search?'Eigen nieuws en je bewaarde artikelen':'Jouw clubs. Jouw leeslijst.';document.querySelector('.tabs').hidden=search||detail;document.getElementById('search').hidden=!search;document.getElementById('clubsTab').setAttribute('aria-selected',tab==='clubs');document.getElementById('savedTab').setAttribute('aria-selected',tab==='saved');document.getElementById('savedTab').textContent='Bewaard'+(state.saved?.length?' ('+state.saved.length+')':'');document.getElementById('status').textContent=state.offline?'Verbinding beperkt · laatst opgeslagen gegevens':state.loading?'Gegevens bijwerken…':'Eigen redactie · Veldio';document.getElementById('content').innerHTML=state.mode==='profile'?profile46():state.mode==='competition'?competition46():search?searchContent():tab==='saved'?savedContent():clubsContent();trail.capture(uiState());if(restoreScroll!==null){const y=restoreScroll;restoreScroll=null;requestAnimationFrame(()=>window.scrollTo(0,y));}}
document.addEventListener('change',e=>{if(e.target.id==='primaryClub')bridge('savePrimary',e.target.value);});
document.addEventListener('error',event=>{if(event.target instanceof HTMLImageElement)event.target.hidden=true;},true);
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.article)bridge('openArticle',b.dataset.article);if(b.dataset.club)toggleClub(b.dataset.club);if(b.dataset.filter)openProfile46(b.dataset.filter);if(b.dataset.remove)bridge('removeSaved',b.dataset.remove);if(b.dataset.suggest)searchFor(b.dataset.suggest);if(b.id==='more'){limit+=30;render();}if(b.id==='edit'||b.id==='choose'){if(editing)pageBack();else{trail.push(uiState());editing=true;render();}}});
function setData(raw){try{const next=JSON.parse(raw);if(initialized&&!savePending)selected=new Set(next.clubs||[]);if(!initialized){selected=new Set(next.clubs||[]);if(!uiRestored)query=next.query||'';document.getElementById('query').value=query;initialized=true;}state={...next,mode:state.mode||next.mode,articles:Array.isArray(next.articles)?next.articles:[],saved:Array.isArray(next.saved)?next.saved:[],stats:Subpage46.current(next.stats)?next.stats:{}};render();}catch{document.getElementById('status').textContent='Gegevens konden niet worden geladen.';}}
</script></body></html>
