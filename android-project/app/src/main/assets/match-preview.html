<!doctype html><html lang="nl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; img-src https://raw.githubusercontent.com https://eredivisie.b-cdn.net https://media.api-sports.io data:; style-src 'unsafe-inline'; script-src 'unsafe-inline';"><title>Voorbeschouwing · Veldio</title><style>
:root{color-scheme:dark;--green:#25f06b;--muted:#9ca9a1}*{box-sizing:border-box}body{margin:0;background:#050807;color:#f5f8f5;font:16px/1.65 system-ui,sans-serif}main{padding:12px 18px 32px;max-width:850px;margin:auto}.eyebrow{font-size:10px;font-weight:800;letter-spacing:1.6px;color:var(--green)}h1{font-size:34px;line-height:1.13;letter-spacing:-.8px;margin:12px 0}h2{font-size:21px;line-height:1.3;margin:28px 0 12px}h3{font-size:15px;color:var(--green);margin:20px 0 0}p{margin:12px 0}.muted,small{color:var(--muted)}.meta{font-size:12px;line-height:1.7}.lead{font-size:17px;color:#d4dfd7}.cover{width:100%;display:block;border-radius:14px;margin:18px 0 8px}.credit{font-size:10px;color:var(--muted);margin:0 0 18px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:20px 0}.panel{background:#0e1812;border:1px solid #203329;border-radius:13px;padding:14px}.panel .points{font-size:34px;line-height:1.3;font-weight:800;color:var(--green)}.panel .unit{font-size:11px;font-weight:600}.panel small{display:block;font-size:11px}.match{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:10px;padding:13px 0;border-bottom:1px solid #203027;font-size:13px}.match .away{text-align:right}.score{font-size:16px;font-weight:750;text-align:center;white-space:nowrap}.match small{display:block;text-align:center;font-size:10px}.body p{color:#d8e0d9;line-height:1.85}.badge{font-size:10px;padding:4px 7px;background:#123521;color:var(--green);border-radius:5px}.empty{color:var(--muted);font-size:13px}.form{display:flex;gap:5px;margin-top:10px}.form span{font-size:10px;border-radius:4px;padding:2px 5px;background:#1c3023}.form .W{color:#66fa99}.form .V{color:#f8a28c}footer{border-top:1px solid #223429;margin-top:30px;padding-top:16px;font-size:11px;color:var(--muted)}

/* Veldio 40: shared WebView surface, typography and interaction tokens. */
:root{--bg:#020805;--green:#a9ff35;--panel:#0c2115;--muted:#b0c6b7;--border:#3c6549;color-scheme:dark}
body{background:radial-gradient(ellipse at 100% 0,#10321d55,transparent 430px),#020805!important;color:#f3f8f4;font-family:system-ui,sans-serif!important}
main{padding-bottom:max(32px,env(safe-area-inset-bottom));overflow-wrap:anywhere}
h1,h2,h3{color:#f3f8f4;letter-spacing:-.025em}h1{line-height:1.15}p{line-height:1.7}article{max-width:720px;margin-inline:auto}article p{line-height:1.85}
.panel,.card,.club,.fixture,.match,.archive-card,.facts,.question-card,.result-card,.empty,.error{border:1px solid var(--border);border-radius:18px;background:linear-gradient(135deg,#153321dd,#030b07);box-shadow:inset 0 1px #d4ffe512,0 6px 20px #0004}
.panel,.empty,.error{padding:18px}.fixture,.match{padding:14px;margin-block:8px}.club,.row,.tile{box-shadow:inset 0 1px #caffe514,0 5px 16px #0005}
header,nav{background-color:#020805ed!important}header{border-bottom:1px solid #254a31}
button,input,select,textarea{font:inherit}button{min-height:44px;border-radius:12px;transition:transform 130ms,box-shadow 130ms}button:active{transform:scale(.98)}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #a9ff35;outline-offset:3px}
button.primary,.primary{color:#092002;background:linear-gradient(135deg,#c1ff68,#8ce51c);font-weight:750;box-shadow:0 2px 14px #89ff2620}
input,select,textarea{background:#05120b!important;color:#f3f8f4;border:1px solid #496c53;border-radius:12px;min-height:46px;padding:12px;max-width:100%}
img{max-width:100%}.hero,figure img,.archive-card img{border-radius:18px;box-shadow:0 8px 24px #0007}.hero{border:1px solid #487450}
.hero:has(h1),.hero:has(h2){background:linear-gradient(110deg,#031109ed,#03110965),url('premium40/news.webp') center/cover}
.row{background:linear-gradient(130deg,#112b1b,#040c07);border:1px solid #31513b;border-radius:16px;padding:12px}.row .thumb{border-radius:11px}
table{font-variant-numeric:tabular-nums}thead{background:#112d1c}td,th{padding:13px 8px!important}tbody tr:nth-child(even){background:#10251750}.points,.tag,.eyebrow,.category{color:#a9ff35!important}
.scores{gap:12px}.quiet,.muted,.note,small{color:#b0c6b7}.facts{border-left:3px solid #a9ff35}.archive-copy{padding:20px}.intro{font-size:19px}
.answer{min-height:58px;border-radius:15px}.answer.correct{background:#173e23!important;border-color:#a9ff35!important}.answer.wrong{border-color:#ff9b8c!important}.timer{accent-color:#a9ff35}
@media(max-width:359px){h1{font-size:25px!important}main{padding-inline:12px}.panel{padding:14px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

body[data-section=fixtures] main:before{background-image:url('premium40/fixtures.webp')}body[data-section=predictions] main:before{background-image:url('premium40/predictions.webp')}body[data-section=myclub] main:before{background-image:url('premium40/myclub.webp')}

</style></head><body><main id="article"><span class="eyebrow">WEDSTRIJD VAN DE WEEK</span><h1>Voorbeschouwing laden</h1></main><script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const format=(s,opts)=>new Intl.DateTimeFormat('nl-NL',{timeZone:'Europe/Amsterdam',...opts}).format(new Date(s));
function imageCredit(feature){return '<p class="credit">'+esc(feature.imageCaption||'')+' '+esc(feature.imageCredit||'')+(/^https:\/\/commons\.wikimedia\.org\//.test(feature.imageReview?.rightsEvidence||'')?' · <a href="'+esc(feature.imageReview.rightsEvidence)+'">Bron</a>':'')+(/^https:\/\/creativecommons\.org\//.test(feature.imageLicenseUrl||'')?' · <a href="'+esc(feature.imageLicenseUrl)+'">Licentie</a>':'')+'</p>';}
function match(f){return '<div class="match"><div>'+esc(f.home.name)+'</div><div class="score">'+esc(f.goals.home)+' – '+esc(f.goals.away)+'<small>'+esc(format(f.date,{day:'numeric',month:'short',year:'numeric'}))+'</small></div><div class="away">'+esc(f.away.name)+'</div></div>';}
function setData(raw){try{
 const data=JSON.parse(raw),feature=data.featured,report=feature?.phase==='report',p=report?feature.report:feature?.preview,f=p?.fixture;if(data.schemaVersion!==1||data.league?.id!==88||!f?.home?.name||!f.away?.name||!Array.isArray(p.body)||p.body.length<3)throw Error('Missing preview');
 if(report){
  if(!['FT','AET','PEN'].includes(f.status)||![f.goals?.home,f.goals?.away].every(n=>Number.isInteger(n)&&n>=0))throw Error('Unconfirmed final score');
  document.title=f.home.name+' – '+f.away.name+' · Wedstrijdverslag';
  let reportHtml='<span class="eyebrow">NA AFLOOP · '+esc(feature.round)+'</span><h1>'+esc(p.headline)+'</h1><p class="meta muted">'+esc(format(f.date,{day:'numeric',month:'long',year:'numeric'}))+'</p>';
  if(/^https:\/\/raw\.githubusercontent\.com\/sanderbrink-spec\/Voetbalhub\//.test(feature.imageUrl||''))reportHtml+='<img class="cover" alt="Beeld bij '+esc(f.home.name)+' tegen '+esc(f.away.name)+'" src="'+esc(feature.imageUrl)+'">'+imageCredit(feature);
  reportHtml+='<p class="lead">'+esc(p.standfirst)+'</p><h2>Het wedstrijdverslag</h2><article class="body">'+p.body.map(x=>'<p>'+esc(x)+'</p>').join('')+'</article><footer>Veldio Redactie · Oorspronkelijk resultaatverslag op basis van bevestigde wedstrijdgegevens.<br>'+esc(data.source||'')+'</footer>';
  document.getElementById('article').innerHTML=reportHtml;return;
 }
 document.title=f.home.name+' – '+f.away.name+' · Voorbeschouwing';
 let h='<span class="eyebrow">VOORAF · '+esc(feature.round)+'</span><h1>'+esc(f.home.name)+' – '+esc(f.away.name)+'</h1><p class="meta muted">'+esc(format(f.date,{weekday:'long',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+(f.venue?.name?' · '+esc(f.venue.name):'')+'</p>';
 if(/^https:\/\/raw\.githubusercontent\.com\/sanderbrink-spec\/Voetbalhub\//.test(feature.imageUrl||'')){h+='<img class="cover" alt="Aankondiging '+esc(f.home.name)+' tegen '+esc(f.away.name)+'" src="'+esc(feature.imageUrl)+'">';if(feature.imageCredit)h+=imageCredit(feature);}
 const observed=feature.observedFixture;if(observed&&(['PST','CANC','SUSP','ABD','INT'].includes(observed.status)||observed.date!==f.date||JSON.stringify(observed.venue)!==JSON.stringify(f.venue)))h+='<p class="meta muted">Let op: wedstrijdstatus of planning is gewijzigd. Status: '+esc(observed.status)+'. Dit is de laatst gepubliceerde voorbeschouwing.</p>';
 h+='<p class="lead">'+esc(p.standfirst)+'</p><div class="comparison">';
 for(const team of [f.home,f.away]){const t=data.standings.find(x=>x.team.id===team.id);if(t)h+='<div class="panel"><strong>'+esc(team.name)+'</strong><div class="points">'+t.points+' <span class="unit">PT</span></div><small>Plaats '+t.rank+' · '+t.all.played+' duels</small><div class="form">'+String(t.form||'').split('').map(x=>'<span class="'+esc(x)+'">'+esc(x)+'</span>').join('')+'</div></div>';}
 h+='</div><h2>De voorbeschouwing</h2><article class="body">'+p.body.map(x=>'<p>'+esc(x)+'</p>').join('')+'</article><h2>Recente vorm</h2>';
 for(const [name,rows]of [[f.home.name,p.homeForm],[f.away.name,p.awayForm]]){h+='<h3>'+esc(name)+'</h3>'+((rows||[]).map(match).join('')||'<p class="empty">Geen recente competitieduels beschikbaar.</p>');}
 h+='<h2>Onderlinge ontmoetingen</h2>'+((p.headToHead||[]).map(match).join('')||'<p class="empty">Geen gecontroleerde onderlinge cijfers beschikbaar.</p>');
 h+='<h2>Doelpuntenmakers</h2>'+((p.scorers||[]).map(x=>'<div class="match"><div>'+esc(x.name)+'</div><strong class="score">'+esc(x.goals)+'</strong><div class="away muted">'+esc(x.team)+'</div></div>').join('')||'<p class="empty">Geen spelers uit deze clubs in de beschikbare topscorerslijst.</p>');
 h+='<footer>Veldio Redactie · Voorbeschouwing op basis van de beschikbare wedstrijdcijfers.<br>Gegevens bijgewerkt: '+esc(format(data.updatedAt,{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}))+'.<br>'+esc(data.source||'')+'</footer>';
 document.getElementById('article').innerHTML=h;
 }catch(e){document.getElementById('article').innerHTML='<h1>Voorbeschouwing niet beschikbaar</h1><p class="muted">Ga terug naar het nieuws en open de wedstrijd opnieuw.</p>';}}
</script></body></html>
