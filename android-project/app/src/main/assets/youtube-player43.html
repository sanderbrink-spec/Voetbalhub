<!doctype html><html lang="nl"><head><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="strict-origin-when-cross-origin"><meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://www.youtube.com https://s.ytimg.com; style-src 'unsafe-inline'; frame-src https://www.youtube.com; connect-src https://www.youtube.com"><style>html,body{margin:0;width:100%;height:100%;background:#000;color:white;font:14px sans-serif}#player{width:100%;height:100%}#status{display:none;background:#07120b;padding:12px}body.error #player{height:calc(100% - 64px)}body.error #status{display:block}</style></head><body><div id="player"></div><div id="status" role="status"></div><script>
let player,ready=false;setTimeout(()=>{if(!ready)message("YouTube reageert niet. Controleer je verbinding of gebruik de YouTube-knop onder de speler.");},15000);
function message(text){document.body.classList.add('error');document.getElementById('status').textContent=text;}
function onYouTubeIframeAPIReady(){player=new YT.Player('player',{width:'100%',height:'100%',videoId:'__VIDEO_ID__',playerVars:{autoplay:1,controls:1,playsinline:1,fs:1,origin:'__ORIGIN__'},events:{onReady:e=>{ready=true;e.target.playVideo();},onAutoplayBlocked:()=>message('Tik op de afspeelknop van YouTube om te starten.'),onStateChange:e=>{if(e.data===1)document.body.classList.remove('error');},onError:e=>message('Afspelen niet beschikbaar ('+e.data+'). Deze video bekijken op YouTube via de knop onder de speler.')}});}
function pauseVeldio(){if(player&&player.pauseVideo)player.pauseVideo();}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pauseVeldio();});
const api=document.createElement('script');api.src='https://www.youtube.com/iframe_api';api.onerror=()=>message('YouTube kan niet worden geladen. Controleer je verbinding of open YouTube.');document.head.appendChild(api);
</script></body></html>
